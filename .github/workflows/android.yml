name: Android apps
# v45 (owner 2026-10-13: «أريده أن يكون ينزل تنزيل … التنزيل المجاني»): builds the four Khair Mart Android apps (Trusted
# Web Activities — the web apps full screen in the phone's Chrome) and publishes them on the GitHub release "android":
#   https://github.com/officezied-prog/zied/releases/download/android/khair-<owner|kasir|sales|gudang>.apk
# The signing key is made on the first run on main and kept in the repo ENCRYPTED with the secret ANDROID_KEY_PASSWORD
# (set by the owner in Settings → Secrets and variables → Actions; never in the repo). Without the secret the apps are
# still built (throw-away key) to check the build, but nothing is published.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['khair-pos/android/**', '.github/workflows/android.yml', 'khair-pos/**/manifest.webmanifest', 'khair-pos/**/icon-*.png']
  pull_request:
    paths: ['khair-pos/android/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # v71 security: the signing password is given only to the two steps that need it (never to npm ci), and a pull request
    # never opens the real key — it builds with a throw-away key only, to check the build.
    env:
      ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Signing key
        id: key
        env:
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ENC=khair-pos/android/khair-release.p12.enc
          KS="$RUNNER_TEMP/khair-release.p12"
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            if [ "$EVENT_NAME" = pull_request ]; then echo "Pull request: built with a throw-away key only (the real key is never opened here)."
            else echo "::notice title=Android apps not published::The repository secret ANDROID_KEY_PASSWORD is not set (Settings → Secrets and variables → Actions). The apps are built with a throw-away key only to check the build."; fi
            export ANDROID_KEY_PASSWORD="throwaway-$(openssl rand -hex 12)"; echo "KHAIR_THROWAWAY_PASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "publish=0" >> "$GITHUB_OUTPUT"; NEWKEY=throwaway
          elif [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$KS" -pass env:ANDROID_KEY_PASSWORD
            echo "publish=$ON_MAIN" >> "$GITHUB_OUTPUT"; NEWKEY=no
          else
            echo "publish=$ON_MAIN" >> "$GITHUB_OUTPUT"; NEWKEY=yes
          fi
          if [ "$NEWKEY" != no ]; then
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KS" -alias khair -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$ANDROID_KEY_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -dname "CN=Khair Mart, O=Khair Mart, L=Jakarta, C=ID"
          fi
          FP=$(keytool -list -v -storetype PKCS12 -keystore "$KS" -alias khair -storepass "$ANDROID_KEY_PASSWORD" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)
          echo "Signing certificate SHA-256: $FP"
          echo "KEYSTORE=$KS" >> "$GITHUB_ENV"
          # the real key is kept (encrypted) together with the asset-links file, once, on main
          if [ "$NEWKEY" = yes ] && [ "$ON_MAIN" = true ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -out "$ENC" -pass env:ANDROID_KEY_PASSWORD
            node khair-pos/android/assetlinks.mjs "$FP" > khair-pos/android/assetlinks.json
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC" khair-pos/android/assetlinks.json
            git commit -m "Android: signing key (encrypted with ANDROID_KEY_PASSWORD) and Digital Asset Links [skip ci]"
            git push
          fi
      - name: Install the build tools
        working-directory: khair-pos/android
        run: npm ci --no-audit --no-fund
      - name: Build the four apps
        working-directory: khair-pos/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
          KHAIR_KEY_SECRET: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          export ANDROID_KEY_PASSWORD="${KHAIR_THROWAWAY_PASS:-$KHAIR_KEY_SECRET}"
          node build.mjs
          ls -l out
      - name: Keep the files of this run (7 days)
        uses: actions/upload-artifact@v4
        with: { name: khair-android-apks, path: khair-pos/android/out/*.apk, retention-days: 7 }
      - name: Publish (release "android", stable download links)
        if: steps.key.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view android >/dev/null 2>&1 || gh release create android --title "Khair Mart — aplikasi Android" --latest=false \
            --notes "Unduh dan pasang: khair-owner.apk (pemilik/manajer/akuntan), khair-kasir.apk (kasir), khair-sales.apk (sales), khair-gudang.apk (gudang dingin)."
          gh release upload android khair-pos/android/out/*.apk --clobber
          gh release edit android --notes "Versi 1.${{ github.run_number }} ($(date -u +%Y-%m-%d)). Unduh dan pasang: khair-owner.apk (pemilik/manajer/akuntan), khair-kasir.apk (kasir), khair-sales.apk (sales), khair-gudang.apk (gudang dingin)."
