target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "S101",    # asserts are the point in tests
  "E501",    # long lines are caught by the formatter
  "RUF012",
]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "SLF001", "E702"]
