<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- security M8: CSP (GitHub Pages cannot send headers). connect-src = the n8n webhooks only. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://ziedapp.app.n8n.cloud; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1E40AF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khair Kasir">
<meta name="description" content="Khair Kasir — aplikasi kasir sederhana Khair Mart">
<title>Khair Kasir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ========== Tokens (store logo: blue + red) ========== */
:root{
  --p:#1E40AF; --pd:#1E3A8A; --pt:#DBEAFE; --pll:#EFF6FF;
  --red:#DC2626; --redd:#B91C1C; --redt:#FEE2E2;
  --ok:#0F766E; --okt:#CCFBF1; --warn:#B45309; --warnt:#FEF3C7;
  --bg:#F1F5F9; --card:#FFFFFF; --text:#0F172A; --muted:#475569; --line:#E2E8F0; --line2:#CBD5E1;
  --r:14px; --rs:10px; --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.06); --shadow-l:0 12px 40px rgba(15,23,42,.25);
  --top:56px; --tabs:64px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic","Geeza Pro",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
a{color:var(--p)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13.5px} .red{color:var(--red)} .okc{color:var(--ok)}
.center{text-align:center} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px} .row.wrap{flex-wrap:wrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========== Controls ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--card);font-weight:700;line-height:1.1;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--pll)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn.primary:hover{background:var(--pd)}
.btn.danger{color:var(--redd);border-color:#FCA5A5}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.xs{min-height:34px;padding:0 10px;font-size:14px;border-radius:8px}
.btn.big{min-height:58px;font-size:18px}
.btn.block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--card);padding:0;flex:none}
.icon-btn.ghost{border-color:transparent;background:transparent}
.icon-btn.sm{width:40px;height:40px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--rs);background:#fff;font-size:16px}
textarea.input{min-height:48px;resize:vertical}
.input:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(30,64,175,.2)}
.input.num{text-align:end}
.input.money{font-size:22px;font-weight:800;text-align:end}
label.f{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:flex-start;gap:10px;min-height:48px;padding:10px 12px;cursor:pointer;background:var(--pll);border-radius:var(--rs);margin-bottom:12px}
.check input{width:24px;height:24px;accent-color:var(--p);flex:none;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:52px;border-radius:var(--rs);border:1px solid var(--line2);background:#fff;font-weight:800;font-size:15px;padding:0 4px}
.seg button.on{background:var(--p);color:#fff;border-color:var(--p)}
.seg button:disabled{opacity:.45}
.seg.seg2{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:15px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--pt);color:var(--pd);white-space:nowrap}
.badge.red{background:var(--redt);color:var(--redd)}
.badge.ok{background:var(--okt);color:var(--ok)}
.badge.warn{background:var(--warnt);color:var(--warn)}
.badge.gray{background:#E2E8F0;color:#334155}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);min-height:64px;text-align:start;width:100%;color:var(--text)}
button.li:hover{border-color:var(--p)}
.li .t{font-weight:800}
.li .s{font-size:13.5px;color:var(--muted)}
.li > svg.i{color:var(--p)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}

/* ========== Shell ========== */
#app{display:grid;grid-template-rows:var(--top) 1fr var(--tabs);height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;background:var(--p);color:#fff;z-index:20;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;position:relative}
.mark::after{content:"";position:absolute;inset-inline-end:-3px;bottom:-3px;width:12px;height:12px;border-radius:4px;background:var(--red);border:2px solid var(--p)}
.top .ttl{min-width:0;line-height:1.15}
.top .ttl b{display:block;font-size:16px}
.top .ttl span{font-size:13px;opacity:.9}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:14px;white-space:nowrap}
.pill b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12.5px;padding:0 6px}
.pill.warn{background:#FEF3C7;color:#78350F}
.top .icon-btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;width:42px;height:42px}
.demo{background:#FEF3C7;color:#78350F;border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:900}
main{overflow:hidden;position:relative;min-width:0}
.view{height:100%;overflow-y:auto;padding:14px 14px 28px}
.view.sell{padding:0;overflow:hidden}
.wrapc{max-width:760px;margin:0 auto}
.view h1{font-size:21px;margin:2px 0 12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(15,23,42,.05);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:800;position:relative;min-width:0;padding:4px 2px}
.tab span{max-width:100%;overflow:hidden;line-height:1.1;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tab.on{color:var(--p)}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--p)}
.tab .dot{position:absolute;top:6px;inset-inline-end:calc(50% - 24px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}

/* ========== Sell ========== */
.sell-wrap{display:grid;grid-template-columns:1fr;height:100%}
.sell-main{display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px 10px 0}
.scanbar{display:flex;gap:8px;margin-bottom:8px}
.search{position:relative;flex:1}
.search svg.i{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-inline-start:44px;min-height:54px;font-size:17px;border-width:2px;border-color:var(--line2)}
.scanbar .icon-btn{width:54px;height:54px;color:var(--p);border-width:2px}
.tools{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.toggle{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line2);background:#fff;font-weight:800;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;flex:none}
.toggle[aria-pressed="true"]{background:var(--pt);border-color:var(--p);color:var(--pd)}
.cust-chip{flex:1;min-width:0;min-height:44px;padding:0 14px;border-radius:999px;border:2px dashed var(--line2);background:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;text-align:start}
.cust-chip.set{border-style:solid;border-color:var(--p);background:var(--pll);color:var(--pd)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;grid-auto-rows:max-content;padding:2px 2px 150px}
.pc{display:flex;flex-direction:column;gap:3px;text-align:start;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;min-height:118px;box-shadow:var(--shadow);position:relative;color:var(--text)}
.pc:active{transform:scale(.98);background:var(--pll)}
.pc .nm{font-weight:800;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.pc .pr{font-weight:900;font-size:17px;color:var(--pd);margin-top:auto}
.pc .gr{font-size:12.5px;color:var(--muted);font-weight:700}
.pc .st{font-size:12.5px;color:var(--muted)}
.pc .st.low{color:var(--redd);font-weight:800}
.pc .incart{position:absolute;top:8px;inset-inline-end:8px;min-width:26px;height:26px;border-radius:13px;background:var(--p);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;padding:0 6px}
.cart{display:flex;flex-direction:column;min-height:0;background:#fff;position:fixed;inset:0;z-index:60;transform:translateY(105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top)}
.cart.open{transform:none}
.cart-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cart-head h2{flex:1;margin:0;font-size:18px}
.mute.on{background:var(--redt);color:var(--redd);border-color:#FCA5A5}
.toggle.mute-chip.on{background:var(--redt);color:var(--redd);border-color:#FCA5A5}
.pay-mute{margin-top:10px}
.lines{flex:1;overflow-y:auto;padding:4px 12px}
.cl{padding:10px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}
.cl .a{display:flex;gap:8px;align-items:flex-start}
.cl .nm{flex:1;font-weight:800;font-size:15.5px;line-height:1.25}
.cl .lt{font-weight:900;font-size:16px}
.cl .b{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:2px solid var(--line2);border-radius:12px;overflow:hidden}
.qty button{width:48px;height:46px;border:0;background:var(--pll);font-size:24px;font-weight:900;color:var(--p)}
.qty input{width:64px;height:46px;border:0;text-align:center;font-weight:900;font-size:17px;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.pt{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#E2E8F0;color:#334155}
.pt.grosir{background:var(--pt);color:var(--pd)}
.cart-foot{border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#F8FAFC}
.total-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:24px;color:var(--pd);padding:2px 0 8px}
.pay-btn{width:100%;min-height:64px;border-radius:14px;border:0;background:var(--p);color:#fff;font-size:22px;font-weight:900;letter-spacing:.5px}
.pay-btn:disabled{opacity:.45}
.paybar{position:fixed;inset-inline:10px;bottom:calc(var(--tabs) + 10px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:8px;align-items:stretch}
.paybar .sum{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;border:0;background:var(--pd);color:#fff;box-shadow:var(--shadow-l);text-align:start;min-height:62px}
.paybar .sum b{display:block;font-size:19px}
.paybar .sum span{font-size:13.5px;opacity:.92}
.paybar .go{min-width:116px;border-radius:14px;border:0;background:var(--p);color:#fff;font-size:20px;font-weight:900;box-shadow:var(--shadow-l);border:2px solid #fff}
.paybar .go:disabled{opacity:.6}
.foot-btns{display:flex;gap:8px}
.foot-btns .pay-btn{flex:1;min-width:0}
.hold-btn{min-height:64px;min-width:104px;border-radius:14px;border:2px solid var(--line2);background:#fff;color:var(--pd);font-size:17px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.tools:has(.held-chip:not([hidden])){flex-wrap:wrap}
.tools:has(.held-chip:not([hidden])) .cust-chip{flex-basis:150px}
.held-chip{flex:none;min-height:44px;padding:0 12px;border-radius:999px;border:2px solid var(--p);background:var(--pt);color:var(--pd);font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.held-chip.old{border-color:#F59E0B;background:var(--warnt);color:#78350F}
.held{flex-wrap:wrap}
.held.old{border-color:#FCD34D;background:#FFFBEB}
.held .acts{display:flex;gap:8px;width:100%;justify-content:flex-end}
/* Quantity sheet (tap a product → how many?) */
.qs-info{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.qs-info .pr{font-weight:900;font-size:18px;color:var(--pd)}
.qs-info .gr{font-size:14px;font-weight:800;color:var(--pd);background:var(--pt);border-radius:999px;padding:2px 10px}
.qs-row{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:stretch}
.qs-row button{height:68px;border-radius:14px;border:2px solid var(--line2);background:var(--pll);font-size:32px;font-weight:900;color:var(--p)}
.qs-row input{height:68px;width:100%;min-width:0;border-radius:14px;border:2px solid var(--p);text-align:center;font-size:36px;font-weight:900;-moz-appearance:textfield;background:#fff}
.qs-row input:focus{outline:none;box-shadow:0 0 0 3px rgba(30,64,175,.2)}
.qs-row input::-webkit-outer-spin-button,.qs-row input::-webkit-inner-spin-button{-webkit-appearance:none}
.qs-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.qs-chips button{flex:1 0 52px;min-height:48px;border-radius:12px;border:2px solid var(--line2);background:#fff;font-weight:900;font-size:17px}
.qs-chips button.on{background:var(--p);border-color:var(--p);color:#fff}
.qs-chips button.g{flex-basis:100px;border-style:dashed;border-color:var(--p);color:var(--pd)}
.qs-chips button.g.on{border-style:solid;color:#fff}
.qs-total{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--pll);margin-top:8px}
.qs-total b{font-size:22px;color:var(--pd)}
.qs-warn{color:var(--redd);font-weight:800;font-size:14px;min-height:20px;margin-top:6px}
.qs-ok{flex:1;min-height:60px;font-size:20px}
@media (min-width:900px){
  .sell-wrap{grid-template-columns:1fr 410px}
  .sell-main{padding:14px 16px 0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding-bottom:20px}
  .cart{position:static;transform:none;border-inline-start:1px solid var(--line);z-index:auto;padding-top:0}
  .cart .close{display:none}
  .paybar{display:none}
}

/* ========== Modal / toast ========== */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .12s}
.modal{background:#fff;width:100%;max-width:560px;max-height:94dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:18px 18px 0 0;box-shadow:var(--shadow-l)}
.modal-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1;margin:0;font-size:19px}
.modal-b{padding:14px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#F8FAFC}
@media (min-width:700px){ .modal-bg{align-items:center;padding:16px} .modal{border-radius:18px;max-height:calc(100dvh - 32px)} }
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + 86px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#0F172A;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-l);font-weight:700;font-size:15px;animation:fade .15s;text-align:center}
.toast.err{background:var(--redd);color:#fff;margin:0;min-height:0;text-align:center} .toast.ok{background:#134E4A} .toast.warn{background:#78350F}

/* ========== Login / gate ========== */
.screen{position:fixed;inset:0;background:linear-gradient(165deg,#1E40AF 0%,#1E3A8A 70%);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.screen-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-l);width:100%;max-width:420px;padding:20px 18px;margin:auto}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:21px;margin-bottom:14px}
.brand .mark{background:var(--p);color:#fff}
.brand .mark::after{border-color:#fff}
.screen-card h2{text-align:center;font-size:19px;margin:0 0 14px}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.users button{min-height:72px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.users button span{font-size:14px;font-weight:700;color:var(--muted)}
.users button{flex-direction:row;flex-wrap:wrap;gap:0 6px;padding:6px 10px;text-align:center}
.rsbox{margin:8px 0;padding:10px 12px;border-radius:var(--rs);background:var(--pll)}
.rsbox .toggle{width:100%;justify-content:center}
.users button:hover{border-color:var(--p)}
.who{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.who b{font-size:21px}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 14px;min-height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--p);display:block}
.dots i.f{background:var(--p)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:64px;border-radius:14px;border:1px solid var(--line);background:#F8FAFC;font-size:26px;font-weight:800;color:var(--text)}
.pinpad button:active{background:var(--pt)}
.pinpad button.ok{background:var(--p);color:#fff;font-size:18px}
.pinpad[data-locked] button,.pinpad button:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--redd);text-align:center;font-weight:700;min-height:22px;margin:6px 0}
.foot-links{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.langs{display:flex;gap:6px}
.owner-link{font-weight:800;text-decoration:none;padding:8px 4px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick .btn{flex:1 0 auto}

/* ========== Receipt ========== */
.receipt{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;font-size:13px;line-height:1.35;color:#000;background:#fff;margin:0 auto;padding:12px 10px;border:1px dashed var(--line2);max-width:330px;direction:ltr;text-align:left}
.receipt.w58{max-width:260px}
.receipt .c{text-align:center} .receipt .b{font-weight:700} .receipt .big{font-size:16px;font-weight:800}
.receipt .ln{border-top:1px dashed #000;margin:6px 0}
.receipt .r2{display:flex;justify-content:space-between;gap:6px}
.receipt .it{margin:3px 0}
.receipt .stamp{border:2px solid #000;text-align:center;font-weight:800;padding:3px;margin:6px 0}
#print-area{display:none}

/* ========== Pay sheet ========== */
.pay-total{text-align:center;padding:4px 0 10px}
.pay-total .k{font-size:14px;color:var(--muted);font-weight:700}
.pay-total .v{font-size:34px;font-weight:900;color:var(--pd)}
.result{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:20px;padding:10px 14px;border-radius:12px;margin:8px 0;background:var(--pll);color:var(--pd)}
.result.debt{background:var(--warnt);color:var(--warn)}
.result.err{background:var(--redt);color:var(--redd)}
details.more{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
details.more summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:700;color:var(--muted)}

/* ========== Survey ========== */
.sq{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px}
.sq .q{font-weight:800;margin-bottom:6px}
.sq .a{display:flex;gap:8px;align-items:flex-start}
.sq textarea{flex:1}
.mic{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;flex:none;color:var(--p)}
.mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
.interim{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}70%{box-shadow:0 0 0 10px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
/* Voice survey in the payment window (consent tap → recording) */
.vs{border:2px solid var(--p);background:var(--pll);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.vs-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
.vs-hint{font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.vs-go{width:100%;min-height:58px;font-size:17px;white-space:normal}
.vs.rec{border-color:var(--red);background:#FFF5F5}
.vs.rec .vs-h{color:var(--redd)}
.vs.done{border-color:#5EEAD4;background:var(--okt)}
.vs.done .vs-h{color:var(--ok);font-size:15px}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.2s infinite}
.vs-qs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.vs-qs label{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;line-height:1.3;padding:5px 6px;border-radius:8px;background:#fff;cursor:pointer}
.vs-qs input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ok)}
.vs-qs input:checked+span{text-decoration:line-through;color:var(--muted)}
.vs-tx{font-size:13px;color:var(--muted);margin-top:6px;max-height:5.4em;overflow-y:auto;overflow-wrap:anywhere}
.vs-tx:empty{display:none}
.vs-tx i{color:#94A3B8}
.vs-links{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center;margin:-4px 0 8px}
.vs .vs-links{margin:6px 0 0}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 2px;border:0;background:none;color:var(--p);font-weight:800;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.linkbtn svg.i{width:18px;height:18px}
/* After payment: the customer's WhatsApp number */
.wa-card{border:1px solid var(--line2);border-radius:14px;padding:12px;margin-bottom:12px;background:#F8FAFC}
.wa-card .wa-h{display:flex;align-items:center;gap:8px;font-weight:900;margin-bottom:8px;flex-wrap:wrap}
.wa-card .wa-h svg.i{color:#15803D}
.wa-remind{font-size:14px;font-weight:800;color:var(--warn);background:var(--warnt);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.wa-card .check{margin-bottom:8px;background:#fff;border:1px solid var(--line)}
.wa-done{font-weight:800;color:var(--ok);margin-bottom:8px;overflow-wrap:anywhere}
.wa-send{background:#15803D;border-color:#15803D;color:#fff}
.wa-send:hover{background:#166534}
.cam video{width:100%;border-radius:var(--rs);background:#000;max-height:60vh}

/* ========== Approvals, photos, shift ========== */
.apr-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.apr-sum div{background:#F8FAFC;border-radius:8px;padding:8px 10px}
.apr-sum .k{font-size:12px;color:var(--muted);font-weight:700}
.apr-sum .v{font-weight:900;font-size:16px}
.apr-card{margin-bottom:12px}
.choice{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:520px){ .choice{grid-template-columns:1fr 1fr} }
.choice .btn{min-height:72px;white-space:normal;text-align:center;font-size:17px}
.wait{text-align:center;padding:6px 0}
.wait .rid{font-size:28px;font-weight:900;letter-spacing:1px;color:var(--pd)}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--pt);border-top-color:var(--p);animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.picker button{min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--line2);background:#fff;font-weight:800}
.picker button.on{background:var(--p);border-color:var(--p);color:#fff}
.status{border-radius:14px;padding:14px;margin-bottom:12px;border:2px solid var(--line2);background:#F8FAFC}
.status .st{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
.status.cocok{border-color:#5EEAD4;background:var(--okt)} .status.cocok .st{color:var(--ok)}
.status.tidak_cocok{border-color:#FCA5A5;background:var(--redt)} .status.tidak_cocok .st{color:var(--redd)}
.status.perlu_cek{border-color:#FCD34D;background:var(--warnt)} .status.perlu_cek .st{color:var(--warn)}
.status.need{border-color:var(--p);background:var(--pll)} .status.need .st{color:var(--pd)}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
.tbl th{text-align:start;font-size:12px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}
.tbl .r{text-align:end}
.thumb{width:88px;height:88px;border-radius:12px;object-fit:cover;background:var(--pll);display:grid;place-items:center;color:var(--p);flex:none;border:1px solid var(--line)}
.step{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pu-line{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.pu-line.unmatched{border-color:#FCD34D;background:#FFFBEB}
.pu-line .note{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.pu-line .g3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.kas-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kas-big .btn{min-height:78px;flex-direction:column;gap:4px;white-space:normal;text-align:center}
.kas-big .btn svg.i{width:26px;height:26px;color:var(--p)}
.kas-big .btn.primary svg.i{color:#fff}

/* ========== Devices (v11), goods-in vs the supplier note (v12), payments with the transfer slip (v13) ========== */
.pill.loc{background:#fff;color:var(--pd);min-height:32px;padding:0 9px;font-size:15px}
#locblock{z-index:55}
.lb-ic{font-size:46px;text-align:center;line-height:1;margin-bottom:6px}
.dev-note{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--pll);font-weight:700;margin-bottom:10px}
.dev-note .e{font-size:30px;line-height:1}
.pu-line.diff{border-color:#FCA5A5;background:#FFF5F5}
.pu-line .noteq{font-size:13px;font-weight:800;color:var(--redd);margin-top:6px}
tr.bad td{background:var(--redt);color:var(--redd);font-weight:800}
.pu-match{margin:10px 0}
.pu-match .st{font-size:17px}
.hist{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.hist .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:4px}
.hist .hl{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;padding:4px 0;border-top:1px dashed var(--line)}
.lockline{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:6px}
.lockline svg.i{width:16px;height:16px}
.slip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border:2px dashed var(--line2);border-radius:12px;margin-bottom:12px}
.slip.ok{border-style:solid;border-color:#5EEAD4;background:#F0FDFA}
.slip .thumb{width:64px;height:64px}
.al{display:grid;grid-template-columns:auto 1fr 118px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.al.on{border-color:var(--p);background:var(--pll)}
.al input[type=checkbox]{width:24px;height:24px;accent-color:var(--p);margin:0}
.al .input{min-height:42px;padding:6px 8px}
.al .t{font-weight:800;font-size:14.5px}
.al .s{font-size:12.5px;color:var(--muted)}
.alsum{display:flex;justify-content:space-between;gap:8px;font-weight:800;padding:6px 2px;flex-wrap:wrap}
.mm{border:2px solid #FCA5A5;background:var(--redt);border-radius:12px;padding:12px;margin:10px 0}
.mm .ttl{font-weight:900;color:var(--redd)}
.mm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.mm .two div{background:#fff;border-radius:8px;padding:6px 10px}
.mm .k{font-size:12px;color:var(--muted);font-weight:700}
.mm .v{font-weight:900;font-size:18px}

/* v15: closing reminder */
.rep-banner{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--warnt);color:#78350F;font-weight:800;font-size:14.5px;margin-bottom:8px;border:1px solid #FCD34D}
/* v16: member badge, discount box */
.apr-sum div{min-width:0} .apr-sum .v{overflow-wrap:anywhere}
.apr-sum div div{padding:0;background:none;border-radius:0}
.apr-sum .v.num{white-space:normal} .apr-sum .v .small{display:block;font-weight:700}
@media (max-width:420px){.apr-sum>div{padding:8px}.apr-sum .v{font-size:15px}}
.mbadge{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--okt);color:var(--ok);font-weight:800;font-size:14.5px}
.mbadge svg.i{width:18px;height:18px}
.discbox{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#F8FAFC}
.discbox .input{margin-top:6px}
/* ========== Busy bar ========== */
body.busy::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:300;background:linear-gradient(90deg,transparent,#F59E0B,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
@media (max-width:420px){ .pill .lbl{display:none} }

/* ========== Print ========== */
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  #print-area .receipt{border:0;max-width:none;width:100%;padding:0;font-size:12px}
}

  let attLoad = null;

    return attLoad || (attLoad = one('../backend/attendance/att-core.js').then(() => one('../shared/att-mock.js')));
  }
  async function request(body) {
    await ensure();
    if (/^(att_|worker_)/.test(body.action)) await loadAttMock();
    await sleep(30 + Math.random() * 50);
    let forced = false; try { forced = localStorage.getItem('kmock.offline') === '1'; } catch (e) { }
    if (!navigator.onLine || forced) throw new NetError('offline (mock)');
    const db = load();
    db.approvals = db.approvals || []; db.photos = db.photos || []; db.expenses = db.expenses || []; db.shifts = db.shifts || []; db.cash_moves = db.cash_moves || [];
    db.devices = db.devices || []; db.activity = db.activity || []; db.returns = db.returns || [];
    LOG.push({ action: body.action, user: body.user || '', device: body.data && body.data.device ? JSON.parse(JSON.stringify(body.data.device)) : null, at: Date.now() });
    if (LOG.length > 300) LOG.shift();
    let res;
    dirty = false;
    try {
      lastRole = '';
      shopSet.clear();
      const snap = new Map(db.products.map(p => [p.id, { json: JSON.stringify(p), shop: shopOf(p) }]));
      if (body.data && typeof body.data === 'object' && !/^(scan_|att_mark|worker_enroll)/.test(body.action)) { body = Object.assign({}, body, { data: JSON.parse(JSON.stringify(body.data)) }); cleanInput(body.data, 0); } // (a copy: the server gets it over the network)
      res = handle(db, body);
      normShop(db, snap);
      const role = lastRole;
      if (!READ_ONLY.includes(body.action) || dirty) save(db);
      res = Object.assign({ ok: true }, role === 'owner' || ['users', 'setup'].includes(body.action) ? res : strip(res));
    } catch (e) {
      if (e.attState) { const fresh = load(); fresh.att = e.attState; save(fresh); } // v17: refused check-ins stay recorded
      res = Object.assign({ ok: false, error: e.code || 'SERVER', message: e.message }, e.extra || {});
    }
    return JSON.parse(JSON.stringify(res));
  }

/* ========== Devices (v11): where this phone / tablet / computer is while the app is open ==========
   A one-time notice on this device (Setuju / Tidak, remembered for every app on this browser) comes before the first

   goes with EVERY main-API request as data.device (see apiRawInner); device_ping on open/login and every 30 min while the

  const os = /Android/i.test(ua) ? 'Android' : /iPhone|iPod/.test(ua) ? 'iPhone' : /iPad/.test(ua) || touchMac ? 'iPad' : /Windows/.test(ua) ? 'Windows'
    : /CrOS/.test(ua) ? 'ChromeOS' : /Macintosh|Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Perangkat';
  const br = /Edg(A|iOS)?\//.test(ua) ? 'Edge' : /OPR\/|Opera/.test(ua) ? 'Opera' : /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /Firefox|FxiOS/.test(ua) ? 'Firefox'
    : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Browser';

  if (DEV.fix) { o.lat = DEV.fix.lat; o.lng = DEV.fix.lng; o.acc = DEV.fix.acc; }

}

      title: t('dev.title'), id: 'dev-consent', focus: false,
      body: `<div class="dev-note"><span class="e" aria-hidden="true">📍</span><span id="dev-text">${esc(t('dev.notice'))}</span></div>

/* ========== Sell: cart model ========== */
function newCart() { return { client_id: uuid(), lines: [], customer_id: null, grosir: false, method: 'tunai', paid: '', survey: null, voice: null, channel: 'toko', promo: '', muted: false, remote: null, discount: '', discReq: null }; }
/* v16 discount limit + members (the server's rules): list price = retail, or wholesale for a grosir customer / from wholesale_min_qty;
   discount % = (list total − total) / list total. A kasir may give max_discount_pct (default 3) + the member's tier %. */
const maxDiscPct = () => { const v = num(settings().max_discount_pct); return v > 0 ? v : 3; };
const MEMBER_TIERS = [{ from: 2, pct: 2 }, { from: 5, pct: 3 }, { from: 10, pct: 5 }];
/** {pct, n (this purchase = visits + 1), no} for a member customer, else null. */
function memberOf(c) {
  if (!c || !c.member || settings().member_enabled === false) return null;
  const tiers = Array.isArray(settings().member_tiers) && settings().member_tiers.length ? settings().member_tiers : MEMBER_TIERS;
  const n = int(c.visits) + 1;
  let pct = 0; tiers.forEach(x => { if (num(x.from) <= n && num(x.pct) > pct) pct = num(x.pct); });
  return { pct, n, no: c.member_no || '' };
}
const fmtPct1 = p => String(Math.round(num(p) * 10) / 10).replace('.', ',') + '%';
const cleanPromo = v => String(v || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 30);
/** One open cart per user on this device (a cashier swap does not inherit someone else's sale). */
const cartKey = () => 'cart.' + String(S.user || '').toLowerCase();
function loadCart() { const c = KS.get(cartKey()); return c && Array.isArray(c.lines) && c.client_id ? c : newCart(); }
const saveCart = () => KS.set(cartKey(), S.cart);
/** Wholesale price applies when: the "Grosir" toggle is on, the customer is a grosir customer,
 *  or the line quantity reaches wholesale_min_qty — and only if the product has a wholesale price. */
function lineCalc(line, cust, cart = S.cart) {
  const p = prodById(line.product_id) || { name: line.name || '?', retail_price: 0, wholesale_price: 0, wholesale_min_qty: 0, unit: '', stock: 0 };
  const wmin = num(p.wholesale_min_qty), hasW = int(p.wholesale_price) > 0;
  const want = !!(cart && cart.grosir) || (cust && cust.type === 'grosir') || (wmin > 0 && line.qty >= wmin);
  const type = want && hasW ? 'grosir' : 'eceran';
  const unit_price = type === 'grosir' ? int(p.wholesale_price) : int(p.retail_price);
  const listOk = hasW && ((cust && cust.type === 'grosir') || (wmin > 0 && line.qty >= wmin));
  const list = Math.round(line.qty * (listOk ? Math.min(int(p.wholesale_price), int(p.retail_price) || int(p.wholesale_price)) : int(p.retail_price)));
  return { p, type, unit_price, total: Math.round(line.qty * unit_price), list };
}
function cartView(c = S.cart) {
  const cust = custById(c.customer_id);
  const lines = c.lines.map(l => Object.assign({ line: l }, lineCalc(l, cust, c)));
  const subtotal = sum(lines, l => l.total), listTotal = sum(lines, l => l.list);
  const mem = memberOf(cust);
  const memberDisc = mem && mem.pct ? Math.round(subtotal * mem.pct / 100) : 0;
  const manual = Math.max(0, Math.min(moneyVal(c.discount || 0), subtotal - memberDisc));
  const discount = memberDisc + manual;
  // (07 Oct) receipt sent by WhatsApp / e-mail: free the first time for this customer, then receipt_send_fee (not part of the discount)
  const send = !!(c.sendReceipt && cust), sendFee = send ? receiptFeeFor(cust) : 0, total = subtotal - discount + sendFee;
  const discAmt = Math.max(0, listTotal - (total - sendFee)), discPct = listTotal > 0 ? Math.round(discAmt / listTotal * 1000) / 10 : 0;
  const discLimit = maxDiscPct() + (mem ? mem.pct : 0);
  return { cust, lines, subtotal, discount, memberDisc, manual, mem, total, send, sendFee, listTotal, discAmt, discPct, discLimit, discOver: discPct > discLimit + 1e-9, items: sum(c.lines, l => l.qty) };
}
const receiptFeeSetting = () => { const v = settings().receipt_send_fee; return v === undefined || v === null || v === '' ? 500 : Math.max(0, int(v)); };
const receiptFeeFor = cust => cust && num(cust.receipts_sent) >= 1 ? receiptFeeSetting() : 0;
/** A kasir above the limit needs an approved request (manager / owner give any discount). */
const discApproved = v => { const r = S.cart && S.cart.discReq; return !!(r && r.status === 'approved' && int(r.amount) >= v.discAmt); };
const needDiscApproval = v => S.role === 'kasir' && v.discOver && !discApproved(v);
/** Adds qty of p (scan, tap with "ask quantity" off); with set=true the line gets exactly qty (quantity sheet). */
/* v16 shelf (rak) and warehouse (gudang): only what is on the shelf can be sold; goods-in lands in the warehouse first. */
const sellFromShop = () => settings().sell_from_shop_only !== false;
const shelfOf = p => p.shop_stock === undefined || p.shop_stock === null || p.shop_stock === '' ? num(p.stock) : num(p.shop_stock);
const gudangOf = p => roundQty(Math.max(0, num(p.stock) - shelfOf(p)));
/** '' when qty fits on the shelf, else the message for the cashier. */
function shelfBlock(p, qty) {
  if (!sellFromShop() || qty <= shelfOf(p) + 1e-9) return '';
  return gudangOf(p) > 0 ? t('shelf.move_first', { name: p.name, shop: fmtQty(Math.max(0, shelfOf(p))), gudang: fmtQty(gudangOf(p)) }) : t('shelf.no_goods_in', { name: p.name, shop: fmtQty(Math.max(0, shelfOf(p))) });
}
function addToCart(p, qty = 1, set = false) {
  if (!p) return;

  const ex0 = S.cart.lines.find(l => l.product_id == p.id), want = set ? roundQty(qty) : roundQty((ex0 ? ex0.qty : 0) + qty);
  const sb = shelfBlock(p, want); if (sb) { beep(); toast(sb, 'err', 5000); return; }

  if (ex) ex.qty = set ? roundQty(qty) : roundQty(ex.qty + qty); else S.cart.lines.push({ product_id: p.id, name: p.name, qty: roundQty(qty) });

}
function findBySku(code) {

}
function filterProducts(q) {
  const toks = norm(q).split(' ').filter(Boolean);

  if (toks.length) {
    list = list.filter(p => { const h = norm(`${p.name} ${p.sku} ${p.category}`); return toks.every(tk => h.includes(tk)); });
    const nq = norm(q);
    list.sort((a, b) => (norm(b.sku) === nq) - (norm(a.sku) === nq) || norm(b.name).startsWith(nq) - norm(a.name).startsWith(nq) || a.name.localeCompare(b.name));

/* ========== Voice: speak name + quantity so the customer hears the count ==========
   Only product names and quantities are ever spoken — never prices, totals, discounts,
   customer names, debts or payment methods. */
const VOICE = { on: store.get('voice_on', true) !== false, lang: store.get('voice_lang', 'id-ID') === 'ar-SA' ? 'ar-SA' : 'id-ID', timer: null };
const UNIT_WORDS = { kg: 'kilo', kilo: 'kilo', gr: 'gram', g: 'gram', gram: 'gram', ml: 'mili', ltr: 'liter', lt: 'liter', l: 'liter', liter: 'liter' };
function speakableName(name) {
  let s = ' ' + String(name || '') + ' ';
  s = s.replace(/\[[^\]]*\]|\([^)]*\)|\{[^}]*\}/g, ' ');
  s = s.replace(/\b(?:sku|kode|code)\s*[:#]?\s*[\w-]+/gi, ' ');
  s = s.replace(/\b\d{6,}\b/g, ' ');
  s = s.replace(/\b[A-Z]{1,4}-?\d{3,}[\w-]*\b/g, ' ');
  s = s.replace(/(\d+(?:[.,]\d+)?)\s*(kg|kilo|gr|gram|g|ml|ltr|lt|liter|l)(?![a-z])/gi, (m, n, u) => `${n} ${UNIT_WORDS[u.toLowerCase()]}`);

const spokenQty = q => String(roundQty(q)).replace('.', VOICE.lang === 'ar-SA' ? '.' : ',');

}

    if (!ss || !U) return;
    const voice = pickVoice(ss);
    if (voice === null) return;

}

/* ========== Quantity sheet: a tapped product asks "how many?" (barcode scans still add 1) ==========

const askQty = () => store.get('ask_qty', true) !== false;
const WEIGHT_UNITS = ['kg', 'kilo', 'g', 'gr', 'gram', 'ons', 'l', 'lt', 'ltr', 'liter', 'litre', 'ml'];

function heldList() { const a = KS.get(heldKey(), []); return Array.isArray(a) ? a.filter(h => h && h.id && h.cart && Array.isArray(h.cart.lines)) : []; }
const saveHeld = list => { KS.set(heldKey(), list); updateHeldChip(); };
const isOldHeld = h => Date.now() - new Date(h.held_at).getTime() > HOLD_OLD_MS;
/** Not while paying or while a credit approval is pending for this cart. */
const holdBlocked = () => !!(S.cart && S.cart.remote) || !!$('#pay') || !!$('#apr-step') || !!$('#apr-wait') || saving;
const canHold = () => !!(S.cart && S.cart.lines.length) && !holdBlocked();
function defaultHoldLabel(list, cart) {
  const cust = custById(cart.customer_id); if (cust) return cust.name;
  const used = new Set(list.map(h => h.label));
  let n = 1; while (used.has(t('hold.default', { n }))) n++;
  return t('hold.default', { n });
}
function heldAgo(iso) {
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  return m < 1 ? t('hold.just_now') : m < 60 ? t('hold.min_ago', { n: m }) : t('hold.hour_ago', { n: Math.floor(m / 60) });
}
/** A held cart priced with today's product data; lines whose product is gone or inactive are left out. */
function heldView(h) {
  const ok = h.cart.lines.filter(l => { const p = prodById(l.product_id); return p && p.active !== false; });
  return Object.assign(cartView(Object.assign({}, h.cart, { lines: ok })), { gone: h.cart.lines.length - ok.length });
}
/** Moves the current cart into the held list and starts an empty one. Returns the label ('' = refused). */
function holdCurrent(label) {
  const list = heldList();
  if (list.length >= HOLD_MAX) { toast(t('hold.full', { max: HOLD_MAX }), 'err', 4000); return ''; }
  const cart = Object.assign(clone(S.cart), { paid: '', remote: null, discReq: null });
  const lbl = String(label || '').trim().slice(0, 40) || defaultHoldLabel(list, cart);
  list.push({ id: uuid(), label: lbl, held_at: new Date().toISOString(), by: S.user, cart });
  saveHeld(list);
  clearTimeout(VOICE.timer);
  S.cart = newCart(); saveCart();
  return lbl;
}
function openHold() {
  if (!canHold()) { if (S.cart.lines.length) toast(t('hold.busy'), 'warn'); return; }
  const list = heldList();
  if (list.length >= HOLD_MAX) { toast(t('hold.full', { max: HOLD_MAX }), 'err', 4000); return; }
  const el = openModal({
    title: t('hold.title'), id: 'hold-prompt',
    body: `<p style="margin-top:0">${esc(t('hold.hint'))}</p>
      <div class="field"><label class="f" for="hold-label">${esc(t('hold.label'))}</label><input class="input" id="hold-label" maxlength="40" autocomplete="off" placeholder="${esc(defaultHoldLabel(list, S.cart))}" autofocus></div>
      <p class="small muted" style="margin:-4px 0 0">${esc(t('hold.label_hint'))}</p>`,

  });

function updateHeldChip() {
  const b = $('#held-chip'); if (!b) return;
  const list = heldList();
  b.hidden = !list.length;
  b.classList.toggle('old', list.some(isOldHeld));
  b.innerHTML = `${ic('pause')}<span>${esc(t('hold.chip', { n: list.length }))}</span>`;
}
function openHeld() {
  const el = openModal({ title: t('hold.list'), id: 'held-list', body: '' });
  drawHeld(el);
}
function drawHeld(el) {
  const body = $('.modal-b', el); if (!body) return;
  const list = heldList();
  body.innerHTML = list.length ? `<div class="list" id="held-items">${list.map(h => {
    const v = heldView(h), old = isOldHeld(h);
    return `<div class="li held ${old ? 'old' : ''}" data-id="${esc(h.id)}">${ic('pause')}
      <div class="grow"><div class="t">${esc(h.label)} ${old ? `<span class="badge warn">${esc(t('hold.old'))}</span>` : ''}</div>
        <div class="s"><span data-ref="n">${esc(t('sell.n_lines', { n: v.lines.length }))}</span> · <span data-ref="ago">${esc(heldAgo(h.held_at))}</span> (${esc(jktTime(h.held_at))})${h.by ? ' · ' + esc(h.by) : ''}</div>
        ${v.gone ? `<div class="s red">${esc(t('hold.n_gone', { n: v.gone }))}</div>` : ''}</div>
      <b class="num" data-ref="total">${fmtRp(v.total)}</b>
      <div class="acts"><button class="btn sm danger" data-act="held-del" data-id="${esc(h.id)}">${ic('trash')} ${esc(t('delete'))}</button><button class="btn sm primary" data-act="held-resume" data-id="${esc(h.id)}">${esc(t('hold.resume'))}</button></div></div>`;
  }).join('')}</div>` : `<div class="empty">${esc(t('hold.empty'))}</div>`;
}
/** Resume a held cart. A non-empty current cart is held first (swap). Voice stays silent. */
function resumeHeld(id) {
  const list = heldList(), h = list.find(x => x.id === id);
  if (!h) { const m = $('#held-list'); if (m) drawHeld(m); return; }
  if (S.cart.lines.length && !canHold()) { toast(t('hold.busy'), 'warn'); return; }
  // the swap label is chosen before the resumed entry leaves the list ("Pelanggan 1" is not reused at once)
  const swapLabel = S.cart.lines.length ? defaultHoldLabel(list, S.cart) : '';
  saveHeld(list.filter(x => x.id !== id));
  const swapped = swapLabel ? holdCurrent(swapLabel) : '';
  const cart = Object.assign(newCart(), h.cart, { paid: '', remote: null, discReq: null });
  const gone = [];
  cart.lines = cart.lines.filter(l => { const p = prodById(l.product_id); if (!p || p.active === false) { gone.push(p ? p.name : l.name); return false; } l.name = p.name; return true; });
  if (cart.customer_id != null && !custById(cart.customer_id)) { cart.customer_id = null; if (cart.method === 'hutang') cart.method = 'tunai'; }
  S.cart = cart; saveCart();
  closeModal(true);
  renderCart(); renderGrid();
  if (cart.lines.length && !isWide()) openCartSheet();
  toast(swapped ? t('hold.swapped', { held: swapped, label: h.label }) : t('hold.resumed', { label: h.label }), 'ok', swapped ? 5000 : 2800);
  if (gone.length) toast(t('hold.dropped', { names: gone.join(', ') }), 'warn', 6000);
  const low = cart.lines.find(l => num(prodById(l.product_id).stock) < l.qty);
  if (low) toast(t('sell.stock_low', { name: low.name }), 'warn', 3000);
}
async function deleteHeld(id) {
  const h = heldList().find(x => x.id === id); if (!h) return;
  const r = await confirmBox(t('hold.del_confirm', { label: h.label }), { danger: true, ok: t('delete') });
  if (!r.ok) return;
  saveHeld(heldList().filter(x => x.id !== id));
  toast(t('hold.deleted'), 'ok');
  const m = $('#held-list'); if (m) drawHeld(m);
}

/* ========== Survey (consent + speech-to-text, text only) ==========
   Manual form, optional: opened only from the "Isi survei manual" link in the payment window. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const SP = { rec: null, idx: -1, want: false, base: '', fin: '' };
function stopSpeech() { SP.want = false; if (SP.rec) { try { SP.rec.stop(); } catch (e) { } } SP.rec = null; SP.idx = -1; $$('.mic.on').forEach(b => b.classList.remove('on')); }
function startSpeech(i, root) {
  stopSpeech(); stopVoice();
  const ta = $(`[data-sq="${i}"]`, root), intEl = $(`#sv-int-${i}`, root), btn = $(`.mic[data-i="${i}"]`, root);
  const rec = new SpeechRec();
  rec.lang = 'id-ID'; rec.continuous = true; rec.interimResults = true;
  SP.rec = rec; SP.idx = i; SP.want = true; SP.base = ta.value.trim() ? ta.value.trim() + ' ' : ''; SP.fin = '';
  rec.onresult = e => {
    let interim = '';
    for (let k = e.resultIndex; k < e.results.length; k++) { const r = e.results[k]; if (r.isFinal) SP.fin += r[0].transcript; else interim += r[0].transcript; }
    ta.value = (SP.base + SP.fin).trim(); intEl.textContent = interim;
  };
  rec.onerror = e => { if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)) { SP.want = false; toast(t('survey.mic_denied'), 'err'); } };
  rec.onend = () => {
    intEl.textContent = '';
    if (SP.want && SP.rec === rec) { SP.base = ta.value.trim() ? ta.value.trim() + ' ' : ''; SP.fin = ''; try { rec.start(); } catch (e) { stopSpeech(); } }
    else btn.classList.remove('on');
  };
  try { rec.start(); btn.classList.add('on'); } catch (e) { toast(t('survey.mic_denied'), 'err'); }
}
function openSurvey() {
  const qs = surveyQuestions();
  const prev = S.cart.survey && !S.cart.survey.skipped ? S.cart.survey : { consent: false, answers: [] };
  const ans = q => (prev.answers.find(a => a.q === q) || {}).a || '';
  const el = openModal({
    title: t('survey.title'), id: 'survey', focus: false,
    body: `<label class="check"><input type="checkbox" id="sv-consent" ${prev.consent ? 'checked' : ''}><span><b>${esc(t('survey.consent'))}</b><br><span class="small muted">${esc(t('survey.consent_hint'))}</span></span></label>
      ${qs.map((q, i) => `<div class="sq"><div class="q" id="sv-q-${i}">${esc(q)}</div><div class="a"><textarea class="input" rows="1" data-sq="${i}" aria-labelledby="sv-q-${i}">${esc(ans(q))}</textarea>${SpeechRec ? `<button class="mic" data-i="${i}" type="button" aria-label="${esc(t('survey.mic'))}" title="${esc(t('survey.mic'))}">${ic('mic')}</button>` : ''}</div><div class="interim" id="sv-int-${i}" aria-live="polite"></div></div>`).join('')}
      ${SpeechRec ? '' : `<p class="small muted">${esc(t('survey.no_speech'))}</p>`}<div class="red small" id="sv-err" role="alert"></div>`,
    foot: `<button class="btn" id="sv-skip">${esc(t('survey.skip'))}</button><button class="btn primary" id="sv-save">${esc(t('survey.save'))}</button>`,
    onClose: () => { stopSpeech(); drawVoice(); }
  });
  $$('.mic', el).forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; if (SP.idx === i) stopSpeech(); else startSpeech(i, el); }));
  $('#sv-skip', el).onclick = () => { S.cart.survey = { skipped: true, consent: false, answers: [] }; saveCart(); dropModal(el); };
  $('#sv-save', el).onclick = () => {
    stopSpeech();
    const answers = qs.map((q, i) => ({ q, a: $(`[data-sq="${i}"]`, el).value.trim() })).filter(x => x.a);
    const consent = $('#sv-consent', el).checked;
    if (answers.length && !consent) { $('#sv-err', el).textContent = t('survey.need_consent'); $('#sv-consent', el).focus(); return; }
    S.cart.survey = answers.length ? { consent: true, answers } : { skipped: true, consent: false, answers: [] };
    saveCart(); dropModal(el);
  };
}

/* ========== Voice survey: the cashier talks with the customer while paying, the phone writes it down ==========
   UU PDP: nothing is captured before the consent tap ("Pelanggan setuju — mulai rekam") in the payment window.
   Speech-to-text only: no audio is stored or uploaded; the text goes with the sale (survey_transcript) only
   when the consent tap happened. Finishing the payment stops the recording; paying never waits for it.
   Cart state: cart.voice = null (not asked) | { consent: true, text } | { skipped: true }. */
const VS_MAX_MS = 10 * 60000, VS_MAX_CHARS = 4000;
const VS = { on: false, rec: null, cart: null, started: 0, interim: '', tick: null, restart: null, ask: '', asked: [], cid: '' };
/** Web Speech API present (Chrome/Android; not iOS Safari or Firefox) and the owner did not turn it off. */
const voiceSurveyOn = () => !!SpeechRec && settings().survey_voice !== false;
const vsClean = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, VS_MAX_CHARS).trim();
function vsAppend(cart, txt) {
  const v = cart && cart.voice; if (!v || !v.consent || !String(txt || '').trim()) return;
  v.text = vsClean((v.text ? v.text + ' ' : '') + txt);
  if (cart === S.cart) saveCart();
}
function startVoice() {
  if (!voiceSurveyOn() || VS.on || !S.cart) return;
  stopSpeech();
  clearTimeout(VOICE.timer); try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { } // item names are not spoken while recording
  const cart = S.cart;
  cart.voice = { consent: true, text: cart.voice && cart.voice.consent ? cart.voice.text || '' : '' }; saveCart();
  Object.assign(VS, { on: true, cart, started: Date.now(), interim: '', ask: '' });
  VS.tick = setInterval(vsTick, 1000);
  vsListen();
  drawVoice();
}
/** One recognition session; Android Chrome ends it after a silence → a fresh one starts while still recording. */
function vsListen() {
  let rec;
  try { rec = new SpeechRec(); } catch (e) { vsFail('vs.mic_denied'); return; }
  rec.lang = 'id-ID'; rec.continuous = true; rec.interimResults = true; // customers speak Indonesian, whatever the app language
  VS.rec = rec;
  rec.onresult = e => {
    if (VS.rec !== rec) return;
    let interim = '';
    for (let k = e.resultIndex; k < e.results.length; k++) { const r = e.results[k]; if (r.isFinal) vsAppend(VS.cart, r[0].transcript); else interim += r[0].transcript; }
    VS.interim = interim; vsShowText();
  };
  rec.onerror = e => {
    if (VS.rec !== rec) return;
    if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)) vsFail('vs.mic_denied');
    else if (e.error === 'network') vsFail('vs.need_net');
    // no-speech / aborted: onend below starts listening again
  };
  rec.onend = () => {
    if (VS.rec !== rec || !VS.on) return;
    VS.interim = ''; vsShowText();
    clearTimeout(VS.restart);
    VS.restart = setTimeout(() => { if (VS.on && VS.rec === rec) vsListen(); }, 300);
  };
  try { rec.start(); } catch (e) { vsFail('vs.mic_denied'); }
}
/** Recording impossible (microphone refused, no internet): stop; with no text yet the consent banner comes back. */
function vsFail(msgKey) {
  const cart = VS.cart;
  stopVoice();
  if (cart && cart.voice && cart.voice.consent && !cart.voice.text) { cart.voice = null; if (cart === S.cart) saveCart(); drawVoice(); }
  toast(t(msgKey), 'err', 4000);
}
/** Stops listening; words still being recognised (interim) are kept as they are. */
function stopVoice() {
  if (!VS.on) return;
  VS.on = false;
  clearInterval(VS.tick); clearTimeout(VS.restart);
  const rec = VS.rec, cart = VS.cart; VS.rec = null; VS.cart = null;
  if (VS.interim) vsAppend(cart, VS.interim);
  VS.interim = '';
  if (rec) { try { rec.stop(); } catch (e) { } }
  drawVoice();
}
function skipVoice() { stopVoice(); S.cart.voice = { skipped: true }; VS.ask = ''; saveCart(); drawVoice(); }
function vsTick() {
  if (!VS.on) return;
  const ms = Date.now() - VS.started;
  if (ms > VS_MAX_MS) { stopVoice(); toast(t('vs.max'), 'warn', 4000); return; }
  const tm = $('#vs-time'); if (tm) tm.textContent = `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;
}
function vsShowText() {
  const el = $('#vs-tx'); if (!el || !S.cart) return;
  const v = S.cart.voice, txt = v && v.consent ? v.text || '' : '';
  el.innerHTML = esc(txt) + (VS.on && VS.interim ? ` <i>${esc(VS.interim)}</i>` : '');
  el.scrollTop = el.scrollHeight;
}
/** The voice survey area at the top of the payment window, drawn from VS + cart.voice. */
function voiceHTML() {
  const c = S.cart, v = c.voice, sv = c.survey, qs = surveyQuestions();
  const manual = `<button type="button" class="linkbtn" id="vs-manual" data-act="survey-open">${ic('list')}${esc(t('vs.manual'))}${sv && !sv.skipped ? ` <span class="badge ok">${esc(t('survey.done'))}</span>` : ''}</button>`;
  if (!voiceSurveyOn()) return `<div class="vs-links">${manual}</div>`;
  if (VS.on && VS.cart === c) return `<div class="vs rec" id="vs-rec">
      <div class="vs-h"><span class="rec-dot" aria-hidden="true"></span><span class="grow" role="status">${esc(t('vs.recording'))} <span class="num" id="vs-time">0:00</span></span><button type="button" class="btn sm danger" data-act="vs-stop" id="vs-stop">■ ${esc(t('vs.stop'))}</button></div>
      <div class="vs-hint" style="margin:4px 0 0">${esc(t('vs.ask_hint'))}</div>
      <ol class="vs-qs" id="vs-qs">${qs.map((q, i) => `<li><label><input type="checkbox" data-vsq="${i}" ${VS.asked.includes(i) ? 'checked' : ''}><span dir="auto">${i + 1}. ${esc(q)}</span></label></li>`).join('')}</ol>
      <div class="vs-tx" dir="auto" id="vs-tx" aria-live="polite"></div>
      <div class="vs-links">${manual}</div></div>`;
  if (v && v.consent) return `<div class="vs done" id="vs-done"><div class="vs-h">${ic('check')}<span class="grow">${esc(t('vs.saved'))}</span><button type="button" class="btn xs" data-act="vs-start" id="vs-resume">${ic('mic')} ${esc(t('vs.resume'))}</button></div>
      <div class="vs-tx" dir="auto" id="vs-tx"></div><div class="vs-links">${manual}</div></div>`;
  if (!v && (settings().survey_auto !== false || VS.ask === c.client_id)) return `<div class="vs" id="vs-ask">
      <div class="vs-h"><span aria-hidden="true">🎙</span><span class="grow">${esc(t('vs.title'))}</span></div>
      <div class="vs-hint">${esc(t('vs.hint'))}</div>
      <button type="button" class="btn primary vs-go" data-act="vs-start" id="vs-start">${ic('mic')} ${esc(t('vs.consent'))}</button>
      <div class="vs-links"><button type="button" class="linkbtn" data-act="vs-skip" id="vs-skip">${esc(t('vs.skip'))}</button>${manual}</div></div>`;
  // skipped, or not shown automatically (settings.survey_auto off): a small link brings the banner back
  return `<div class="vs-links"><button type="button" class="linkbtn" data-act="vs-ask" id="vs-ask-link">🎙 ${esc(t('vs.title'))}</button>${manual}</div>`;
}
function drawVoice() {
  const w = $('#vs-wrap'); if (!w || !S.cart) return;
  w.innerHTML = voiceHTML();
  vsShowText(); vsTick();

/** Saves the cart. extra = {approver} | {approval_id}. Returns 'ok' | 'queued' | 'approval' | 'approval_error' | 'error'. */
async function doSave(extra = {}) {

  const v = cartView(), pay = payCalc(v);
  if (!v.lines.length) return 'error';
  if (pay.error) { toast(pay.error, 'err'); return 'error'; }
  stopVoice(); // finishing the payment ends the recording (the text so far goes with the sale)
  saving = true;
  const ok = $('#pay-ok'); if (ok) { ok.disabled = true; ok.textContent = t('saving'); }
  const req = Object.assign(buildSaleRequest(v, pay), extra), rc = receiptFromCart(v, pay, req);
  const dr = S.cart.discReq; if (dr && dr.request_id && !req.discount_approval_id) req.discount_approval_id = dr.request_id; // v16
  if (S.cart.remote && S.cart.remote.approved && !req.approval_id && !req.approver) req.approval_id = S.cart.remote.request_id;
  rc.approved_by = extra.approver ? extra.approver.user : '';
  rc.exit_required = localExitRequired(v);
  try {
    // with an on-site approver a wrong approver PIN must not log the cashier out → apiRaw
    const r = extra.approver ? await apiRaw('save_sale', req, sessCred()) : await api('save_sale', req);
    rc.invoice_no = r.invoice_no || (r.sale && r.sale.invoice_no) || '';
    if (r.sale) { rc.total = int(r.sale.total ?? rc.total); rc.debt = int(r.sale.debt_amount ?? rc.debt); if (r.sale.approved_by) rc.approved_by = r.sale.approved_by; }
    if (r.exit_photo_required != null) rc.exit_required = !!r.exit_photo_required;
    applyStock(r.stock);
    if (v.cust && !r.duplicate) { v.cust.debt_balance = int(v.cust.debt_balance) + rc.debt; v.cust.visits = int(v.cust.visits) + 1; v.cust.last_visit = req.sale_date; if (req.send_receipt) v.cust.receipts_sent = int(v.cust.receipts_sent) + 1; }

      if (pay.debt > 0 && S.role === 'kasir' && !req.approval_id) { toast(t('apr.need_online'), 'err', 5000); return 'error'; }
      if (needDiscApproval(v)) { toast(t('disc.need_online'), 'err', 5000); return 'error'; }
      queueOp('sale', 'save_sale', req, { rc });

    if (extra.approver && ['BAD_PIN', 'APPROVAL_REQUIRED'].includes(e.code)) return 'approval_error';
    if (e.code === 'APPROVAL_REQUIRED') { if (!extra.approval_id) openApprovalStep(v, pay); else toast(errMsg(e), 'err', 5000); return 'approval'; }
    if (e.code === 'NOT_ON_SHELF') { openNotOnShelf((e.res && e.res.items) || [], e.message); return 'error'; }
    if (e.code === 'DISCOUNT_APPROVAL_REQUIRED') { if (S.cart.discReq && S.cart.discReq.status !== 'pending') S.cart.discReq = null; saveCart(); openDiscountStep(cartView(), e.message || errMsg(e)); return 'discount'; }

    if (!['BAD_PIN', 'BAD_KEY', 'NO_USERS'].includes(e.code)) toast(errMsg(e), 'err', 5000);

}

const APR_POLL_MS = 5000, APR_MAX_MS = 15 * 60000;
function openWaiting(ap) {
  let timer = null, stopped = false;
  const started = Date.now();
  const el = openModal({
    title: t('apr.waiting_title'), id: 'apr-wait',
    body: `<div class="wait"><div class="small muted">${esc(t('apr.request_id'))}</div><div class="rid" id="aw-id">${esc(ap.request_id)}</div>
      <p style="margin:6px 0"><b>${esc(ap.customer_name || '')}</b></p>
      <div class="row" style="justify-content:center;gap:18px;flex-wrap:wrap"><span>${esc(t('apr.debt_new'))}: <b class="red num">${fmtRp(ap.debt_amount)}</b></span><span>${esc(t('total'))}: <b class="num">${fmtRp(ap.total)}</b></span></div>
      <div id="aw-state"><div class="spinner"></div><div id="aw-msg">${esc(t('apr.waiting'))}</div><div class="small muted" id="aw-time"></div></div></div>`,
    foot: `<button class="btn" id="aw-cancel">${esc(t('apr.stop_wait'))}</button>`,
    onClose: () => { stopped = true; clearTimeout(timer); refreshCartNumbers(); }
  });
  const msg = txt => { const m = $('#aw-msg', el); if (m) m.textContent = txt; };
  const finish = html => { stopped = true; clearTimeout(timer); $('#aw-state', el).innerHTML = html; };
  $('#aw-cancel', el).onclick = () => dropModal(el);
  const tick = async () => {
    if (stopped) return;
    const secs = Math.round((Date.now() - started) / 1000);
    const tm = $('#aw-time', el); if (tm) tm.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    if (Date.now() - started > APR_MAX_MS) {
      finish(`<p class="red"><b>${esc(t('apr.timeout'))}</b></p><button class="btn primary" id="aw-again">${esc(t('apr.wait_again'))}</button>`);
      $('#aw-again', el).onclick = () => { dropModal(el); openWaiting(ap); };
      return;
    }
    try {
      const r = await api('check_approval', { request_id: ap.request_id });
      if (stopped) return;
      const a = r.approval || {};
      updateMyRequest(a);
      if (a.status === 'approved') {
        if (S.cart.remote && S.cart.remote.request_id === ap.request_id) { S.cart.remote.approved = true; saveCart(); }
        finish(`<p class="okc"><b>${esc(t('apr.approved_by', { name: a.decided_by || '' }))}</b></p><div class="spinner"></div>`);
        const res = await doSave({ approval_id: ap.request_id });
        if (res === 'ok' || res === 'queued') { /* finishSale cleared the cart (and its remote) */ } else dropModal(el);
        return;
      }
      if (a.status === 'rejected' || a.status === 'used') {
        S.cart.remote = null; saveCart();
        finish(`<p class="red" style="font-size:19px"><b>${esc(a.status === 'used' ? t('apr.used') : t('apr.rejected_by', { name: a.decided_by || '' }))}</b></p>${a.note ? `<p id="aw-note">“${esc(a.note)}”</p>` : ''}<button class="btn primary" data-act="modal-close" id="aw-back">${esc(t('apr.back_to_cart'))}</button>`);
        return;
      }
      msg(t('apr.waiting'));
    } catch (e) {
      if (stopped) return;
      msg(e instanceof NetError ? t('apr.retrying') : errMsg(e));
    }
    timer = setTimeout(tick, APR_POLL_MS);
  };
  timer = setTimeout(tick, 600);
}

function receiptText(rc) {

  if (rc.pending) out.push(`*${t('rc.pending')}*`);
  out.push(`${t('rc.no')}: ${rc.invoice_no}`, `${t('rc.date')}: ${fmtDateTime(rc.sale_time, rc.sale_date)}`, `${t('rc.cashier')}: ${rc.cashier}`, `${t('rc.customer')}: ${rc.customer_name}`, L2);

  if (int(rc.send_fee)) out.push(`${t('rs.fee_line')}: ${fmtRp(rc.send_fee)}`);
  out.push(L2, `*${t('total')}: ${fmtRp(rc.total)}*`, `${t('rc.paid')} (${t('pm.' + rc.method)}): ${fmtRp(rc.paid)}`);

/* v16: send the receipt as plain text — WhatsApp (wa.me to the customer's phone, or a number typed here) and e-mail (mailto),

function receiptPlain(rc) {

  out.push(L2, `${tid('rc.no')}: ${rc.invoice_no}`, `${tid('rc.date')}: ${fmtDateTime(rc.sale_time, rc.sale_date)}`, `${tid('rc.cashier')}: ${rc.cashier}`, `${tid('rc.customer')}: ${rc.customer_name}`, L2);
  rc.lines.forEach(l => out.push(l.name, `  ${fmtQty(l.qty)} x ${fmtRp(l.unit_price)} = ${fmtRp(l.line_total)}`));
  out.push(L2);
  if (rc.discount) out.push(`${tid('rc.subtotal')}: ${fmtRp(rc.subtotal)}`);
  if (rc.member_disc) out.push(`${tid('mem.disc_line', { pct: fmtPct1(rc.member && rc.member.pct) })}: -${fmtRp(rc.member_disc)}`);
  if (int(rc.discount) - int(rc.member_disc) > 0) out.push(`${tid('disc.label')}: -${fmtRp(int(rc.discount) - int(rc.member_disc))}`);
  if (int(rc.send_fee)) out.push(`${tid('rs.fee_line')}: ${fmtRp(rc.send_fee)}`);
  out.push(`${tid('total')}: ${fmtRp(rc.total)}`, `${tid('rc.paid')} (${tid('pm.' + rc.method)}): ${fmtRp(rc.paid)}`);
  if (rc.change) out.push(`${tid('pay.change')}: ${fmtRp(rc.change)}`);
  if (rc.debt) out.push(`${tid('rc.debt')}: ${fmtRp(rc.debt)}`);
  if (rc.member) out.push(tid('mem.rc_line', { no: rc.member.member_no || '', n: rc.member.purchase_no }));
  out.push(L2);
  if (st.receipt_footer) out.push(st.receipt_footer);

}

/* ========== Exit photo (large sale leaves the store) ========== */
async function imageToJpeg(file, max = 1600, quality = 0.8) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = url; });
    const draw = (m, q) => {
      const sc = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', q);
    };
    const full = draw(max, quality);
    return { base64: full.slice(full.indexOf(',') + 1), mime: 'image/jpeg', thumb: draw(240, 0.7) };
  } finally { URL.revokeObjectURL(url); }
}

/* ========== Outbox (offline queue: sales, debt payments, expenses, cash moves, customer numbers) ========== */
let syncing = false;

function saveOutbox() { KS.set('outbox', S.outbox); updateOutboxBadge(); }
function queueOp(kind, action, data, extra = {}) {
  const id = data.client_id || uuid();
  if (S.outbox.some(e => e.id === id)) return;
  S.outbox.push({ id, kind, action, data, rc: extra.rc || null, label: extra.label || '', key: S.key, user: S.user, pin_hash: S.pin_hash, queued_at: new Date().toISOString(), tries: 0, error: '' });
  if (kind === 'sale') {
    for (const it of data.items) { const p = prodById(it.product_id); if (p) { p.stock = roundQty(p.stock - it.qty); if (p.shop_stock != null && p.shop_stock !== '') p.shop_stock = roundQty(num(p.shop_stock) - it.qty); } }
    const c = custById(data.customer_id); if (c && extra.rc) { c.debt_balance += int(extra.rc.debt); extra.rc.debt_after = c.debt_balance; }
  }
  if (kind === 'payment') { const c = custById(data.customer_id); if (c) c.debt_balance = Math.max(0, c.debt_balance - int(data.amount)); }
  saveOutbox(); saveCache();
}

async function syncOutbox(manual) {

        S.outbox = S.outbox.filter(x => x.id !== e.id);

async function scanPurchasePhoto(file) {

  try {
    const img = await imageToJpeg(file);
    PU.thumb = img.thumb; RENDER.masuk();
    const r = await apiPhoto('scan_purchase', { image_base64: img.base64, mime: img.mime });
    const ex = r.extracted || {}, items = Array.isArray(ex.items) ? ex.items : [];
    PU.photo_id = r.photo_id || '';
    PU.scan = { n: items.length, supplier: ex.supplier || '', invoice_no: ex.invoice_no || '', readable: ex.readable !== false,
      items: items.map(it => ({ name: String(it.name || ''), qty: it.qty === null || it.qty === undefined || it.qty === '' ? null : num(it.qty), unit: it.unit || '' })) };
    if (ex.supplier && !PU.supplier.trim()) PU.supplier = ex.supplier;
    const d = parseAnyDate(ex.date); if (d) PU.date = d;
    if (ex.invoice_no) PU.note = t('pu.note_invoice', { no: ex.invoice_no });

    PU.lines = PU.lines.filter(l => !l.ext).concat(items.map((it, index) => {
      const sg = sugg.filter(x => x.index === index).sort((a, b) => b.score - a.score)[0];
      const ok = sg && num(sg.score) >= 0.5 && prodById(sg.product_id);
      const qty = roundQty(num(it.qty) || 1);
      const cost = int(it.unit_price) || (it.total && qty ? Math.round(num(it.total) / qty) : 0);
      return { product_id: ok ? prodById(sg.product_id).id : null, name: it.name, qty, cost, photo_index: index, ext: { name: it.name, unit: it.unit || '', score: sg ? num(sg.score) : null } };
    }));
  } catch (e) {
    PU.scanErr = (e instanceof NetError ? t('pu.scan_net') : errMsg(e)) + ' ' + t('pu.scan_retry');
  }
  PU.scanning = false; savePuDraft(); RENDER.masuk();
}

/* ---- History of goods-in (last 14 days), grouped by purchase_no; corrections only through a request ---- */
function groupPurchases(rows) {
  const g = new Map();
  PUH.returned = {};
  rows.filter(r => r.purchase_no && r.match_status === 'retur').forEach(r => {
    const m = /dari (\S+)/.exec(String(r.note || '')); if (!m) return;
    const x = PUH.returned[m[1]] = PUH.returned[m[1]] || {};
    x[String(r.product_id)] = roundQty((x[String(r.product_id)] || 0) + Math.abs(num(r.qty)));
  });
  rows.filter(r => r.purchase_no).forEach(r => {
    let x = g.get(r.purchase_no);
    if (!x) { x = { no: r.purchase_no, date: r.purchase_date, supplier: r.supplier || '', user: r.user || '', match: '', notes: '', lines: new Map(), fixes: 0, base: false, order: 0 }; g.set(r.purchase_no, x); }
    if (r.match_status === 'koreksi') x.fixes++;
    else { if (!x.base || String(r.purchase_date) < String(x.date)) x.date = r.purchase_date; x.base = true; x.match = r.match_status || ''; x.notes = r.match_notes || ''; x.supplier = r.supplier || ''; x.user = r.user || ''; }
    x.order = Math.max(x.order, num(r.id));
    const k = String(r.product_id), ln = x.lines.get(k) || { product_id: r.product_id, name: r.name, qty: 0 };
    ln.qty = roundQty(ln.qty + num(r.qty)); x.lines.set(k, ln);
  });
  return [...g.values()].filter(x => x.base).map(x => Object.assign(x, { lines: [...x.lines.values()] }))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.order - a.order || String(b.no).localeCompare(String(a.no)));
}

/* ========== v16 Retur pelanggan: invoice → lines (≤ bought − returned) → reason, who brings it back, how the money goes back ==========
   request_return → the manager approves (the owner above the limit) → the return note (RT number = entry note for the goods). */
const RETURN_REASONS = ['tidak_sesuai', 'rusak', 'kadaluarsa', 'salah_kirim', 'kualitas_buruk', 'berubah_pikiran', 'lainnya'];
const invoiceDate = inv => { const m = /^[A-Z]{1,4}(\d{2})(\d{2})(\d{2})-/.exec(String(inv || '')); return m ? `20${m[1]}-${m[2]}-${m[3]}` : ''; };

async function returnedOf(ref, from) {

    const r = await api('list_returns', { from: from || addDays(today(), -90), to: today() });
    (r.returns || []).filter(x => x.ref === ref && (x.status === 'approved' || x.status === 'pending')).forEach(x => (Array.isArray(x.lines) ? x.lines : []).forEach(l => { q[String(l.product_id)] = roundQty((q[String(l.product_id)] || 0) + num(l.qty)); }));
  } catch (e) { if (e instanceof NetError) throw e; }
  return q;
}
async function loadSaleForReturn(inv) {
  // get_sale (v16): the sale, its lines, what was already returned / pending and the buyer's debt in one call
  try {
    const r = await api('get_sale', { invoice_no: inv });
    return { sale: r.sale, items: r.items || [], ret: r.returned || {}, debt: int(r.customer_debt) };
  } catch (e) {
    if (e.code === 'NOT_FOUND') return null;
    if (!(e.code === 'INVALID' && /Aksi tidak dikenal|Unknown action/i.test(String(e.message || '')))) throw e;
  }
  // older server without get_sale: the invoice's day from get_sales + list_returns
  const d = invoiceDate(inv);
  const r = await api('get_sales', { from: d || addDays(today(), -60), to: d || today() });
  const sale = (r.sales || []).find(s => s.invoice_no === inv);
  if (!sale) return null;
  const c = sale.customer_id != null ? custById(sale.customer_id) : null;
  return { sale, items: (r.items || []).filter(i => i.invoice_no === inv), ret: await returnedOf(inv, sale.sale_date), debt: c ? int(c.debt_balance) : 0 };
}
