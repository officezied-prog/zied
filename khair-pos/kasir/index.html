/* ========== v16 "Pindah ke rak": warehouse → shop shelf (or back) with move_stock ==========
   Goods-in lands in the warehouse; the cashier moves what goes on the shelf. Lines: product + quantity (≤ what is there). */
function openMoveStock(pre = {}) {
  const M = { to: pre.to === 'gudang' ? 'gudang' : 'toko', lines: (pre.lines || []).filter(l => prodById(l.product_id)).map(l => ({ product_id: prodById(l.product_id).id, qty: roundQty(l.qty) })), q: '' };
  const avail = p => M.to === 'toko' ? gudangOf(p) : Math.max(0, shelfOf(p));
  const el = openModal({
    title: t('mv.title'), id: 'move-stock', focus: false,
    body: `<div class="seg" id="mv-dir" style="margin-bottom:10px">${['toko', 'gudang'].map(d => `<button type="button" data-to="${d}" id="mv-to-${d}">${esc(t('mv.to_' + d))}</button>`).join('')}</div>
      <p class="small muted" style="margin-top:0" id="mv-hint"></p>
      <div class="search">${ic('search')}<input class="input" id="mv-q" type="search" autocomplete="off" placeholder="${esc(t('sell.search_ph'))}" aria-label="${esc(t('sell.search_ph'))}"></div>
      <div class="list" id="mv-sug" style="margin-top:6px"></div>
      <h3 style="font-size:16px;margin:12px 0 6px" id="mv-head"></h3>
      <div class="list" id="mv-lines"></div>
      <div class="field" style="margin-top:10px"><label class="f" for="mv-note">${esc(t('notes'))}</label><input class="input" id="mv-note" maxlength="200"></div>
      <div class="err" id="mv-err" role="alert"></div>`,
    foot: `<button class="btn" data-act="modal-close">${esc(t('close'))}</button><button class="btn primary" id="mv-ok">${ic('send')} <span></span></button>`
  });
  const err = $('#mv-err', el);
  const draw = () => {
    $$('#mv-dir button', el).forEach(b => b.classList.toggle('on', b.dataset.to === M.to));
    $('#mv-hint', el).textContent = t('mv.hint_' + M.to);
    const q = $('#mv-q', el).value.trim();
    const cand = (q ? filterProducts(q) : S.products.filter(p => p.active !== false)).filter(p => avail(p) > 0 && !M.lines.some(l => l.product_id == p.id)).slice(0, q ? 8 : 30);
    $('#mv-sug', el).innerHTML = cand.map(p => `<button class="li" type="button" data-mv-add="${esc(p.id)}" style="min-height:52px;padding:8px 12px"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc(t('shelf.gudang'))} ${fmtQty(gudangOf(p))} · ${esc(t('shelf.rak'))} ${fmtQty(shelfOf(p))} ${esc(p.unit || '')}</div></div>${ic('plus')}</button>`).join('')
      || (q || !M.lines.length ? `<div class="small muted" id="mv-none">${esc(t(q ? 'sell.no_match' : 'mv.none_' + M.to))}</div>` : '');
    $('#mv-lines', el).innerHTML = M.lines.map(l => { const p = prodById(l.product_id); return `<div class="li" data-mv-line="${esc(p.id)}" style="min-height:0;padding:8px 10px"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc(t(M.to === 'toko' ? 'mv.in_gudang' : 'mv.on_shelf', { qty: fmtQty(avail(p)), unit: p.unit || '' }))}</div></div>
      <input class="input num" style="width:96px;font-weight:800;font-size:18px" data-rule="num" data-mv-qty="${esc(p.id)}" inputmode="decimal" autocomplete="off" value="${esc(fmtQtyInput(l.qty))}" aria-label="${esc(t('qty'))} ${esc(p.name)}">
      <button class="icon-btn ghost sm" type="button" data-mv-del="${esc(p.id)}" aria-label="${esc(t('delete'))}">${ic('x')}</button></div>`; }).join('');
    $('#mv-head', el).textContent = t('mv.lines', { n: M.lines.length });
    $('span', $('#mv-ok', el)).textContent = t('mv.ok_' + M.to, { n: M.lines.length });
    $('#mv-ok', el).disabled = !M.lines.length;
  };
  $('#mv-dir', el).onclick = e => { const b = e.target.closest('[data-to]'); if (!b || b.dataset.to === M.to) return; M.to = b.dataset.to; M.lines = []; err.textContent = ''; draw(); };
  $('#mv-q', el).addEventListener('input', draw);
  $('#mv-q', el).addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault(); const v = e.target.value.trim(); const p = findBySku(v) || (filterProducts(v).length === 1 ? filterProducts(v)[0] : null); if (p) add(p); });
  const add = p => {
    if (!p) return;
    if (!(avail(p) > 0)) { err.textContent = M.to === 'toko' ? t('shelf.no_goods_in', { name: p.name, shop: fmtQty(shelfOf(p)) }) : t('mv.none_gudang'); return; }
    if (!M.lines.some(l => l.product_id == p.id)) M.lines.push({ product_id: p.id, qty: avail(p) });
    $('#mv-q', el).value = ''; err.textContent = ''; draw();
  };
  $('#mv-sug', el).onclick = e => { const b = e.target.closest('[data-mv-add]'); if (b) add(prodById(b.dataset.mvAdd)); };
  $('#mv-lines', el).onclick = e => { const b = e.target.closest('[data-mv-del]'); if (!b) return; M.lines = M.lines.filter(l => String(l.product_id) !== String(b.dataset.mvDel)); draw(); };
  $('#mv-lines', el).addEventListener('input', e => { const i = e.target.closest('[data-mv-qty]'); if (!i) return; const l = M.lines.find(x => String(x.product_id) === String(i.dataset.mvQty)); if (l) l.qty = qtyVal(i.value); err.textContent = ''; });
  $('#mv-ok', el).onclick = async () => {
    for (const l of M.lines) {
      const p = prodById(l.product_id);
      if (!(l.qty > 0)) { err.textContent = t('sc.bad', { name: p.name }); return; }
      if (l.qty > avail(p) + 1e-9) { err.textContent = t(M.to === 'toko' ? 'mv.too_much_gudang' : 'mv.too_much_rak', { name: p.name, qty: fmtQty(avail(p)) }); return; }
    }
    $('#mv-ok', el).disabled = true; err.textContent = '';
    try {
      const r = await api('move_stock', { to: M.to, lines: M.lines.map(l => ({ product_id: l.product_id, qty: l.qty })), note: $('#mv-note', el).value.trim() });
      applyStock(r.stock);
      const n = M.lines.length;
      dropModal(el);
      toast(t('mv.done_' + M.to, { n }), 'ok', 4000);
      renderGrid(); if (S.view === 'masuk') RENDER.masuk();
      if (typeof pre.onDone === 'function') pre.onDone();
    } catch (e) { err.textContent = e instanceof NetError ? t('mv.need_online') : errMsg(e); $('#mv-ok', el).disabled = false; }
  };
  draw();
}
/** The server refused a sale for the shelf (NOT_ON_SHELF): which goods, and a way to move them. */

/* ========== Terima bayar hutang (v13): tunai / transfer / QRIS, the transfer slip read by the AI (scan_payment), and
   which invoices the payment covers ("Bagian dari faktur no. …", partial allowed). An amount different from the slip
   needs a reason or a correction (server: MISMATCH). Offline: queued in the outbox with all these fields. ========== */
const payAccounts = () => (Array.isArray(settings().bank_accounts) ? settings().bank_accounts : []).filter(a => a && a.active !== false && a.id);
function openPayment(c) {
  const P = { method: 'tunai', amount: int(c.debt_balance), date: today(), bank: '', ref: '', account_id: '', photo_id: '', slip: null, thumb: '', scanning: false, scanErr: '',
    docs: null, docsErr: '', alloc: {}, reason: '', note: '', saving: false };
  const el = openModal({
    title: t('more.debt_pay'), id: 'debt-pay', focus: false, body: '',
    foot: `<button class="btn" data-act="modal-close">${esc(t('cancel'))}</button><button class="btn primary" id="py-ok">${esc(t('save'))}</button>`
  });
  const body = $('.modal-b', el);
  const slipAmt = () => P.slip ? int(P.slip.amount) : 0;
  const mismatch = () => P.method !== 'tunai' && !!P.photo_id && slipAmt() > 0 && slipAmt() !== P.amount;
  const allocList = () => Object.keys(P.alloc).map(ref => ({ ref, amount: int(P.alloc[ref]) }));
  const allocSum = () => sum(allocList(), a => a.amount);
  const draw = () => {
    const accts = payAccounts(), sl = P.slip || {};
    body.innerHTML = `<p style="margin-top:0"><b id="py-cust">${esc(c.name)}</b><br><span class="muted">${esc(t('debt'))}: <b class="red num" id="py-debt">${fmtRp(c.debt_balance)}</b></span></p>
      <div class="field"><label class="f">${esc(t('pay.method'))}</label><div class="seg" id="py-m">${['tunai', 'transfer', 'qris'].map(m => `<button type="button" data-m="${m}" id="py-m-${m}" class="${m === P.method ? 'on' : ''}">${esc(t('pm.' + m))}</button>`).join('')}</div></div>
      ${P.method === 'tunai' ? '' : `<div class="slip ${P.photo_id ? 'ok' : ''}" id="py-slip">
        ${P.thumb ? `<img class="thumb" src="${esc(P.thumb)}" alt="${esc(t('py.slip'))}">` : `<div class="thumb">${ic('camera')}</div>`}
        <div class="grow" style="min-width:150px">${P.scanning ? `<div class="row"><div class="spinner" style="width:22px;height:22px;border-width:3px;margin:0"></div><b>${esc(t('py.reading'))}</b></div>`
          : P.photo_id ? `<b class="okc" id="py-slip-ok">${esc(t('py.slip_ok'))}</b><div class="small" id="py-sender">${esc(t('py.sender'))}: <b>${esc(sl.sender_name || '—')}</b></div><div class="small muted">${esc([sl.bank, sl.transfer_ref, sl.date ? fmtDate(parseAnyDate(sl.date) || sl.date) : ''].filter(Boolean).join(' · '))}${slipAmt() ? ' · ' + fmtRp(slipAmt()) : ''}</div>${sl.readable === false ? `<div class="small" style="color:var(--warn);font-weight:800">${esc(t('py.unreadable'))}</div>` : ''}`
          : P.scanErr ? `<span class="red small">${esc(P.scanErr)}</span>` : `<b>${esc(t('py.slip'))}</b><div class="small muted">${esc(t('py.slip_hint'))}</div>`}</div>
        <label class="btn ${P.photo_id ? 'sm' : 'primary'}" for="py-photo" id="py-photo-btn" ${P.scanning ? 'aria-disabled="true" style="pointer-events:none"' : ''}>${ic('camera')} ${esc(P.photo_id ? t('pu.photo_retake') : t('py.slip_take'))}</label>${PHOTO_INPUT('py-photo')}</div>
        <div class="grid2"><div class="field"><label class="f" for="py-bank">${esc(t('py.bank'))}</label><input class="input" data-rule="pname" id="py-bank" maxlength="40" autocomplete="off" value="${esc(P.bank)}"></div>
          <div class="field"><label class="f" for="py-ref">${esc(t('py.ref'))}</label><input class="input" id="py-ref" maxlength="60" autocomplete="off" value="${esc(P.ref)}"></div></div>
        ${accts.length > 1 ? `<div class="field"><label class="f" for="py-acct">${esc(t('py.account'))}</label><select class="input" id="py-acct">${accts.map(a => `<option value="${esc(a.id)}" ${a.id === P.account_id ? 'selected' : ''}>${esc([a.bank, a.account_no, a.holder].filter(Boolean).join(' · '))}</option>`).join('')}</select></div>` : ''}`}
      <div class="grid2"><div class="field"><label class="f" for="py-amt">${esc(t('amount'))} (Rp)</label><input class="input money" data-rule="num" id="py-amt" inputmode="numeric" autocomplete="off" value="${esc(fmtNum(P.amount))}"></div>
        <div class="field"><label class="f" for="py-date">${esc(t('date'))}</label><input class="input" type="date" id="py-date" value="${esc(P.date)}"></div></div>
      <div id="py-mm"></div>
      <div class="card pad" id="py-alloc" style="margin:4px 0 12px;box-shadow:none"></div>
      <div class="field"><label class="f" for="py-note">${esc(t('notes'))}</label><input class="input" id="py-note" value="${esc(P.note)}"></div><div class="err" id="py-err" role="alert"></div>`;
    $('#py-m', body).onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; P.method = b.dataset.m; draw(); };
    const ph = $('#py-photo', body); if (ph) ph.onchange = () => { const f = ph.files[0]; if (f) scanSlip(f); };
    const bind = (id, k, fn) => { const i = $(id, body); if (i) i.addEventListener('input', () => { P[k] = fn ? fn(i.value) : i.value; }); };
    bind('#py-bank', 'bank', v => v.trim()); bind('#py-ref', 'ref', v => v.trim()); bind('#py-note', 'note');
    const ac = $('#py-acct', body); if (ac) { if (!P.account_id) P.account_id = ac.value; ac.onchange = () => { P.account_id = ac.value; }; }
    $('#py-date', body).onchange = e => { P.date = e.target.value || today(); };
    const amt = $('#py-amt', body);
    amt.addEventListener('input', () => { P.amount = moneyVal(amt.value); drawMM(); drawAllocSum(); });
    amt.addEventListener('change', () => { amt.value = fmtNum(P.amount); });
    drawMM(); drawAlloc();
  };
  /* amount ≠ slip: both amounts, a reason (required) or "Pakai jumlah di bukti" */
  const drawMM = () => {
    const box = $('#py-mm', body); if (!box) return;
    if (!mismatch()) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="mm" id="py-mismatch"><div class="ttl">${esc(t('py.mm_title'))}</div>
      <div class="two"><div><div class="k">${esc(t('py.mm_typed'))}</div><div class="v num" id="py-mm-typed">${fmtRp(P.amount)}</div></div><div><div class="k">${esc(t('py.mm_slip'))}</div><div class="v num" id="py-mm-slip">${fmtRp(slipAmt())}</div></div></div>
      <button type="button" class="btn sm block" id="py-use-slip">${esc(t('py.mm_use'))}</button>
      <div class="field" style="margin:10px 0 0"><label class="f" for="py-reason">${esc(t('py.mm_reason'))} *</label><input class="input" id="py-reason" maxlength="300" placeholder="${esc(t('py.mm_reason_ph'))}" value="${esc(P.reason)}"></div></div>`;
    $('#py-use-slip', box).onclick = () => { P.amount = slipAmt(); $('#py-amt', body).value = fmtNum(P.amount); drawMM(); drawAllocSum(); };
    $('#py-reason', box).addEventListener('input', e => { P.reason = e.target.value.trim(); });
  };
  const openDocs = () => (P.docs || []).filter(d => int(d.remaining) > 0);
  const drawAlloc = () => {
    const box = $('#py-alloc', body); if (!box) return;
    const head = `<div class="row wrap"><b class="grow">${esc(t('py.alloc_title'))}</b>${P.docs && openDocs().length ? `<button type="button" class="btn xs" id="py-auto">${esc(t('py.auto'))}</button>` : ''}</div><div class="small muted" style="margin:2px 0 8px">${esc(t('py.alloc_hint'))}</div>`;
    if (!P.docs) { box.innerHTML = head + (P.docsErr ? `<div class="small" style="color:var(--warn);font-weight:700" id="py-docs-err">${esc(P.docsErr)}</div>` : `<div class="spinner"></div>`); return; }
    const all = openDocs(), docs = P.allDocs ? all : all.slice(0, 25);
    box.innerHTML = head + (all.length ? `<div id="py-docs">${docs.map(d => { const on = P.alloc[d.ref] != null; return `<label class="al ${on ? 'on' : ''}" data-ref="${esc(d.ref)}">
        <input type="checkbox" data-al-chk="${esc(d.ref)}" ${on ? 'checked' : ''} aria-label="${esc(t('py.part_of', { no: d.ref }))}">
        <span><span class="t num">${esc(d.ref)}</span><br><span class="s">${esc(fmtDate(d.date))} · ${esc(t('py.rest'))} <b class="num">${fmtRp(d.remaining)}</b> / ${fmtRp(d.total)}</span></span>
        <input class="input num" data-rule="num" data-al-amt="${esc(d.ref)}" inputmode="numeric" autocomplete="off" ${on ? '' : 'disabled'} value="${on ? esc(fmtNum(P.alloc[d.ref])) : ''}" aria-label="${esc(t('amount'))} ${esc(d.ref)}"></label>`; }).join('')}</div>
      ${all.length > docs.length ? `<button type="button" class="btn xs block" id="py-docs-more">${esc(t('show_more', { n: all.length - docs.length }))}</button>` : ''}
      <div class="alsum" id="py-alloc-sum"></div>` : `<div class="small muted" id="py-no-docs">${esc(t('py.no_docs'))}</div>`);
    const auto = $('#py-auto', box); if (auto) auto.onclick = () => { autoFill(); drawAlloc(); };
    const more = $('#py-docs-more', box); if (more) more.onclick = () => { P.allDocs = true; drawAlloc(); };
    $$('[data-al-chk]', box).forEach(cb => cb.onchange = () => {
      const d = docs.find(x => x.ref === cb.dataset.alChk);
      if (cb.checked) { const left = Math.max(0, P.amount - allocSum()); P.alloc[d.ref] = Math.min(int(d.remaining), left) || int(d.remaining); } else delete P.alloc[d.ref];
      drawAlloc();
    });
    $$('[data-al-amt]', box).forEach(i => i.addEventListener('input', () => { P.alloc[i.dataset.alAmt] = moneyVal(i.value); drawAllocSum(); }));
    drawAllocSum();
  };
  /** Oldest invoice first, until the payment is used up. */
  const autoFill = () => { P.alloc = {}; let left = P.amount; for (const d of openDocs()) { if (left <= 0) break; const x = Math.min(left, int(d.remaining)); P.alloc[d.ref] = x; left -= x; } };
  const allocError = () => {
    for (const a of allocList()) {
      const d = openDocs().find(x => x.ref === a.ref);
      if (!(a.amount > 0)) return t('py.err_alloc_zero', { no: a.ref });
      if (d && a.amount > int(d.remaining)) return t('py.err_alloc_rest', { no: a.ref, amount: fmtRp(d.remaining) });
    }
    if (allocSum() > P.amount) return t('py.err_alloc_sum');
    return '';
  };
  const drawAllocSum = () => {
    const box = $('#py-alloc-sum', body); if (!box) return;
    const used = allocSum(), left = P.amount - used, e = allocError();
    box.innerHTML = `<span>${esc(t('py.allocated'))}: <span class="num" id="py-allocated">${fmtRp(used)}</span></span><span class="${left < 0 || e ? 'red' : left > 0 ? '' : 'okc'}">${esc(t('py.unallocated'))}: <span class="num" id="py-left">${fmtRp(left)}</span></span>${e ? `<span class="red small" style="flex-basis:100%" id="py-alloc-err">${esc(e)}</span>` : ''}`;
    $$('.al', body).forEach(r => r.classList.toggle('on', P.alloc[r.dataset.ref] != null));
  };
  async function scanSlip(file) {
    P.scanning = true; P.scanErr = ''; draw();
    try {
      const img = await imageToJpeg(file);
      P.thumb = img.thumb; draw();
      const r = await apiPhoto('scan_payment', { image_base64: img.base64, mime: img.mime });
      const ex = r.extracted || {};
      P.photo_id = r.photo_id || ''; P.slip = ex; P.reason = '';
      if (int(ex.amount) > 0) P.amount = int(ex.amount);
      if (ex.bank) P.bank = String(ex.bank).slice(0, 40);
      if (ex.transfer_ref) P.ref = String(ex.transfer_ref).slice(0, 60);
      const d = parseAnyDate(ex.date); if (d) P.date = d;
    } catch (e) { P.scanErr = (e instanceof NetError ? t('pu.scan_net') : errMsg(e)) + ' ' + t('pu.scan_retry'); }
    P.scanning = false; draw();
  }
  (async () => {
    try { const r = await api('party_ledger', { party_type: 'customer', customer_id: c.id }); P.docs = (r.docs || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))); }
    catch (e) { P.docsErr = e instanceof NetError ? t('py.docs_offline') : errMsg(e); }
    if (el.isConnected) drawAlloc();
  })();
  draw();
  $('#py-ok', el).onclick = async () => {
    const err = $('#py-err', body);
    if (P.amount <= 0) { err.textContent = t('amount_invalid'); return; }
    if (P.amount > c.debt_balance) { err.textContent = t('more.amount_exceeds'); return; }
    if (mismatch() && !P.reason) { err.textContent = t('py.err_reason'); const r = $('#py-reason', body); if (r) r.focus(); return; }
    const ae = allocError(); if (ae) { err.textContent = ae; return; }
    const data = { customer_id: c.id, amount: P.amount, method: P.method, note: String(P.note || '').trim(), pay_date: P.date || today() };
    if (P.method !== 'tunai') {
      if (P.bank) data.bank = P.bank;
      if (P.ref) data.transfer_ref = P.ref;
      if (P.account_id) data.account_id = P.account_id;
      if (P.photo_id) data.photo_id = P.photo_id; // the server takes slip_date from the slip it read
      if (mismatch()) data.mismatch_reason = P.reason;
    }
    const alloc = allocList().filter(a => a.amount > 0);
    if (alloc.length) data.alloc = alloc;
    $('#py-ok', el).disabled = true; err.textContent = '';
    try {
      const r = await api('receive_payment', data);
      c.debt_balance = int(r.customer ? r.customer.debt_balance : c.debt_balance - P.amount); applyPendingToLocalFor(c.id); saveCache();
      const ms = r.payment && r.payment.match_status;
      dropModal(el); toast(t('more.paid_ok', { amount: fmtRp(P.amount), rest: fmtRp(c.debt_balance) }) + (ms ? ' · ' + t('py.ms_' + ms) : ''), 'ok', 5000);
    } catch (e) {
      if (isRetryable(e)) { queueOp('payment', 'receive_payment', data); dropModal(el); toast(t('outbox.queued'), 'warn', 4000); return; }
      $('#py-ok', el).disabled = false;
      if (e.code === 'MISMATCH') { const sa = e.res ? int(e.res.slip_amount) : 0; if (sa) P.slip = Object.assign({}, P.slip || {}, { amount: sa }); drawMM(); err.textContent = t('py.err_reason'); return; }
      err.textContent = errMsg(e);
    }
  };
}
async function openVoidRequest() {

async function requestVoid(inv) {
  const r = await confirmBox(t('void.confirm', { inv }), { ok: t('void.send'), input: { label: t('reason'), required: true }, title: t('more.void') });
  if (!r.ok) return;
  try {
    const res = await api('request_void', { invoice_no: inv, reason: r.value });
    trackMyRequest(res.request_id, 'void', t('req.void', { inv }));
    closeModal(true);
    toast(t('void.sent', { id: res.request_id }), 'ok', 5000);
  } catch (e) { toast(e instanceof NetError ? t('apr.need_online') : errMsg(e), 'err', 5000); }
}

function openPriceChange(p) {
  const el = openModal({
    title: t('more.price'), id: 'price-change',
    body: `<p style="margin-top:0"><b>${esc(p.name)}</b><br><span class="small muted">${esc(t('price.now'))}: ${esc(t('eceran'))} ${fmtRp(p.retail_price)} · ${esc(t('grosir'))} ${fmtRp(p.wholesale_price)} (≥${fmtQty(p.wholesale_min_qty)})</span></p>

      <div id="pc-res"></div><div class="err" id="pc-err" role="alert"></div>`,
    foot: `<button class="btn" data-act="modal-close">${esc(t('cancel'))}</button><button class="btn primary" id="pc-ok">${esc(S.role === 'kasir' ? t('price.send') : t('save'))}</button>`
  });
  $('#pc-ok', el).onclick = async () => {
    const err = $('#pc-err', el);
    const data = { product_id: p.id, reason: $('#pc-reason', el).value.trim() };

        $('#pc-ok', el).hidden = true;
        trackMyRequest(res.request_id, 'price', t('req.price', { name: p.name }));
      }
    } catch (e) { err.textContent = e instanceof NetError ? t('apr.need_online') : errMsg(e); $('#pc-ok', el).disabled = false; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(errMsg(err), 'err'); });
});
document.addEventListener('keydown', e => {
  if (!$('#login').hidden && (L.step === 'pin' || L.step === 'newpin') && !modalOpen()) {
    if (/^\d$/.test(e.key)) { if (L.pin.length < pinMax() && !$('#pinpad[data-locked]')) { L.pin += e.key; L.err = ''; renderLogin(); } e.preventDefault(); return; }
    if (e.key === 'Backspace') { L.pin = L.pin.slice(0, -1); renderLogin(); e.preventDefault(); return; }
    if (e.key === 'Enter') { submitPin(); e.preventDefault(); return; }
  }
  if (e.key === 'Escape' && modalOpen()) { e.preventDefault(); closeModal(); return; }
  if (!S.inApp || $('#app').hidden || modalOpen() || !$('#gate').hidden) return;
  if (S.view === 'sell') {
    if (e.key === 'F9') { e.preventDefault(); openPay(); return; }
    const a = document.activeElement;
    const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable);
    if (!typing && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { const s = $('#q'); if (s) s.focus(); }
  }
});
window.addEventListener('resize', debounce(() => { if (isWide()) closeCartSheet(); }, 150));

/* ========== Hitung stok (blind stock count) → owner approval ==========
   The cashier counts what is on the shelf; system stock and differences are never shown here (the stock_count
   answer is not displayed either, only its request id). The count is a draft per user on this device until it
   is sent, so it survives a reload and offline periods ("butuh internet untuk mengirim"). */
const scKey = () => 'stock_count.' + String(S.user || '').toLowerCase();
const scLoad = () => Object.assign({ lines: [], note: '' }, KS.get(scKey(), null) || {});
const scSave = D => KS.set(scKey(), { lines: D.lines, note: D.note });
function openStockCount() {
  const D = scLoad();
  const el = openModal({
    title: t('sc.title'), id: 'stock-count', focus: false,
    body: `<p class="small muted" style="margin-top:0">${esc(t('sc.hint'))}</p>
      <div class="scanbar"><div class="search">${ic('search')}<input class="input" id="sc-q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="${esc(t('sc.search'))}" aria-label="${esc(t('sc.search'))}"></div>
        ${'BarcodeDetector' in window ? `<button class="icon-btn" id="sc-cam" type="button" aria-label="${esc(t('sell.camera'))}">${ic('scan')}</button>` : ''}</div>
      <div class="list" id="sc-sug"></div>
      <h3 style="font-size:16px;margin:14px 0 8px" id="sc-head"></h3>
      <div class="list" id="sc-lines"></div>
      <div class="field" style="margin-top:12px"><label class="f" for="sc-note">${esc(t('sc.note'))}</label><input class="input" id="sc-note" value="${esc(D.note || '')}"></div>
      <div class="small muted" id="sc-draft">${esc(t('sc.draft'))}</div>
      <div class="err" id="sc-err" role="alert"></div><div id="sc-res"></div>`,
    foot: `<button class="btn" data-act="modal-close">${esc(t('close'))}</button><button class="btn primary" id="sc-send">${ic('send')} <span></span></button>`
  });
  const q = $('#sc-q', el), sug = $('#sc-sug', el), box = $('#sc-lines', el), err = $('#sc-err', el), send = $('#sc-send', el);
  const filled = () => D.lines.filter(l => String(l.c || '').trim() !== '' && prodById(l.id));
  const head = () => { $('#sc-head', el).textContent = t('sc.counted', { n: filled().length, total: D.lines.length }); $('span', send).textContent = t('sc.send', { n: filled().length }); send.disabled = !filled().length; };
  const drawLines = () => {
    box.innerHTML = D.lines.map(l => { const p = prodById(l.id); if (!p) return ''; return `<div class="li" data-line="${esc(p.id)}" style="min-height:0;padding:8px 10px"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.sku || '')} · ${esc(p.unit || '')}</div></div>
      <input class="input num" style="width:96px;font-weight:800;font-size:18px" data-rule="num" data-sc="${esc(p.id)}" type="text" inputmode="${isWeightUnit(p.unit) ? 'decimal' : 'numeric'}" autocomplete="off" enterkeyhint="next" value="${esc(l.c || '')}" aria-label="${esc(t('sc.qty'))} ${esc(p.name)}">
      <button class="icon-btn ghost sm" type="button" data-sc-del="${esc(p.id)}" aria-label="${esc(t('delete'))}">${ic('x')}</button></div>`; }).join('') || `<div class="empty" id="sc-empty">${esc(t('sc.empty'))}</div>`;
    head();
  };
  const add = p => {
    if (!p || p.active === false) return;
    if (!D.lines.some(l => String(l.id) === String(p.id))) { D.lines.unshift({ id: p.id, c: '' }); scSave(D); drawLines(); }
    q.value = ''; sug.innerHTML = ''; err.textContent = '';
    const inp = $(`[data-sc="${p.id}"]`, el); if (inp) { inp.focus(); inp.select(); }
  };
  const drawSug = () => {
    const list = q.value.trim() ? filterProducts(q.value).slice(0, 8) : [];
    sug.innerHTML = list.map(p => `<button class="li" type="button" data-sc-add="${esc(p.id)}" style="min-height:52px;padding:8px 12px"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.sku || '')} · ${esc(p.unit || '')}</div></div>${ic('plus')}</button>`).join('');
  };
  q.addEventListener('input', drawSug);
  q.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = q.value.trim(); if (!v) return;
    const p = findBySku(v) || (filterProducts(v).length === 1 ? filterProducts(v)[0] : null);
    if (p) add(p); else if (/^\d{6,}$/.test(v)) { beep(); toast(t('sell.barcode_nf', { code: v }), 'err'); q.select(); }
  });
  const cam = $('#sc-cam', el); if (cam) cam.onclick = () => cameraScan(code => { const p = findBySku(code); if (p) add(p); else toast(t('sell.barcode_nf', { code }), 'err'); });
  sug.onclick = e => { const b = e.target.closest('[data-sc-add]'); if (b) add(prodById(b.dataset.scAdd)); };
  box.onclick = e => { const b = e.target.closest('[data-sc-del]'); if (!b) return; D.lines = D.lines.filter(l => String(l.id) !== String(b.dataset.scDel)); scSave(D); drawLines(); };
  box.addEventListener('input', e => { const i = e.target.closest('[data-sc]'); if (!i) return; const l = D.lines.find(x => String(x.id) === String(i.dataset.sc)); if (l) { l.c = i.value; scSave(D); head(); } });
  box.addEventListener('keydown', e => { const i = e.target.closest('[data-sc]'); if (!i || e.key !== 'Enter') return; e.preventDefault(); const all = $$('[data-sc]', box); const nx = all[all.indexOf(i) + 1]; if (nx) nx.focus(); else q.focus(); });
  $('#sc-note', el).oninput = e => { D.note = e.target.value; scSave(D); };
  send.onclick = async () => {
    const lines = filled();
    if (!lines.length) { err.textContent = t('sc.none'); return; }
    const bad = lines.find(l => { const v = qtyVal(l.c); return !/\d/.test(String(l.c)) || !Number.isFinite(v) || v < 0; });
    if (bad) { err.textContent = t('sc.bad', { name: prodById(bad.id).name }); return; }
    if (lines.length > 500) { err.textContent = t('sc.too_many'); return; }
    const ok = await confirmBox(t('sc.confirm', { n: lines.length }), { ok: t('sc.send_ok') });
    if (!ok.ok) return;
    send.disabled = true; err.textContent = '';
    try {
      const r = await api('stock_count', { counts: lines.map(l => ({ product_id: prodById(l.id).id, counted: qtyVal(l.c) })), note: String(D.note || '').trim() });
      const id = r.request_id || (r.approval || {}).request_id || '';
      const done = new Set(lines.map(l => String(l.id)));
      D.lines = D.lines.filter(l => !done.has(String(l.id))); if (!D.lines.length) D.note = '';
      scSave(D);
      if (r.applied) { (r.stock || []).forEach(s => { const p = prodById(s.product_id); if (p) p.stock = roundQty(num(s.stock) - pendingQty(p.id)); }); saveCache(); }
      else trackMyRequest(id, 'opname', t('req.opname', { n: lines.length }));
      // only the outcome is shown — never the system stock / differences in the answer
      $('#sc-res', el).innerHTML = `<div class="status ${r.applied ? 'cocok' : 'need'}" id="sc-sent"><div class="st">${ic('check')} ${esc(t(r.applied ? 'sc.applied' : 'sc.sent'))}</div>${id ? `<div>${esc(t('apr.request_id'))}: <b>${esc(id)}</b></div>` : ''}<div class="small">${esc(t('req.opname', { n: lines.length }))}</div></div>`;
      $('#sc-note', el).value = D.note || '';
      drawLines();
      toast(t(r.applied ? 'sc.applied' : 'sc.sent'), 'ok', 4000);
    } catch (e) {
      send.disabled = false;
      err.textContent = e instanceof NetError ? t('sc.offline') : errMsg(e);
    }
  };
  drawLines();
  if (!navigator.onLine) err.textContent = t('sc.offline');
  setTimeout(() => { if (!isTouch()) q.focus(); }, 30);
}
Object.assign(ACT, { 'stock-count': () => openStockCount() });

   khair-pos/demo.json {"open": false} (or deleting the file) closes every trial link and wipes the trial data
   on the phone; {"open": true, "until": "<ISO time>"} closes them by themselves at that time (server clock from
   the Date header, the phone's clock as fallback; remembered for offline use). Real mode is never affected; a
   local test server is never closed. */
async function demoStillOpen() {
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return true;
  try {
    const r = await fetch('../demo.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) return false;
    if (!r.ok) return true;
    const j = await r.json();
    try { localStorage.setItem('kdemo.until', j.until ? String(j.until) : ''); } catch (e) { }
    const now = Date.parse(r.headers.get('date') || '') || Date.now();
    return j.open === true && !(j.until && now > Date.parse(j.until));
  } catch (e) { // offline: only the last known expiry can be checked
    let u = ''; try { u = localStorage.getItem('kdemo.until') || ''; } catch (e2) { }
    return !(u && Date.now() > Date.parse(u));
  }
}
function showDemoClosed() {
  try { Object.keys(localStorage).filter(k => k.indexOf('kpos.mock.') === 0 || k.indexOf('kmock.') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { }
  document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;background:#f4f6fb;color:#1b2440">'
    + '<div style="max-width:360px"><div style="font-size:44px">🔒</div><h2 style="margin:8px 0">Link uji coba sudah ditutup</h2>'
    + '<p style="margin:0 0 12px;color:#55607a">Terima kasih sudah mencoba Khair Mart. Hubungi pemilik toko untuk akses.</p>'
    + '<p dir="rtl" style="margin:0;color:#55607a">انتهت فترة التجربة وتم إغلاق هذا الرابط. شكرًا لكم.</p></div></div>';
}
async function init() {
  applyLangAttrs();
  if (MOCK && !(await demoStillOpen())) { showDemoClosed(); return; }
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href) && !/[?&]nosw\b/.test(location.search)) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
  }
  if (MOCK) { try { await MockServer.ensure(); } catch (e) { console.error(e); } }
  try { await migrateSecrets(); } catch (e) { console.error(e); }
  const sess = KS.get('session'), live = SESS.get();
  if (DEMO) {
    if (!S.key) { S.key = 'demo'; store.set('key', 'demo'); }
    const want = new URLSearchParams(location.search).get('u');
    if (want && !(sess && sess.user && sess.user.toLowerCase() === want.toLowerCase())) { demoLogin(want); return; }
  }
  if (S.key && sess && sess.user && live && live.pin_hash && live.user === sess.user) { S.user = sess.user; S.role = sess.role; S.pin_hash = live.pin_hash; S.viaMaster = !!live.via; enterApp(false); return; }
  // locked session, or a kasir redirected here by the owner app (it remembers last_user) → PIN pad for that name
  const last = (sess && sess.user) || store.get('last_user', '');
  if (S.key) { if (last) { L.sel = last; showLogin('pin'); } else showLogin('users'); return; }
  showLogin('key');
}
window.KASIR = { S, MOCK, cartView, pinHash, syncOutbox, lineCalc, speakableName, I18N, DEV, devTick, devicePayload, deviceLabel, NoteMatch, PU, mockLog: () => MockServer.log };
init();
</script>
