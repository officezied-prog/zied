<script>
'use strict';
const CONFIG = { API_URL: 'https://khair-mart-jumla.officezied.workers.dev/webhook/khair-pos', TZ: 'Asia/Jakarta', CURRENCY: 'IDR' };
CONFIG.PHOTO_URL = 'https://khair-mart-jumla.officezied.workers.dev/webhook/khair-pos-photo';
CONFIG.ATT_URL = 'https://khair-mart-jumla.officezied.workers.dev/webhook/khair-att';
CONFIG.CHAT_URL = 'https://khair-mart-jumla.officezied.workers.dev/webhook/khair-chat';
// Field-sales backend (separate n8n workflow): the cashier reads field reps' orders read-only (cashier_orders).
CONFIG.FIELD_URL = 'https://khair-mart-jumla.officezied.workers.dev/webhook/khair-field';
const APP_VERSION = 'kasir-1.7.3';
// ?demo=1 = demo data (like ?mock=1) with an open login: tap a name, no store key or PIN. &u=Name logs that person in directly.
const DEMO = /[?&]demo=1\b/.test(location.search);
const MOCK = DEMO || /[?&]mock=1\b/.test(location.search);
/* Same prefix as the owner app (same origin): the store key, language, voice settings, user list and
   known PINs are shared on this device. Everything that belongs to the cashier app only (session,
   cart, outbox, cache, receipts) lives under the extra "kasir." prefix. */
const PREFIX = MOCK ? 'kpos.mock.' : 'kpos.';
const OUTBOX_RETRY_MS = 30000;

/* ========== Small utilities ========== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ESC_MAP[c]);
const int = v => { const n = Math.round(Number(v)); return Number.isFinite(n) ? n : 0; };
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const roundQty = q => Math.round(num(q) * 1000) / 1000;
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();

const NF = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const NFQ = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 3 });
const NF1 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtRp = n => (int(n) < 0 ? '-Rp ' : 'Rp ') + NF.format(Math.abs(int(n)));
const fmtNum = n => NF.format(int(n));
const fmtQty = q => NFQ.format(num(q));
const fmtPct = p => NF1.format(Number.isFinite(p) ? p : 0) + '%';

/** Parse "Rp 12.500", "12.500", "12,500.50", "1,5" … to a number (Indonesian-aware). */
function parseNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim().replace(/rp\.?/i, '').replace(/idr/i, '').replace(/[\s ]/g, '');
  if (!s) return 0;
  const neg = /^-|^\(.*\)$/.test(s);
  s = s.replace(/[^\d.,]/g, '');
  const lastDot = s.lastIndexOf('.'), lastCom = s.lastIndexOf(',');
  if (lastDot >= 0 && lastCom >= 0) {
    const dec = lastDot > lastCom ? '.' : ',';
    const thou = dec === '.' ? ',' : '.';
    s = s.split(thou).join('').replace(dec, '.');
  } else if (lastCom >= 0) {
    const parts = s.split(',');
    s = (parts.length > 2 || (parts[1] && parts[1].length === 3)) ? parts.join('') : parts.join('.');
  } else if (lastDot >= 0) {
    const parts = s.split('.');
    s = (parts.length > 2 || (parts[1] && parts[1].length === 3)) ? parts.join('') : s;
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? (neg ? -n : n) : 0;
}
/** Read a money input ("12.500" or "12500") as integer Rupiah. */
const moneyVal = v => Math.max(0, int(parseNum(v)));
const qtyVal = v => roundQty(String(v).includes(',') && !String(v).includes('.') ? String(v).replace(',', '.') : parseNum(v));

/* ========== Dates (Asia/Jakarta) ========== */
const DTF_DATE = new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const DTF_TIME = new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const DTF_HOUR = new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.TZ, hour: '2-digit', hour12: false });
const jktDate = (d = new Date()) => DTF_DATE.format(new Date(d));
const jktTime = d => { try { return DTF_TIME.format(new Date(d)); } catch (e) { return ''; } };
const jktHour = d => { try { return int(DTF_HOUR.format(new Date(d))) % 24; } catch (e) { return 0; } };
const today = () => jktDate(new Date());
/** ISO timestamp with +07:00 offset, e.g. 2026-10-06T11:50:00+07:00 */
function jktISO(d = new Date()) { const x = new Date(new Date(d).getTime() + 7 * 3600000).toISOString(); return x.slice(0, 19) + '+07:00'; }
const ADJUST_SUPPLIER = 'PENYESUAIAN STOK';
const isAdjustRow = r => String(r && r.supplier || '').trim().toUpperCase() === ADJUST_SUPPLIER;
function addDays(ymd, n) { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function fmtDate(ymd) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd || '')); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(ymd || ''); }
function fmtDateTime(iso, ymd) { return `${fmtDate(ymd || (iso ? jktDate(iso) : ''))} ${iso ? jktTime(iso) : ''}`.trim(); }
function monthStart(ymd) { return ymd.slice(0, 8) + '01'; }
function monthEnd(ymd) { const [y, m] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }

/* ========== Storage (always guarded) ========== */
const store = {
  get(k, def = null) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(PREFIX + k); } catch (e) { } }
};

/* ========== IDs & hashing ========== */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.random() * 256 | 0; }
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
/** Pure-JS SHA-256 fallback for non-secure contexts (e.g. http on a LAN IP). */
function sha256Fallback(str) {
  const bytes = new TextEncoder().encode(str);
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
  const bits = len * 8; for (let i = 0; i < 4; i++) m[total - 1 - i] = (bits >>> (8 * i)) & 255;
  m[total - 5] = Math.floor(bits / 2 ** 32) & 255;
  const W = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = (m[o + 4 * i] << 24) | (m[o + 4 * i + 1] << 16) | (m[o + 4 * i + 2] << 8) | m[o + 4 * i + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(W[i - 15], 7) ^ r(W[i - 15], 18) ^ (W[i - 15] >>> 3), s1 = r(W[i - 2], 17) ^ r(W[i - 2], 19) ^ (W[i - 2] >>> 10); W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha256Hex(str) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { }
  return sha256Fallback(str);
}
const pinHash = (key, user, pin) => sha256Hex(`${key}:${String(user).toLowerCase()}:${pin}`);

/** Phone → wa.me number (62…). */
function waNumber(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('0')) d = '62' + d.slice(1);
  else if (d.startsWith('8')) d = '62' + d;
  return d.length >= 9 ? d : '';

/* ========== Sell: cart model ========== */

function memberOf(c) {

  const tiers = Array.isArray(settings().member_tiers) && settings().member_tiers.length ? settings().member_tiers : MEMBER_TIERS;
  const n = int(c.visits) + 1;
  let pct = 0; tiers.forEach(x => { if (num(x.from) <= n && num(x.pct) > pct) pct = num(x.pct); });

}

 *  or the line quantity reaches wholesale_min_qty — and only if the product has a wholesale price. */
function lineCalc(line, cust, cart = S.cart) {
  const p = prodById(line.product_id) || { name: line.name || '?', retail_price: 0, wholesale_price: 0, wholesale_min_qty: 0, unit: '', stock: 0 };
  const wmin = num(p.wholesale_min_qty), hasW = int(p.wholesale_price) > 0;

  const type = want && hasW ? 'grosir' : 'eceran';

  const listOk = hasW && ((cust && cust.type === 'grosir') || (wmin > 0 && line.qty >= wmin));
  const list = Math.round(line.qty * (listOk ? Math.min(int(p.wholesale_price), int(p.retail_price) || int(p.wholesale_price)) : int(p.retail_price)));

}

function bindCartInputs() {

      if (sb) { toast(sb, 'err', 5000); const max = Math.max(0, Math.floor(shelfOf(pp) * 1000) / 1000); if (!(max > 0)) { S.cart.lines.splice(i, 1); saveCart(); renderCart(); renderGrid(); return; } S.cart.lines[i].qty = max; inp.value = fmtQtyInput(max); saveCart(); refreshCartNumbers(); renderGrid(); return; }
      S.cart.lines[i].qty = q; inp.value = fmtQtyInput(q); saveCart(); refreshCartNumbers(); renderGrid();

/* ========== Hold sale ("Tahan"): park the cart, serve the next customer, resume later ==========
   Held carts stay on this device under the store key (any cashier at this counter may resume them).
   Only product ids + quantities are kept: a resumed cart is priced again from the current product data. */
const HOLD_MAX = 10, HOLD_OLD_MS = 12 * 3600000;
const heldKey = () => 'held.' + String(S.key || '');
function heldList() { const a = KS.get(heldKey(), []); return Array.isArray(a) ? a.filter(h => h && h.id && h.cart && Array.isArray(h.cart.lines)) : []; }
const saveHeld = list => { KS.set(heldKey(), list); updateHeldChip(); };
const isOldHeld = h => Date.now() - new Date(h.held_at).getTime() > HOLD_OLD_MS;
/** Not while paying or while a credit approval is pending for this cart. */
const holdBlocked = () => !!(S.cart && S.cart.remote) || !!$('#pay') || !!$('#apr-step') || !!$('#apr-wait') || saving;
const canHold = () => !!(S.cart && S.cart.lines.length) && !holdBlocked();
function defaultHoldLabel(list, cart) {
  const cust = custById(cart.customer_id); if (cust) return cust.name;
  const used = new Set(list.map(h => h.label));
  let n = 1; while (used.has(t('hold.default', { n }))) n++;
  return t('hold.default', { n });
}
function heldAgo(iso) {
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  return m < 1 ? t('hold.just_now') : m < 60 ? t('hold.min_ago', { n: m }) : t('hold.hour_ago', { n: Math.floor(m / 60) });
}
/** A held cart priced with today's product data; lines whose product is gone or inactive are left out. */
function heldView(h) {
  const ok = h.cart.lines.filter(l => { const p = prodById(l.product_id); return p && p.active !== false; });
  return Object.assign(cartView(Object.assign({}, h.cart, { lines: ok })), { gone: h.cart.lines.length - ok.length });
}
/** Moves the current cart into the held list and starts an empty one. Returns the label ('' = refused). */
function holdCurrent(label) {
  const list = heldList();
  if (list.length >= HOLD_MAX) { toast(t('hold.full', { max: HOLD_MAX }), 'err', 4000); return ''; }
  const cart = Object.assign(clone(S.cart), { paid: '', remote: null, discReq: null });
  const lbl = String(label || '').trim().slice(0, 40) || defaultHoldLabel(list, cart);
  list.push({ id: uuid(), label: lbl, held_at: new Date().toISOString(), by: S.user, cart });
  saveHeld(list);
  clearTimeout(VOICE.timer);
  S.cart = newCart(); saveCart();
  return lbl;
}
function openHold() {
  if (!canHold()) { if (S.cart.lines.length) toast(t('hold.busy'), 'warn'); return; }
  const list = heldList();
  if (list.length >= HOLD_MAX) { toast(t('hold.full', { max: HOLD_MAX }), 'err', 4000); return; }
  const el = openModal({
    title: t('hold.title'), id: 'hold-prompt',
    body: `<p style="margin-top:0">${esc(t('hold.hint'))}</p>
      <div class="field"><label class="f" for="hold-label">${esc(t('hold.label'))}</label><input class="input" id="hold-label" maxlength="40" autocomplete="off" placeholder="${esc(defaultHoldLabel(list, S.cart))}" autofocus></div>
      <p class="small muted" style="margin:-4px 0 0">${esc(t('hold.label_hint'))}</p>`,
    foot: `<button class="btn" data-act="modal-close">${esc(t('cancel'))}</button><button class="btn primary" id="hold-ok">${ic('pause')} ${esc(t('hold.btn'))}</button>`
  });
  const fin = () => {
    const lbl = holdCurrent($('#hold-label', el).value);
    if (!lbl) return;
    dropModal(el); closeCartSheet(); renderCart(); renderGrid(); focusSearch();
    toast(t('hold.held', { label: lbl }), 'ok');
  };
  $('#hold-ok', el).onclick = fin;
  $('#hold-label', el).addEventListener('keydown', e => { if (e.key === 'Enter') fin(); });
}
function updateHeldChip() {
  const b = $('#held-chip'); if (!b) return;
  const list = heldList();
  b.hidden = !list.length;
  b.classList.toggle('old', list.some(isOldHeld));
  b.innerHTML = `${ic('pause')}<span>${esc(t('hold.chip', { n: list.length }))}</span>`;
}
function openHeld() {
  const el = openModal({ title: t('hold.list'), id: 'held-list', body: '' });
  drawHeld(el);
}
function drawHeld(el) {
  const body = $('.modal-b', el); if (!body) return;
  const list = heldList();
  body.innerHTML = list.length ? `<div class="list" id="held-items">${list.map(h => {
    const v = heldView(h), old = isOldHeld(h);
    return `<div class="li held ${old ? 'old' : ''}" data-id="${esc(h.id)}">${ic('pause')}
      <div class="grow"><div class="t">${esc(h.label)} ${old ? `<span class="badge warn">${esc(t('hold.old'))}</span>` : ''}</div>
        <div class="s"><span data-ref="n">${esc(t('sell.n_lines', { n: v.lines.length }))}</span> · <span data-ref="ago">${esc(heldAgo(h.held_at))}</span> (${esc(jktTime(h.held_at))})${h.by ? ' · ' + esc(h.by) : ''}</div>
        ${v.gone ? `<div class="s red">${esc(t('hold.n_gone', { n: v.gone }))}</div>` : ''}</div>
      <b class="num" data-ref="total">${fmtRp(v.total)}</b>
      <div class="acts"><button class="btn sm danger" data-act="held-del" data-id="${esc(h.id)}">${ic('trash')} ${esc(t('delete'))}</button><button class="btn sm primary" data-act="held-resume" data-id="${esc(h.id)}">${esc(t('hold.resume'))}</button></div></div>`;
  }).join('')}</div>` : `<div class="empty">${esc(t('hold.empty'))}</div>`;
}
/** Resume a held cart. A non-empty current cart is held first (swap). Voice stays silent. */
function resumeHeld(id) {
  const list = heldList(), h = list.find(x => x.id === id);
  if (!h) { const m = $('#held-list'); if (m) drawHeld(m); return; }
  if (S.cart.lines.length && !canHold()) { toast(t('hold.busy'), 'warn'); return; }
  // the swap label is chosen before the resumed entry leaves the list ("Pelanggan 1" is not reused at once)
  const swapLabel = S.cart.lines.length ? defaultHoldLabel(list, S.cart) : '';
  saveHeld(list.filter(x => x.id !== id));
  const swapped = swapLabel ? holdCurrent(swapLabel) : '';
  const cart = Object.assign(newCart(), h.cart, { paid: '', remote: null, discReq: null });
  const gone = [];
  cart.lines = cart.lines.filter(l => { const p = prodById(l.product_id); if (!p || p.active === false) { gone.push(p ? p.name : l.name); return false; } l.name = p.name; return true; });
  if (cart.customer_id != null && !custById(cart.customer_id)) { cart.customer_id = null; if (cart.method === 'hutang') cart.method = 'tunai'; }
  S.cart = cart; saveCart();
  closeModal(true);
  renderCart(); renderGrid();
  if (cart.lines.length && !isWide()) openCartSheet();
  toast(swapped ? t('hold.swapped', { held: swapped, label: h.label }) : t('hold.resumed', { label: h.label }), 'ok', swapped ? 5000 : 2800);
  if (gone.length) toast(t('hold.dropped', { names: gone.join(', ') }), 'warn', 6000);
  const low = cart.lines.find(l => num(prodById(l.product_id).stock) < l.qty);
  if (low) toast(t('sell.stock_low', { name: low.name }), 'warn', 3000);
}
async function deleteHeld(id) {
  const h = heldList().find(x => x.id === id); if (!h) return;
  const r = await confirmBox(t('hold.del_confirm', { label: h.label }), { danger: true, ok: t('delete') });
  if (!r.ok) return;
  saveHeld(heldList().filter(x => x.id !== id));
  toast(t('hold.deleted'), 'ok');
  const m = $('#held-list'); if (m) drawHeld(m);
}

/* ========== Survey (consent + speech-to-text, text only) ==========
   Manual form, optional: opened only from the "Isi survei manual" link in the payment window. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const SP = { rec: null, idx: -1, want: false, base: '', fin: '' };
function stopSpeech() { SP.want = false; if (SP.rec) { try { SP.rec.stop(); } catch (e) { } } SP.rec = null; SP.idx = -1; $$('.mic.on').forEach(b => b.classList.remove('on')); }
function startSpeech(i, root) {
  stopSpeech(); stopVoice();
  const ta = $(`[data-sq="${i}"]`, root), intEl = $(`#sv-int-${i}`, root), btn = $(`.mic[data-i="${i}"]`, root);
  const rec = new SpeechRec();
  rec.lang = 'id-ID'; rec.continuous = true; rec.interimResults = true;
  SP.rec = rec; SP.idx = i; SP.want = true; SP.base = ta.value.trim() ? ta.value.trim() + ' ' : ''; SP.fin = '';
  rec.onresult = e => {
    let interim = '';
    for (let k = e.resultIndex; k < e.results.length; k++) { const r = e.results[k]; if (r.isFinal) SP.fin += r[0].transcript; else interim += r[0].transcript; }
    ta.value = (SP.base + SP.fin).trim(); intEl.textContent = interim;
  };
  rec.onerror = e => { if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)) { SP.want = false; toast(t('survey.mic_denied'), 'err'); } };
  rec.onend = () => {
    intEl.textContent = '';
    if (SP.want && SP.rec === rec) { SP.base = ta.value.trim() ? ta.value.trim() + ' ' : ''; SP.fin = ''; try { rec.start(); } catch (e) { stopSpeech(); } }
    else btn.classList.remove('on');
  };

function payCalc(v) {
  const c = S.cart, m = c.method, typed = String(c.paid).trim() !== '';
  let paid = v.total, change = 0, debt = 0, error = '';
  if (m === 'tunai') { paid = typed ? moneyVal(c.paid) : v.total; if (paid < v.total) error = t('pay.short', { amount: fmtRp(v.total - paid) }); change = Math.max(0, paid - v.total); }
  else if (m === 'hutang') { paid = Math.min(v.total, typed ? moneyVal(c.paid) : 0); debt = v.total - paid; if (!v.cust) error = t('pay.need_customer'); else if (debt <= 0) error = t('pay.no_debt'); }
  let parts = null;
  if (m === 'campur') {
    // v51 (owner 2026-10-15: «نصف نقدا والنصف الآخر عن طريق الجوال أو التحويل»): transfer + QRIS as typed, the rest in cash — the
    // change comes from the cash only; what is still missing is debt (a customer + the manager's approval, like hutang)
    const sp = c.split || {}, tr = moneyVal(sp.transfer || ''), qr = moneyVal(sp.qris || ''), kr = moneyVal(sp.kartu || ''), nonCash = tr + qr + kr, need = Math.max(0, v.total - nonCash);
    const cashIn = String(sp.tunai || '').trim() !== '' ? moneyVal(sp.tunai) : need, cash = Math.min(cashIn, need);
    change = Math.max(0, cashIn - need); paid = cash + Math.min(nonCash, v.total); debt = Math.max(0, v.total - paid);
    parts = [['tunai', cash], ['transfer', tr], ['qris', qr], ['kartu', kr]].filter(x => x[1] > 0).map(x => ({ method: x[0], amount: x[1] }));
    if (!(nonCash > 0)) error = t('pay.split_need');
    else if (nonCash > v.total) error = t('pay.split_over', { amount: fmtRp(nonCash - v.total) });
    else if (debt > 0 && !v.cust) error = t('pay.split_short', { amount: fmtRp(debt) });
    return { method: m, paid, change, debt, error, parts, need };

  if (pay.error) { toast(pay.error, 'err'); return 'error'; }
  stopVoice(); // finishing the payment ends the recording (the text so far goes with the sale)
  saving = true;
  const ok = $('#pay-ok'); if (ok) { ok.disabled = true; ok.textContent = t('saving'); }
  const req = Object.assign(buildSaleRequest(v, pay), extra), rc = receiptFromCart(v, pay, req);
  const dr = S.cart.discReq; if (dr && dr.request_id && !req.discount_approval_id) req.discount_approval_id = dr.request_id; // v16

    rc.invoice_no = r.invoice_no || (r.sale && r.sale.invoice_no) || '';

    if (e.code === 'DISCOUNT_APPROVAL_REQUIRED') { if (S.cart.discReq && S.cart.discReq.status !== 'pending') S.cart.discReq = null; saveCart(); openDiscountStep(cartView(), e.message || errMsg(e)); return 'discount'; }

const APR_POLL_MS = 5000, APR_MAX_MS = 15 * 60000;
function openWaiting(ap) {

    title: t('apr.waiting_title'), id: 'apr-wait',
    body: `<div class="wait"><div class="small muted">${esc(t('apr.request_id'))}</div><div class="rid" id="aw-id">${esc(ap.request_id)}</div>
      <p style="margin:6px 0"><b>${esc(ap.customer_name || '')}</b></p>
      <div class="row" style="justify-content:center;gap:18px;flex-wrap:wrap"><span>${esc(t('apr.debt_new'))}: <b class="red num">${fmtRp(ap.debt_amount)}</b></span><span>${esc(t('total'))}: <b class="num">${fmtRp(ap.total)}</b></span></div>
      <div id="aw-state"><div class="spinner"></div><div id="aw-msg">${esc(t('apr.waiting'))}</div><div class="small muted" id="aw-time"></div></div></div>`,
    foot: `<button class="btn" id="aw-cancel">${esc(t('apr.stop_wait'))}</button>`,
    onClose: () => { stopped = true; clearTimeout(timer); refreshCartNumbers(); }
  });
  const msg = txt => { const m = $('#aw-msg', el); if (m) m.textContent = txt; };
  const finish = html => { stopped = true; clearTimeout(timer); $('#aw-state', el).innerHTML = html; };
  $('#aw-cancel', el).onclick = () => dropModal(el);
  const tick = async () => {
    if (stopped) return;
    const secs = Math.round((Date.now() - started) / 1000);
    const tm = $('#aw-time', el); if (tm) tm.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    if (Date.now() - started > APR_MAX_MS) {
      finish(`<p class="red"><b>${esc(t('apr.timeout'))}</b></p><button class="btn primary" id="aw-again">${esc(t('apr.wait_again'))}</button>`);
      $('#aw-again', el).onclick = () => { dropModal(el); openWaiting(ap); };
      return;
    }
    try {
      const r = await api('check_approval', { request_id: ap.request_id });
      if (stopped) return;
      const a = r.approval || {};
      updateMyRequest(a);
      if (a.status === 'approved') {
        if (S.cart.remote && S.cart.remote.request_id === ap.request_id) { S.cart.remote.approved = true; saveCart(); }
        finish(`<p class="okc"><b>${esc(t('apr.approved_by', { name: a.decided_by || '' }))}</b></p><div class="spinner"></div>`);
        const res = await doSave({ approval_id: ap.request_id });
        if (res === 'ok' || res === 'queued') { /* finishSale cleared the cart (and its remote) */ } else dropModal(el);
        return;
      }
      if (a.status === 'rejected' || a.status === 'used') {

        finish(`<p class="red" style="font-size:19px"><b>${esc(a.status === 'used' ? t('apr.used') : t('apr.rejected_by', { name: a.decided_by || '' }))}</b></p>${a.note ? `<p id="aw-note">“${esc(a.note)}”</p>` : ''}<button class="btn primary" data-act="modal-close" id="aw-back">${esc(t('apr.back_to_cart'))}</button>`);

      msg(t('apr.waiting'));
    } catch (e) {
      if (stopped) return;

}

function openDiscWait(info) {
  let timer = null, stopped = false;
  const started = Date.now();
  const el = openModal({
    title: t('apr.waiting_title'), id: 'disc-wait',
    body: `<div class="wait"><div class="small muted">${esc(t('apr.request_id'))}</div><div class="rid" id="dw-id">${esc(info.request_id)}</div>
      <p style="margin:6px 0">${esc(t('disc.waiting_for', { pct: fmtPct1(info.pct), amount: fmtRp(info.amount) }))}</p>
      <div id="dw-state"><div class="spinner"></div><div id="dw-msg">${esc(t('apr.waiting'))}</div></div></div>`,
    foot: `<button class="btn" id="dw-cancel">${esc(t('apr.stop_wait'))}</button>`,
    onClose: () => { stopped = true; clearTimeout(timer); refreshCartNumbers(); }
  });
  const finish = html => { stopped = true; clearTimeout(timer); $('#dw-state', el).innerHTML = html; };
  $('#dw-cancel', el).onclick = () => dropModal(el);
  const tick = async () => {
    if (stopped) return;
    if (Date.now() - started > APR_MAX_MS) { finish(`<p class="red"><b>${esc(t('apr.timeout'))}</b></p>`); return; }
    try {
      const a = (await api('check_approval', { request_id: info.request_id })).approval || {};
      if (stopped) return;
      updateMyRequest(a);
      if (a.status === 'approved') {
        if (S.cart.discReq && S.cart.discReq.request_id === info.request_id) Object.assign(S.cart.discReq, { status: 'approved', by: a.decided_by || '' });
        saveCart();
        finish(`<p class="okc" id="dw-ok"><b>${esc(t('disc.approved_by', { name: a.decided_by || '' }))}</b></p>`);
        dropModal(el);
        const pay = $('#pay'); if (pay) drawPay(pay.closest('.modal-bg'));
        await doSave();
        return;
      }
      if (a.status === 'rejected' || a.status === 'used') {
        if (S.cart.discReq && S.cart.discReq.request_id === info.request_id) S.cart.discReq = null;
        saveCart();
        finish(`<p class="red" style="font-size:19px" id="dw-rej"><b>${esc(a.status === 'used' ? t('apr.used') : t('disc.rejected_by', { name: a.decided_by || '' }))}</b></p>${a.note ? `<p id="dw-note">“${esc(a.note)}”</p>` : ''}<button class="btn primary" data-act="modal-close">${esc(t('apr.back_to_cart'))}</button>`);
        return;
      }
    } catch (e) { if (stopped) return; const m = $('#dw-msg', el); if (m) m.textContent = e instanceof NetError ? t('apr.retrying') : errMsg(e); }
    timer = setTimeout(tick, APR_POLL_MS);
  };
  timer = setTimeout(tick, 600);
}

async function saveWaContact(el, rc) {
  const w = $('#wa-wrap', el), err = $('#wa-err', w), btn = $('#wa-save', w);
  const raw = $('#wa-phone', w).value.trim(), phone = normPhone(raw), name = $('#wa-name', w).value.trim().slice(0, 60);
  if (!phone) { err.textContent = raw ? t('wa.bad_phone') : t('required') + ': ' + t('wa.phone'); $('#wa-phone', w).focus(); return; }
  if (!$('#wa-optin', w).checked) { err.textContent = t('wa.need_optin'); return; }
  err.textContent = ''; btn.disabled = true;
  const data = { name, phone, type: 'eceran', wa_optin: true, source: 'kasir' };

    rc.wa = { phone, name: name || defaultCustName(phone), saved: true, pending: true };
    toast(t('outbox.queued'), 'warn', 4000);
  }
  rememberReceipt(rc);
  drawWaCard(el, rc);

/* ========== Exit photo (large sale leaves the store) ========== */
async function imageToJpeg(file, max = 1600, quality = 0.8) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = url; });
    const draw = (m, q) => {
      const sc = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', q);
    };
    const full = draw(max, quality);
    return { base64: full.slice(full.indexOf(',') + 1), mime: 'image/jpeg', thumb: draw(240, 0.7) };
  } finally { URL.revokeObjectURL(url); }
}

/* ========== Camera barcode scanning (v47: every device — the phone's own reader or ZXing, see shared/barcode-cam.js) ========== */
const camOk = () => !!(window.KScan && KScan.available());
async function cameraScan(onCode) {
  if (!camOk()) { toast(t('scan.none'), 'err', 6000); return; }
  let stream = null, stop = false;
  const el = openModal({ title: t('sell.camera'), cls: 'cam', body: `<video id="cam-v" playsinline muted></video><p class="small muted center">${esc(t('sell.camera_hint'))}</p>`, onClose: () => { stop = true; if (stream) stream.getTracks().forEach(tr => tr.stop()); } });
  const dp = KScan.detector(); dp.catch(() => { });
  try {
    const v = $('#cam-v', el);
    stream = await KScan.open(v);
    if (stop) { stream.getTracks().forEach(tr => tr.stop()); return; } // closed while the phone asked for the camera
    const det = await dp; v.dataset.reader = det.kind;
    while (!stop) {
      try { const codes = await det.detect(v); if (codes.length) { dropModal(el); onCode(codes[0]); return; } } catch (e) { }
      await sleep(180);
    }
  } catch (e) {
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    const k = KScan.errorKind(e);
    if (!stop) { toast(t(k === 'denied' ? 'scan.denied' : k === 'none' ? 'scan.none' : k === 'busy' ? 'scan.busy' : 'sell.camera_fail'), 'err', 8000); dropModal(el); }
  }
}

/* ========== Outbox (offline queue: sales, debt payments, expenses, cash moves, customer numbers) ========== */
let syncing = false;
const OUT_LABEL = { sale: 'outbox.k_sale', payment: 'outbox.k_payment', expense: 'outbox.k_expense', cash_move: 'outbox.k_cash', contact: 'outbox.k_contact' };
function saveOutbox() { KS.set('outbox', S.outbox); updateOutboxBadge(); }
function queueOp(kind, action, data, extra = {}) {
  const id = data.client_id || uuid();
  if (S.outbox.some(e => e.id === id)) return;
  S.outbox.push({ id, kind, action, data, rc: extra.rc || null, label: extra.label || '', key: S.key, user: S.user, pin_hash: S.pin_hash, queued_at: new Date().toISOString(), tries: 0, error: '' });
  if (kind === 'sale') {
    for (const it of data.items) { const p = prodById(it.product_id); if (p) { p.stock = roundQty(p.stock - it.qty); if (p.shop_stock != null && p.shop_stock !== '') p.shop_stock = roundQty(num(p.shop_stock) - it.qty); } }
    const c = custById(data.customer_id); if (c && extra.rc) { c.debt_balance += int(extra.rc.debt); extra.rc.debt_after = c.debt_balance; }
  }
  if (kind === 'payment') { const c = custById(data.customer_id); if (c) c.debt_balance = Math.max(0, c.debt_balance - int(data.amount)); }
  saveOutbox(); saveCache();
}
function updateOutboxBadge() {
  const b = $('#tb-outbox'); if (!b) return;
  const n = S.outbox.length;
  b.hidden = !n; b.innerHTML = `${ic('refresh')}<span class="num" id="tb-outbox-n">${n}</span><span class="lbl">${esc(t('outbox.pending'))}</span>`;
  b.setAttribute('aria-label', t('outbox.badge', { n }));
  const m = $('#more-outbox-n'); if (m) m.textContent = n;
}
async function syncOutbox(manual) {
  if (syncing || !S.outbox.length) { if (manual && !S.outbox.length) toast(t('outbox.empty'), 'ok'); return; }
  syncing = true;
  let sent = 0;
  try {
    for (const e of S.outbox.slice()) {
      const cred = manual && e.error === 'BAD_PIN' && S.pin_hash ? sessCred() : { key: e.key, user: e.user, pin_hash: e.pin_hash };
      try {
        // v16: a sale the customer already paid offline is never refused for the shelf (queued: true, logged for the owner)
        const r = await apiRaw(e.action, e.kind === 'sale' ? Object.assign({}, e.data, { queued: true }) : e.data, cred);
        S.outbox = S.outbox.filter(x => x.id !== e.id);
        saveOutbox();
        if (e.kind === 'sale') {
          applyStock(r.stock);
          const rc = Object.assign({}, e.rc, { pending: false, invoice_no: r.invoice_no || (r.sale && r.sale.invoice_no) || e.rc.invoice_no, exit_required: !!r.exit_photo_required });
          rememberReceipt(rc);
        }
        if (e.kind === 'payment' && r.customer) { const c = custById(r.customer.id); if (c) { c.debt_balance = int(r.customer.debt_balance); applyPendingToLocalFor(c.id); saveCache(); } }
        if ((e.kind === 'cash_move' || e.kind === 'expense') && r.shift) S.shift = r.shift;
        if (e.kind === 'contact' && r.customer) upsertCustomer(r.customer);
        sent++;
      } catch (err) {
        e.tries++; e.error = err.code || 'SERVER'; e.message = err.message || '';
        saveOutbox();
        if (err instanceof NetError) break;
      }
    }
  } finally { syncing = false; }
  if (sent) { toast(t('outbox.synced', { n: sent }), 'ok'); if (S.view === 'kas') RENDER.kas(); const ob = $('#outbox'); if (ob) drawOutbox(ob.closest('.modal-bg')); }
  else if (manual && S.outbox.length) toast(t('outbox.still', { n: S.outbox.length }), 'warn');
}
function applyPendingToLocalFor(cid) { for (const e of S.outbox) { if (e.kind === 'sale' && e.data.customer_id == cid && e.rc) custById(cid).debt_balance += int(e.rc.debt); if (e.kind === 'payment' && e.data.customer_id == cid) custById(cid).debt_balance -= int(e.data.amount); } }
setInterval(() => { if (S.inApp && S.pin_hash) syncOutbox(); }, OUTBOX_RETRY_MS);

function parseAnyDate(v) {

  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/.exec(s); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }

/* ---- History of goods-in (last 14 days), grouped by purchase_no; corrections only through a request ---- */
function groupPurchases(rows) {
  const g = new Map();
  PUH.returned = {};
  rows.filter(r => r.purchase_no && r.match_status === 'retur').forEach(r => {
    const m = /dari (\S+)/.exec(String(r.note || '')); if (!m) return;
    const x = PUH.returned[m[1]] = PUH.returned[m[1]] || {};
    x[String(r.product_id)] = roundQty((x[String(r.product_id)] || 0) + Math.abs(num(r.qty)));
  });
  rows.filter(r => r.purchase_no).forEach(r => {
    let x = g.get(r.purchase_no);
    if (!x) { x = { no: r.purchase_no, date: r.purchase_date, supplier: r.supplier || '', user: r.user || '', match: '', notes: '', lines: new Map(), fixes: 0, base: false, order: 0 }; g.set(r.purchase_no, x); }
    if (r.match_status === 'koreksi') x.fixes++;
    else { if (!x.base || String(r.purchase_date) < String(x.date)) x.date = r.purchase_date; x.base = true; x.match = r.match_status || ''; x.notes = r.match_notes || ''; x.supplier = r.supplier || ''; x.user = r.user || ''; }
    x.order = Math.max(x.order, num(r.id));
    const k = String(r.product_id), ln = x.lines.get(k) || { product_id: r.product_id, name: r.name, qty: 0 };
    ln.qty = roundQty(ln.qty + num(r.qty)); x.lines.set(k, ln);
  });
  return [...g.values()].filter(x => x.base).map(x => Object.assign(x, { lines: [...x.lines.values()] }))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.order - a.order || String(b.no).localeCompare(String(a.no)));
}

  const find = async () => {
    const no = inv.value.trim().toUpperCase();

    send.disabled = true; err.textContent = '';

        returned_by: R.by.trim(), returned_by_phone: R.phone.trim(), refund_method: R.method, client_id: uuid() });
      const id = r.request_id || (r.approval || {}).request_id;

        <div class="grow" style="min-width:150px"><div style="font-weight:800">${esc(t('sr.photo'))} *</div><div id="sr-photo-st">${R.uploading ? `<span class="muted">${esc(t('saving'))}</span>` : R.photo_id ? `<b class="okc" id="sr-photo-ok">${esc(t('sr.photo_ok'))}</b>` : `<span class="muted small">${esc(t('sr.photo_hint'))}</span>`}</div></div>

/* ========== v16 "Pindah ke rak": warehouse → shop shelf (or back) with move_stock ==========

   were made (and, if known, how much bulk went in), sees the yield and SENDS A REQUEST — nothing moves until the manager or the accountant
   approves. One request per bulk product at a time (the server says who asked first); the request carries a client id kept for this form,
   so a double tap, a retry or a resend is the same request. A manager here repacks directly (as in the owner app; the owner is told).
   v39 (owner 2026-10-12: «طلب التعليب لا يحتاج إلى موافقات … بس يقوم بإرسال معلومات للمدير ولي أنا وللمحاسب»): no request any more — the
   cashier SAVES the repack, the stock moves at once and the owner, manager and accountant are told. Same bulk repacked in the last 2 h →

/* v50 (owner 2026-10-15: «تنطلق عملية التعبية باختيار العنصر الكبير … ثم اختيار من القائمة العنصر الصغير … ثم الحاسوب يحسب مباشرة الكمية
   المطلوبة … وبعد عملية التعليب تقع الموافقة على الكمية التي تمت عن طريق المدير»; «إمكانية كتابة الكلمة كاملة ليس الحرف فقط»): the form starts
   from the BULK (type any word of its name), then one of its packs; the bulk amount gives the packs at once (whole packs + what is

/* ========== Hitung stok (blind stock count) → owner approval ==========
   The cashier counts what is on the shelf; system stock and differences are never shown here (the stock_count
   answer is not displayed either, only its request id). The count is a draft per user on this device until it
   is sent, so it survives a reload and offline periods ("butuh internet untuk mengirim"). */
const scKey = () => 'stock_count.' + String(S.user || '').toLowerCase();
/** v40: a cashier's count goes to the manager (the owner is told); a manager's own count is applied at once (the owner is told). */
const scK = k => S.role === 'manager' ? k + '_mgr' : k;
const scLoad = () => Object.assign({ lines: [], note: '' }, KS.get(scKey(), null) || {});
const scSave = D => KS.set(scKey(), { lines: D.lines, note: D.note });
/** v40 (owner 2026-10-12: «قائمة للبضائع في شكل جدول يصلح العدد بسرعة»): every product is a row of one table with its
    count box — filter by category, by name or by scanning, type the number, Enter goes to the next row. Still blind:
    no system stock in the table. Rows are drawn a page at a time so a store with thousands of products stays fast. */
const SC_PAGE = 60, SC_MAX = 2000;
function openStockCount() {
  const D = scLoad(), V = { mode: 'all', cat: '', limit: SC_PAGE }; // mode: all products | one category | counted only
  const ALL = S.products.filter(p => p.active !== false).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const cats = [...new Set(ALL.map(p => String(p.category || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const el = openModal({
    title: t('sc.title'), id: 'stock-count', focus: false,
    body: `<p class="small muted" style="margin-top:0">${esc(t(scK('sc.hint')))}</p>
      ${(() => { const o = opnameInfo(settings()); return o ? `<p class="small" id="sc-due" data-status="${o.status}" style="margin-top:0"><b>${esc(t('op.last_next', { last: o.last ? fmtDate(o.last) : t('op.never'), next: fmtDate(o.next) }))}</b>${o.status === 'overdue' ? ` <span class="badge red">${esc(t('op.late_n', { n: -o.left }))}</span>` : ''}</p>` : ''; })()}
      <div class="scanbar"><div class="search">${ic('search')}<input class="input" id="sc-q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="${esc(t('sc.search'))}" aria-label="${esc(t('sc.search'))}"></div>
        ${camOk() ? `<button class="icon-btn" id="sc-cam" type="button" aria-label="${esc(t('sell.camera'))}">${ic('scan')}</button>` : ''}</div>
      <div class="sc-modes" role="group">
        <button type="button" class="btn sc-mode" id="sc-all" data-sc-mode="all" aria-pressed="false">${ic('list')}<span>${esc(t('sc.all'))}</span><b class="sc-n">${ALL.length}</b></button>
        <button type="button" class="btn sc-mode" id="sc-bycat" data-sc-mode="cat" aria-pressed="false">${ic('tag')}<span>${esc(t('sc.by_cat'))}</span></button></div>
      <div class="chips" id="sc-cats" style="margin-top:8px" hidden>${cats.map(c => `<button type="button" class="chip" data-sc-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="row" style="align-items:center;margin:8px 0;gap:8px"><h3 class="grow" style="font-size:16px;margin:0" id="sc-head"></h3><button type="button" class="chip" id="sc-done" data-sc-mode="done" aria-pressed="false"></button></div>
      <div class="sc-table" id="sc-lines" role="table" aria-labelledby="sc-head"><div class="sc-th" role="row"><span class="grow" role="columnheader">${esc(t('sc.col_item'))}</span><span role="columnheader" style="width:96px;text-align:center">${esc(t('sc.col_count'))}</span></div><div id="sc-rows"></div></div>
      <button class="btn ghost block" id="sc-more" type="button" style="margin-top:6px" hidden></button>
      <div class="field" style="margin-top:12px"><label class="f" for="sc-note">${esc(t('sc.note'))}</label><input class="input" id="sc-note" value="${esc(D.note || '')}"></div>
      <div class="small muted" id="sc-draft">${esc(t('sc.draft'))}</div>
      <div class="err" id="sc-err" role="alert"></div><div id="sc-res"></div>`,
    foot: `<button class="btn" data-act="modal-close">${esc(t('close'))}</button><button class="btn primary" id="sc-send">${ic('send')} <span></span></button>`
  });
  const q = $('#sc-q', el), box = $('#sc-rows', el), more = $('#sc-more', el), err = $('#sc-err', el), send = $('#sc-send', el);
  const lineOf = id => D.lines.find(l => String(l.id) === String(id));
  const isSet = l => !!l && String(l.c || '').trim() !== '';
  const filled = () => D.lines.filter(l => isSet(l) && prodById(l.id));
  const head = () => {
    const n = filled().length;
    $('#sc-head', el).textContent = t('sc.counted', { n, total: ALL.length });
    $('#sc-done', el).textContent = t('sc.done_chip', { n });
    $('span', send).textContent = t('sc.send', { n }); send.disabled = !n;
  };
  const view = () => {
    const qv = q.value.trim(); let list = qv ? filterProducts(qv) : ALL;
    if (V.mode === 'done') list = list.filter(p => isSet(lineOf(p.id)));
    else if (V.mode === 'cat') list = V.cat ? list.filter(p => String(p.category || '').trim() === V.cat) : [];
    return list;
  };
  const rowHTML = p => { const l = lineOf(p.id), v = l ? String(l.c || '') : '';
    return `<div class="sc-row ${isSet(l) ? 'done' : ''}" data-line="${esc(p.id)}" role="row"><div class="grow" role="cell"><div class="t">${esc(p.name)}</div><div class="s">${esc([p.sku, p.unit, p.category].filter(Boolean).join(' · '))}</div></div>
      <input class="input num" role="cell" style="width:96px;font-weight:800;font-size:18px;text-align:center" data-rule="num" data-sc="${esc(p.id)}" type="text" inputmode="${isWeightUnit(p.unit) ? 'decimal' : 'numeric'}" autocomplete="off" enterkeyhint="next" value="${esc(v)}" aria-label="${esc(t('sc.qty'))} ${esc(p.name)}"></div>`; };
  const draw = () => {
    const list = view(), left = list.length - V.limit;
    box.innerHTML = list.slice(0, V.limit).map(rowHTML).join('') || `<div class="empty" id="sc-empty">${esc(t(V.mode === 'cat' && !V.cat ? 'sc.pick_cat' : V.mode === 'done' && !q.value.trim() ? 'sc.empty' : 'sc.nomatch'))}</div>`;
    more.hidden = left <= 0; if (left > 0) more.textContent = t('sc.more', { n: Math.min(SC_PAGE, left), left });
    head();
  };
  const focusRow = p => {
    if (V.mode === 'cat' && String(p.category || '').trim() !== V.cat || V.mode === 'done' && !isSet(lineOf(p.id))) setMode('all');
    let inp = $(`[data-sc="${p.id}"]`, box);
    if (!inp) { q.value = p.sku || p.name; V.limit = SC_PAGE; draw(); inp = $(`[data-sc="${p.id}"]`, box); }
    err.textContent = '';
    if (inp) { inp.focus(); inp.select(); inp.scrollIntoView({ block: 'nearest' }); }
  };
  const setMode = m => {
    V.mode = m; V.limit = SC_PAGE;
    $$('[data-sc-mode]', el).forEach(b => { const on = b.dataset.scMode === m; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    $('#sc-cats', el).hidden = m !== 'cat';
    draw();
  };
  const setCat = k => { V.cat = k; $$('[data-sc-cat]', el).forEach(b => b.classList.toggle('on', b.dataset.scCat === k)); setMode('cat'); };
  $$('[data-sc-mode]', el).forEach(b => { b.onclick = () => setMode(b.dataset.scMode); });
  $('#sc-cats', el).onclick = e => { const b = e.target.closest('[data-sc-cat]'); if (b) setCat(b.dataset.scCat); };
  more.onclick = () => { V.limit += SC_PAGE; draw(); };
  q.addEventListener('input', () => { V.limit = SC_PAGE; draw(); });
  q.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = q.value.trim(); if (!v) return;
    const p = findBySku(v) || (filterProducts(v).length === 1 ? filterProducts(v)[0] : null);
    if (p) focusRow(p);
    else if (/^\d{6,}$/.test(v)) { beep(); toast(t('sell.barcode_nf', { code: v }), 'err'); q.select(); }
    else { const f = $('[data-sc]', box); if (f) { f.focus(); f.select(); } }
  });
  const cam = $('#sc-cam', el); if (cam) cam.onclick = () => cameraScan(code => { const p = findBySku(code); if (p) { q.value = p.sku || code; V.limit = SC_PAGE; draw(); focusRow(p); } else toast(t('sell.barcode_nf', { code }), 'err'); });
  box.addEventListener('input', e => {
    const i = e.target.closest('[data-sc]'); if (!i) return;
    const p = prodById(i.dataset.sc); if (!p) return;
    const l = lineOf(p.id), v = i.value;
    if (String(v).trim() === '') D.lines = D.lines.filter(x => x !== l);
    else if (l) l.c = v; else D.lines.unshift({ id: p.id, c: v });
    i.closest('[data-line]').classList.toggle('done', String(v).trim() !== '');
    scSave(D); head();
  });
  box.addEventListener('keydown', e => { const i = e.target.closest('[data-sc]'); if (!i || e.key !== 'Enter') return; e.preventDefault(); const all = $$('[data-sc]', box); const nx = all[all.indexOf(i) + 1]; if (nx) { nx.focus(); nx.select(); } else { q.focus(); q.select(); } });
  $('#sc-note', el).oninput = e => { D.note = e.target.value; scSave(D); };
  send.onclick = async () => {
    const lines = filled();
    if (!lines.length) { err.textContent = t('sc.none'); return; }
    const bad = lines.find(l => { const v = qtyVal(l.c); return !/\d/.test(String(l.c)) || !Number.isFinite(v) || v < 0; });
    if (bad) { focusRow(prodById(bad.id)); err.textContent = t('sc.bad', { name: prodById(bad.id).name }); return; }
    const ok = await confirmBox(t(scK('sc.confirm'), { n: lines.length }), { ok: t('sc.send_ok') });
    if (!ok.ok) return;
    send.disabled = true; err.textContent = '';
    const res = { ids: [], merged: true, applied: false, n: 0 };
    try {
      for (let i = 0; i < lines.length; i += SC_MAX) { // one table for a whole store; a bigger store goes in parts of 2000
        const part = lines.slice(i, i + SC_MAX);
        const r = await api('stock_count', { counts: part.map(l => ({ product_id: prodById(l.id).id, counted: qtyVal(l.c) })), note: i ? '' : String(D.note || '').trim() });
        const id = r.request_id || (r.approval || {}).request_id || '';
        const sent = new Set(part.map(l => String(l.id)));
        D.lines = D.lines.filter(l => !sent.has(String(l.id))); if (!D.lines.length) D.note = '';
        scSave(D); res.n += part.length;
        if (id && !res.ids.includes(id)) res.ids.push(id);
        if (!r.merged) res.merged = false;
        if (r.applied) { res.applied = true; (r.stock || []).forEach(s => { const p = prodById(s.product_id); if (p) p.stock = roundQty(num(s.stock) - pendingQty(p.id)); }); saveCache(); }
        else trackMyRequest(id, 'opname', t('req.opname', { n: (r.lines || part).length }));
      }
    } catch (e) {
      send.disabled = false;
      err.textContent = (e instanceof NetError ? t('sc.offline') : errMsg(e)) + (res.n ? ' — ' + t('sc.part_sent', { n: res.n }) : '');
      if (!res.n) return;
    }
    // only the outcome is shown — never the system stock / differences in the answer
    const msg = t(res.applied ? scK('sc.applied') : res.merged ? 'sc.sent_merged' : 'sc.sent');
    $('#sc-res', el).innerHTML = `<div class="status ${res.applied ? 'cocok' : 'need'}" id="sc-sent"><div class="st">${ic('check')} ${esc(msg)}</div>${res.ids.length ? `<div>${esc(t('apr.request_id'))}: <b>${esc(res.ids.join(', '))}</b></div>` : ''}<div class="small">${esc(t('req.opname', { n: res.n }))}</div></div>`;
    $('#sc-note', el).value = D.note || '';
    draw();
    toast(msg, 'ok', 4000);
  };
  setMode('all');
  if (!navigator.onLine) err.textContent = t('sc.offline');
  setTimeout(() => { if (!isTouch()) q.focus(); }, 30);
}

/* ========== Boot ========== */
/* ========== Trial links (?demo=1 / ?mock=1) can be closed by the owner ==========
   khair-pos/demo.json {"open": false} (or deleting the file) closes every trial link and wipes the trial data
   on the phone; {"open": true, "until": "<ISO time>"} closes them by themselves at that time (server clock from
   the Date header, the phone's clock as fallback; remembered for offline use). Real mode is never affected; a
   local test server is never closed. */
async function demoStillOpen() {
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return true;
  try {
    const r = await fetch('../demo.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) return false;
    if (!r.ok) return true;
    const j = await r.json();
    try { localStorage.setItem('kdemo.until', j.until ? String(j.until) : ''); } catch (e) { }
    const now = Date.parse(r.headers.get('date') || '') || Date.now();
    return j.open === true && !(j.until && now > Date.parse(j.until));
  } catch (e) { // offline: only the last known expiry can be checked
    let u = ''; try { u = localStorage.getItem('kdemo.until') || ''; } catch (e2) { }
    return !(u && Date.now() > Date.parse(u));
  }
}
function showDemoClosed() {
  try { Object.keys(localStorage).filter(k => k.indexOf('kpos.mock.') === 0 || k.indexOf('kmock.') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { }
  document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;background:#f4f6fb;color:#1b2440">'
    + '<div style="max-width:360px"><div style="font-size:44px">🔒</div><h2 style="margin:8px 0">Link uji coba sudah ditutup</h2>'
    + '<p style="margin:0 0 12px;color:#55607a">Terima kasih sudah mencoba Khair Mart. Hubungi pemilik toko untuk akses.</p>'
    + '<p dir="rtl" style="margin:0;color:#55607a">انتهت فترة التجربة وتم إغلاق هذا الرابط. شكرًا لكم.</p></div></div>';
}
async function init() {
  applyLangAttrs();
  if (MOCK && !(await demoStillOpen())) { showDemoClosed(); return; }
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href) && !/[?&]nosw\b/.test(location.search)) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
  }
  try { if (window.KUpdate) KUpdate.start({ version: APP_VERSION, idle: () => !$('#login').hidden }); } catch (e) { } // v49: a new version reaches every phone by itself
  if (MOCK) { try { await MockServer.ensure(); } catch (e) { console.error(e); } }
  try { await migrateSecrets(); } catch (e) { console.error(e); }
  const sess = KS.get('session'), live = SESS.get();
  if (DEMO) {
    if (!S.key) { S.key = 'demo'; store.set('key', 'demo'); }
    const want = new URLSearchParams(location.search).get('u');
    if (want && !(sess && sess.user && sess.user.toLowerCase() === want.toLowerCase())) { demoLogin(want); return; }
  }
  if (S.key && sess && sess.user && live && live.pin_hash && live.user === sess.user) { S.user = sess.user; S.role = sess.role; S.pin_hash = live.pin_hash; S.viaMaster = !!live.via; enterApp(false); return; }
  // locked session, or a kasir redirected here by the owner app (it remembers last_user) → PIN pad for that name
  const last = (sess && sess.user) || store.get('last_user', '');
  if (S.key) { if (last) { L.sel = last; showLogin('pin'); } else showLogin('users'); return; }
  showLogin('key');
}
window.KASIR = { S, MOCK, cartView, pinHash, syncOutbox, lineCalc, speakableName, I18N, DEV, devTick, devicePayload, deviceLabel, NoteMatch, ExpenseMatch, PU, mockLog: () => MockServer.log };
