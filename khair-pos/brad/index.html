  if (!key || !user || !pin) { toast(t('key') + ' / ' + t('user') + ' / ' + t('pin'), true); return; }
  S.key = key; S.user = user; S.pin_hash = await sha256(key + ':' + user.toLowerCase() + ':' + pin);
  try {
    const r = await api('login', {});
    S.user = r.me.name; S.role = r.me.role;
    LS.set('kbrad.key', key); LS.set('kbrad.user', S.user);
    SS.set('kbrad.session', { user: S.user, pin_hash: S.pin_hash, role: S.role });
    await load();
  } catch (e) { S.pin_hash = ''; renderLogin(e.message || e.error); }
}

// a photo for the order reader — at most 1600 px on its long side, JPEG 80 % (a phone photo of a sheet ≈ 200–400 KB). Read
// through a data: URL (the page's CSP allows data: images, not blob:).
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(), bad = () => rej({ message: t('rd_bad_photo') });
    fr.onerror = bad;
    fr.onload = () => {
      const img = new Image();
      img.onerror = bad;
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res({ data: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

$('#lang').addEventListener('click', () => { S.lang = S.lang === 'ar' ? 'id' : 'ar'; LS.set('kbrad.lang', S.lang); if (S.D) render(); else { render(); renderLogin(); } });
$('#logout').addEventListener('click', logout);
$('#home').addEventListener('click', () => { location.href = '../' + location.search; });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
// the home page's warnings follow the clock: redrawn every minute while nothing is open (no server call)
// stage 2: the cold store answers by WhatsApp while the app is open — a light check every minute (only when on screen and nothing
// is open) reloads when something changed; the home page's warnings follow the clock too
let polling = false;
setInterval(async () => {
  if (!S.D || !$('#modal').hidden || document.visibilityState !== 'visible' || polling) return;
  polling = true;
  try { const r = await api('poll', {}); if (r.stamp && r.stamp !== S.D.stamp) await load(); else if (S.tab === 'today') render(); }
  catch (e) { } finally { polling = false; }
}, 60000);
(async function start() {
  render();
  try { if (window.KUpdate) KUpdate.start({ version: APP_VERSION, idle: () => !S.D }); } catch (e) { } // a new version reaches every phone by itself
  S.key = LS.get('kbrad.key', '') || LS.get(KP + 'key', '') || LS.get('kcold.key', '') || (MOCK ? 'demo' : '');
  // this tab's session: our own, or the owner app's (same site, same tab) — the PIN hash is never kept in localStorage
  const own = SS.get('kbrad.session'), pos = SS.get(KP + 'session');
  const sess = own && own.pin_hash ? own : pos && pos.pin_hash && ['owner', 'manager', 'akuntan'].includes(pos.role) ? pos : null;
  if (S.key && sess) {
    S.user = sess.user; S.pin_hash = sess.pin_hash;
    try { const r = await api('login', {}); S.user = r.me.name; S.role = r.me.role; SS.set('kbrad.session', { user: S.user, pin_hash: S.pin_hash, role: S.role }); await load(); return; }
    catch (e) { S.pin_hash = ''; }
  }
  renderLogin();
})();
