async function checkMyRequests() {
  if (!S.inApp || !S.pin_hash || !ATT.myReq.length) return;
  let changed = false;
  for (const r of ATT.myReq.slice()) {
    try {
      const a = (await api('check_approval', { request_id: r.id })).approval || {};
      if (['approved', 'rejected', 'used', 'auto'].includes(a.status)) {
        ATT.myReq = ATT.myReq.filter(x => x.id !== r.id);
        ATT.notifs.unshift({ id: r.id, at: Date.now(), read: false, ok: a.status !== 'rejected', text: t(a.status === 'rejected' ? 'notif.rejected' : 'notif.approved', { label: r.label, name: a.decided_by || '' }) + (a.note ? ` — “${a.note}”` : '') });
        changed = true;
      }
    } catch (e) { if (e instanceof NetError) break; if (e.code === 'NOT_FOUND') { ATT.myReq = ATT.myReq.filter(x => x.id !== r.id); changed = true; } }
  }

function computeAttention(d) {
  const items = [], T = today();
  if (isApprover() && AP.count) items.push({ key: 'apr', level: 'warn', icon: 'check', text: t('att.approvals', { n: AP.count }), go: 'approvals' });
  if (d) {
    const miss = d.sales.filter(s => s.exit_photo === 'required' && s.status !== 'void' && (isApprover() || s.cashier === S.user));
    if (miss.length) items.push({ key: 'exit', level: 'err', icon: 'camera', text: t('att.exit', { n: miss.length }), go: 'history' });
    if (isApprover()) {
      const diff = (d.shifts || []).filter(x => x.status === 'closed' && int(x.difference) !== 0 && daysBetween(x.shift_date, T) <= 7);
      if (diff.length) items.push({ key: 'diff', level: 'err', icon: 'cash', text: t('att.diff', { n: diff.length, amount: fmtRp(sum(diff, x => int(x.difference))) }), go: 'kas' });
    }
  }
  const stale = isApprover() ? (S.openShifts || []).filter(x => x.shift_date < T) : (S.shift && S.shift.shift_date < T ? [S.shift] : []);
  stale.forEach(x => items.push({ key: 'stale-' + x.shift_id, level: 'err', icon: 'cash', text: t('att.stale', { name: x.cashier, date: fmtDate(x.shift_date) }), go: 'kas' }));
  const neg = S.products.filter(p => p.active !== false && num(p.stock) < 0), low = S.products.filter(p => p.active !== false && num(p.stock) >= 0 && isLow(p));
  if (neg.length) items.push({ key: 'neg', level: 'err', icon: 'box', text: t('att.neg', { n: neg.length }), go: 'products', low: true });
  if (low.length) items.push({ key: 'low', level: 'warn', icon: 'box', text: t('att.low', { n: low.length }), go: 'products', low: true });
  return items;
}

function hourlySVG(hours) {

  const maxO = Math.max(1, ...hours.map(x => x.omzet)), maxN = Math.max(1, ...hours.map(x => x.n));
  const cw = (W - pl - pr) / hours.length, bw = Math.min(26, cw * 0.6);
  const y = v => pt + (H - pt - pb) * (1 - v / maxO), yn = v => pt + (H - pt - pb) * (1 - v / maxN);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('home.hourly'))}">`;
  [0, .5, 1].forEach(f => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(maxO * f)}" y2="${y(maxO * f)}" class="c-grid"/><text x="${pl - 6}" y="${y(maxO * f) + 4}" text-anchor="end" font-size="11" class="c-txt">${esc(fmtShort(Math.round(maxO * f)))}</text><text x="${W - pr + 6}" y="${yn(maxN * f) + 4}" font-size="11" class="c-txt2">${Math.round(maxN * f)}</text>`; });
  const pts = [];
  hours.forEach((x, i) => {
    const cx = pl + cw * i + cw / 2;
    s += `<rect x="${cx - bw / 2}" y="${y(x.omzet)}" width="${bw}" height="${Math.max(0, y(0) - y(x.omzet))}" rx="2" class="c-omzet" data-h="${x.h}"><title>${String(x.h).padStart(2, '0')}:00 · ${esc(fmtRp(x.omzet))} · ${x.n} ${esc(t('home.tx'))}</title></rect>`;

    pts.push(`${cx},${yn(x.n)}`);
  });
  s += `<polyline points="${pts.join(' ')}" class="c-line" stroke-width="2.5"/>` + pts.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" class="c-dot"/>`).join('');
  return s + '</svg>';
}

const IMG = { mem: new Map(), db: null };
function imgDb() {

const b64Img = b => !b ? '' : 'data:' + (b.startsWith('PHN2Zy') || b.startsWith('PD94') ? 'image/svg+xml' : b.startsWith('iVBOR') ? 'image/png' : 'image/jpeg') + ';base64,' + b;

    if (!c || c.updated !== p.image_updated) { c = await imgGet(imgKey(p.id)); if (c) IMG.mem.set(imgKey(p.id), c); }
    if (!c || c.updated !== p.image_updated) missing.push(p.id);

}

/** list_field. Server limits: tracks only for ranges ≤ 7 days, photo_thumb only ≤ 31 days; noTracks for long ranges. */
async function loadField(from, to, user, useCache, noTracks) {
  const k = `${from}|${to}|${user || ''}|${noTracks ? 'nt' : ''}`;
  if (useCache && FD.cache[k] && Date.now() - FD.cache[k].at < 60000) return FD.cache[k].data;
  const r = await apiField('list_field', Object.assign({ from, to }, user ? { user } : {}, noTracks ? { include_tracks: false } : {}));
  const d = { tracks: r.tracks || [], visits: r.visits || [], shops: r.shops || [], orders: r.orders || [], days: r.days || [] };
  d.orders.forEach(o => { o.total = int(o.total); o.itemsList = parseItems(o.items); });
  d.visits.forEach(v => { v.distance_m = v.distance_m == null || v.distance_m === '' ? null : num(v.distance_m); });
  d.tracks.sort((a, b) => String(a.t).localeCompare(String(b.t)));
  FD.cache[k] = { at: Date.now(), data: d };
  return d;
}

function repDay(d, user, date) {
  const day = d.days.find(x => x.user === user && x.day_date === date);
  const pts = d.tracks.filter(x => x.user === user && x.track_date === date);
  const vis = d.visits.filter(x => x.user === user && x.visit_date === date);
  const ords = d.orders.filter(x => x.user === user && x.order_date === date);
  const lastT = [pts.length ? pts[pts.length - 1].t : '', vis.length ? vis.map(v => v.visit_time).sort().slice(-1)[0] : ''].filter(Boolean).sort().slice(-1)[0] || '';
  const status = !day || !day.started_at ? 'off' : day.ended_at ? 'ended' : 'working';
  return { user, day, pts, vis, ords, status, lastT, km: day ? num(day.km) : 0 };
}

/* ---- Map: Leaflet (cdnjs + OSM) with an SVG fallback ---- */
const LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
let leafletP = null;
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(true);
  if (leafletP) return leafletP;
  leafletP = new Promise(res => {
    let done = false; const fin = ok => { if (!done) { done = true; res(ok && !!(window.L && window.L.map)); } };
    try {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = LEAFLET + 'leaflet.min.css'; document.head.appendChild(css);
      const sc = document.createElement('script'); sc.src = LEAFLET + 'leaflet.min.js'; sc.onload = () => fin(true); sc.onerror = () => fin(false);
      document.head.appendChild(sc);
    } catch (e) { fin(false); }
    setTimeout(() => fin(false), 5000);
  });
  leafletP.then(ok => { if (!ok) leafletP = null; });
  return leafletP;
}
async function drawFieldMap(r, shops) {
  const el = $('#fd-map'); if (!el) return;
  const vis = r.vis.slice().sort((a, b) => String(a.visit_time).localeCompare(String(b.visit_time)));
  const pts = r.pts.filter(p => p.lat != null && p.lng != null);
  const shopIds = new Set(vis.map(v => v.shop_id));
  const sh = shops.filter(s => s.lat != null && (shopIds.has(s.shop_id) || !FD.user));
  if (!pts.length && !vis.length) { el.innerHTML = `<div class="empty">${esc(t('field.no_route'))}</div>`; el.dataset.mode = 'empty'; return; }
  const ok = navigator.onLine && await loadLeaflet();
  if (!$('#fd-map') || $('#fd-map') !== el) return;
  if (ok) {
    try {
      el.innerHTML = ''; el.dataset.mode = 'leaflet';
      const L = window.L, m = L.map(el, { zoomControl: true, attributionControl: true });
      FD.map = m;
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(m);
      const bounds = [];
      if (pts.length) { const ll = pts.map(p => [num(p.lat), num(p.lng)]); L.polyline(ll, { color: getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#1E40AF', weight: 4, opacity: .8 }).addTo(m); bounds.push(...ll); }
      sh.forEach(s => { L.circleMarker([num(s.lat), num(s.lng)], { radius: 5, color: '#526075', weight: 2, fillOpacity: .3 }).addTo(m).bindTooltip(s.name); bounds.push([num(s.lat), num(s.lng)]); });
      vis.forEach((v, i) => {
        const far = v.distance_m > FAR_M;
        L.marker([num(v.lat), num(v.lng)], { icon: L.divIcon({ className: '', html: `<span class="vnum map ${far ? 'far' : ''}">${i + 1}</span>`, iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(m).bindPopup(visitPopupHTML(v, i + 1));
        bounds.push([num(v.lat), num(v.lng)]);
      });
      if (bounds.length) m.fitBounds(bounds, { padding: [24, 24] });
      return;
    } catch (e) { if (FD.map) { try { FD.map.remove(); } catch (x) { } FD.map = null; } }
  }
  el.dataset.mode = 'svg';
  el.innerHTML = fieldSVG(pts, vis, sh, Math.max(320, Math.round(el.clientWidth || 800)));
  el.onclick = e => { const c = e.target.closest('[data-vi]'); if (!c) return; const i = +c.dataset.vi; $('#map-detail').innerHTML = visitPopupHTML(vis[i], i + 1); };
}
function fieldSVG(pts, vis, shops, Wpx) {
  const all = pts.concat(vis, shops).map(p => ({ lat: num(p.lat), lng: num(p.lng) })).filter(p => p.lat || p.lng);
  let minLa = Math.min(...all.map(p => p.lat)), maxLa = Math.max(...all.map(p => p.lat)), minLo = Math.min(...all.map(p => p.lng)), maxLo = Math.max(...all.map(p => p.lng));
  const k = Math.cos((minLa + maxLa) / 2 * Math.PI / 180);
  let w = (maxLo - minLo) * k || 0.002, h = (maxLa - minLa) || 0.002;
  const W = Wpx || 800, H = Math.round(W * (W < 560 ? 0.95 : 0.52)), pad = 30, sc = Math.min((W - 2 * pad) / w, (H - 2 * pad) / h);
  const ox = (W - w * sc) / 2, oy = (H - h * sc) / 2;
  const X = lo => ox + (lo - minLo) * k * sc, Y = la => oy + (maxLa - la) * sc;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('field.map'))}" class="fd-svg"><rect width="${W}" height="${H}" class="c-mapbg" rx="10"/>`;
  for (let i = 1; i < 6; i++) s += `<line x1="${W * i / 6}" x2="${W * i / 6}" y1="0" y2="${H}" class="c-grid"/><line y1="${H * i / 6}" y2="${H * i / 6}" x1="0" x2="${W}" class="c-grid"/>`;
  shops.forEach(p => { s += `<rect x="${X(num(p.lng)) - 5}" y="${Y(num(p.lat)) - 5}" width="10" height="10" rx="2" class="c-shop" data-shop="${esc(p.shop_id)}"><title>${esc(p.name)}</title></rect>`; });
  if (pts.length) s += `<polyline class="c-route" data-route points="${pts.map(p => `${X(num(p.lng)).toFixed(1)},${Y(num(p.lat)).toFixed(1)}`).join(' ')}"/>`;
  if (pts.length) { const a = pts[0], b = pts[pts.length - 1]; s += `<circle cx="${X(num(a.lng))}" cy="${Y(num(a.lat))}" r="6" class="c-start"><title>${esc(t('field.start'))} ${esc(jktTime(a.t))}</title></circle><circle cx="${X(num(b.lng))}" cy="${Y(num(b.lat))}" r="7" class="c-last"><title>${esc(t('field.last_loc'))} ${esc(jktTime(b.t))}</title></circle>`; }
  vis.forEach((v, i) => { const far = v.distance_m > FAR_M, x = X(num(v.lng)), y = Y(num(v.lat)); s += `<g data-vi="${i}" class="c-visit ${far ? 'far' : ''}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="13"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="13" font-weight="700">${i + 1}</text><title>${esc(`${i + 1}. ${v.shop_name} · ${t('out.' + v.outcome)} · ${jktTime(v.visit_time)}${v.distance_m != null ? ' · ' + v.distance_m + ' m' : ''}`)}</title></g>`; });
  return s + `</svg><div class="small muted">${esc(t('field.svg_note'))}</div>`;
}

async function processFieldOrder(o, sh) {
  let c = null;
  try { c = sh ? await linkShopToCustomer(sh) : shopCustomer({ name: o.shop_name }); }
  catch (e) { toast(errMsg(e), 'err'); return; }
  if (S.cart.lines.length) { const r = await confirmBox(t('void.replace_cart'), { danger: true }); if (!r.ok) return; }
  const cart = newCart();
  cart.customer_id = c ? c.id : null;
  cart.notes = t('fo.cart_note', { id: o.order_id, user: o.user });
  cart.field_order = { order_id: o.order_id, shop_name: o.shop_name };
  cart.channel = 'lainnya';
  for (const it of o.itemsList) {
    const p = prodById(it.product_id); if (!p) continue;
    const line = { product_id: p.id, name: p.name, qty: num(it.qty), override: null };
    const auto = lineCalc(line, c).auto;
    if (it.price_type && auto !== it.price_type) line.override = it.price_type;
    cart.lines.push(line);
  }
  if (!cart.lines.length) { toast(t('void.remake_fail'), 'err'); return; }
  S.cart = cart; saveCart();
  closeModal(true); go('pos');
  toast(t('fo.loaded', { id: o.order_id }), 'ok', 4000);
}
/** After a sale from a field order is saved: mark the order "diproses" with the invoice number (retried later if offline). */
async function markOrderProcessed(fo, invoice_no) {
  const q = store.get('order_updates', []).filter(x => x.order_id !== fo.order_id);
  q.push({ order_id: fo.order_id, invoice_no });
  store.set('order_updates', q);
  await flushOrderUpdates();
}
async function flushOrderUpdates() {
  let q = store.get('order_updates', []);
  for (const u of q.slice()) {
    try {
      await apiField('update_order', { order_id: u.order_id, status: 'diproses', invoice_no: u.invoice_no, note: t('fo.processed_note', { inv: u.invoice_no }) });
      q = q.filter(x => x.order_id !== u.order_id); store.set('order_updates', q);
      clearFieldCache(); toast(t('fo.updated', { id: u.order_id, st: t('ost.diproses') }), 'ok');
    } catch (e) { if (e instanceof NetError) break; q = q.filter(x => x.order_id !== u.order_id); store.set('order_updates', q); toast(errMsg(e), 'err'); }
  }
  if (isApprover()) loadOrders(false);
}

/* ---- Attention items from the field ---- */
function fieldAttention(d) {
  const items = [], T = today();
  if (!d) return items;
  const nNew = d.orders.filter(o => o.status === 'baru').length;
  if (nNew) items.push({ key: 'fo', level: 'warn', icon: 'clip', text: t('att.field_orders', { n: nNew }), go: 'orders' });
  const silent = [...new Set(d.days.filter(x => x.day_date === T && x.started_at && !x.ended_at).map(x => x.user))].map(u => repDay(d, u, T)).filter(r => !r.lastT || Date.now() - new Date(r.lastT).getTime() > 30 * 60000);
  silent.forEach(r => items.push({ key: 'silent-' + r.user, level: 'err', icon: 'pin', text: t('att.rep_silent', { name: r.user, ago: r.lastT ? ago(r.lastT) : '—' }), go: 'field' }));
  const far = d.visits.filter(v => v.distance_m > FAR_M && daysBetween(v.visit_date, T) <= 7);
  if (far.length) items.push({ key: 'far', level: 'warn', icon: 'pin', text: t('att.far', { n: far.length }), go: 'field' });
  const latest = {};
  d.visits.forEach(v => { if (!latest[v.shop_id] || String(v.visit_time) > String(latest[v.shop_id].visit_time)) latest[v.shop_id] = v; });
  const due = new Map();
  Object.values(latest).forEach(v => { if (v.next_visit && v.next_visit < T) due.set(v.shop_id, v.next_visit); });
  d.shops.forEach(sh => { const lv = latest[sh.shop_id]; if (sh.next_visit && sh.next_visit < T && !(lv && lv.visit_date >= sh.next_visit)) due.set(sh.shop_id, sh.next_visit); });
  const overdue = [...due.keys()];
  if (overdue.length) items.push({ key: 'nextvisit', level: 'warn', icon: 'pin', text: t('att.next_visit', { n: overdue.length }), go: 'field' });
  return items;
}

/* ========== CSV import (majoo etc.) ========== */
const IMPORT_FIELDS = [
  ['name', ['name', 'nama', 'nama produk', 'produk', 'nama barang', 'nama item', 'product', 'product name', 'item name']],
  ['sku', ['sku', 'barcode', 'kode', 'kode produk', 'sku produk', 'kode barang', 'code', 'product code']],
  ['category', ['category', 'kategori', 'kategori produk', 'jenis']],
  ['unit', ['unit', 'satuan', 'uom']],
  ['cost_price', ['cost_price', 'harga modal', 'hpp', 'harga beli', 'cost', 'harga pokok', 'modal']],
  ['retail_price', ['retail_price', 'harga jual', 'harga eceran', 'harga', 'price', 'harga satuan', 'selling price']],
  ['wholesale_price', ['wholesale_price', 'harga grosir', 'grosir', 'wholesale']],
  ['wholesale_min_qty', ['wholesale_min_qty', 'min grosir', 'minimal grosir', 'min qty grosir', 'minimum grosir']],
  ['stock', ['stock', 'stok', 'qty', 'jumlah', 'stok akhir', 'quantity']],
  ['min_stock', ['min_stock', 'stok minimum', 'stok minimal', 'minimum stok', 'min stok']]
];
function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/).find(l => l.trim()) || '';
  const count = ch => { let n = 0, q = false; for (const c of firstLine) { if (c === '"') q = !q; else if (c === ch && !q) n++; } return n; };
  const sep = count(';') > count(',') ? ';' : (count('\t') > count(',') ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return { sep, rows: rows.filter(r => r.some(x => String(x).trim() !== '')) };
}
function guessMapping(headers) {
  const h = headers.map(x => norm(x).replace(/[_*:()]/g, ' ').replace(/\s+/g, ' ').trim());
  const map = {}, used = new Set();
  for (const [field, syn] of IMPORT_FIELDS) {
    let idx = h.findIndex((x, i) => !used.has(i) && syn.includes(x));
    if (idx < 0) idx = h.findIndex((x, i) => !used.has(i) && syn.some(s => s.length > 3 && x.includes(s)));
    if (idx >= 0) { map[field] = idx; used.add(idx); }
  }
  return map;
}
function mapRow(r, map) {
  const o = {};
  for (const [field] of IMPORT_FIELDS) {
    if (map[field] == null || map[field] === '') continue;
    const raw = String(r[map[field]] ?? '').trim();
    if (raw === '') continue;
    if (['cost_price', 'retail_price', 'wholesale_price'].includes(field)) o[field] = Math.max(0, int(parseNum(raw)));
    else if (['stock', 'min_stock', 'wholesale_min_qty'].includes(field)) o[field] = roundQty(parseNum(raw));
    else o[field] = raw;
  }
  return o;
}

    $('#im-body', el).innerHTML = `<h3 style="margin:14px 0 8px;font-size:15px">${esc(t('imp.mapping'))}</h3>
      <div class="grid3">${IMPORT_FIELDS.map(([f]) => `<div class="field"><label class="f" for="im-m-${f}">${esc(t('fld.' + f))}</label><select class="input" id="im-m-${f}" data-map="${f}"><option value="">— ${esc(t('imp.skip'))} —</option>${IM.headers.map((h, i) => `<option value="${i}" ${IM.map[f] === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}</div>
      <h3 style="margin:6px 0 8px;font-size:15px">${esc(t('imp.preview'))} <span class="muted small">(${esc(t('imp.rows', { n: valid.length, total: IM.data.length }))})</span></h3>
      <div class="tbl-wrap" style="max-height:300px"><table class="tbl" id="im-prev"><thead><tr>${IMPORT_FIELDS.map(([f]) => `<th>${esc(t('fld.' + f))}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, 20).map(r => `<tr>${IMPORT_FIELDS.map(([f]) => `<td class="${['name', 'sku', 'category', 'unit'].includes(f) ? '' : 'r num'}">${esc(r[f] == null ? '' : (['cost_price', 'retail_price', 'wholesale_price'].includes(f) ? fmtRp(r[f]) : (typeof r[f] === 'number' ? fmtQty(r[f]) : r[f])))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    $$('[data-map]', el).forEach(s => s.onchange = () => { IM.map[s.dataset.map] = s.value === '' ? null : +s.value; draw(); });
    $('#im-go', el).disabled = !valid.length || IM.map.name == null && IM.map.sku == null;

    const { rows } = parseCSV(text);
    if (rows.length < 2) { $('#im-err', el).textContent = t('imp.empty'); return; }
    IM.headers = rows[0].map(h => String(h).trim()); IM.data = rows.slice(1); IM.map = guessMapping(IM.headers);
    draw();
  };
  $('#im-go', el).onclick = async () => {
    const rows = IM.data.map(r => mapRow(r, IM.map)).filter(r => r.name || r.sku);
    const btn = $('#im-go', el); btn.disabled = true;

    try {
      for (let i = 0; i < rows.length; i += 200) {

      await refreshData();
    } catch (e) {
      $('#im-err', el).textContent = `${errMsg(e)} — ${t('imp.partial', { done, total: rows.length })}`;
      btn.disabled = false; btn.textContent = t('imp.retry_rest');
      IM.data = IM.data.filter(r => { const m = mapRow(r, IM.map); return m.name || m.sku; }).slice(done);
    }
  };
}

async function loadSales(from, to, useCache) {
  const k = from + '|' + to;
  if (useCache && salesCache[k] && Date.now() - salesCache[k].at < 120000) return salesCache[k].data;
  const r = await api('get_sales', { from, to });
  const data = { sales: r.sales || [], items: r.items || [], payments: r.payments || [], purchases: r.purchases || [], expenses: r.expenses || [], shifts: r.shifts || [] };
  data.expenses.forEach(x => x.amount = int(x.amount));
  data.sales.forEach(s => { ['subtotal', 'discount', 'total', 'paid_amount', 'debt_amount'].forEach(f => s[f] = int(s[f])); if ('profit' in s) s.profit = int(s.profit); if ('total_cost' in s) s.total_cost = int(s.total_cost); });
  data.items.forEach(i => { i.qty = num(i.qty); i.unit_price = int(i.unit_price); i.line_total = int(i.line_total); if ('line_profit' in i) i.line_profit = int(i.line_profit); });
  data.payments.forEach(p => p.amount = int(p.amount));
  data.purchases.forEach(p => { p.qty = num(p.qty); p.total = int(p.total); });
  salesCache[k] = { at: Date.now(), data };
  return data;
}

function rcFromSale(sale, items) {

  return {
    invoice_no: sale.invoice_no, client_id: sale.client_id, pending: false, sale_date: sale.sale_date, sale_time: sale.sale_time, cashier: sale.cashier,
    customer_name: sale.customer_name || t('pos.walkin'), customer_phone: cust ? cust.phone : '', customer_id: sale.customer_id,
    lines: lines.length ? lines : (local ? local.lines : []), subtotal: int(sale.subtotal), discount: int(sale.discount), total: int(sale.total),

    approved_by: sale.approved_by || '', exit_required: !!sale.exit_photo, exit_photo: sale.exit_photo && sale.exit_photo !== 'required' ? sale.exit_photo : '', exit_match: sale.exit_match || (local && local.exit_match) || '', exit_result: local && local.exit_result
  };
}
const presetRange = p => {
  const T = today();
  switch (p) {
    case 'yesterday': return [addDays(T, -1), addDays(T, -1)];
    case '7d': return [addDays(T, -6), T];
    case 'month': return [monthStart(T), T];
    case 'lastmonth': { const s = monthStart(addDays(monthStart(T), -1)); return [s, monthEnd(s)]; }
    default: return [T, T];
  }
};

function parseAnyDate(v) {
  const s = String(v || '').trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/.exec(s); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return '';
}

async function scanPurchasePhoto(file) {
  PU.scanning = true; PU.scanErr = ''; PU.result = null;
  RENDER.purchases();
  try {
    const img = await imageToJpeg(file);
    PU.thumb = img.thumb; RENDER.purchases();
    const r = await apiPhoto('scan_purchase', { image_base64: img.base64, mime: img.mime });
    const ex = r.extracted || {}, items = Array.isArray(ex.items) ? ex.items : [];
    PU.photo_id = r.photo_id || '';
    PU.scan = { n: items.length, supplier: ex.supplier || '', invoice_no: ex.invoice_no || '', total: int(ex.total), drive_url: r.drive_url || '' };
    if (ex.supplier && !PU.supplier.trim()) PU.supplier = ex.supplier;
    const d = parseAnyDate(ex.date); if (d) PU.date = d;
    if (ex.invoice_no && !PU.note.trim()) PU.note = t('pu.note_invoice', { no: ex.invoice_no });
    const sugg = r.suggestions || [];
    PU.lines = PU.lines.filter(l => !l.ext).concat(items.map((it, index) => {
      const sg = sugg.filter(x => x.index === index).sort((a, b) => b.score - a.score)[0];
      const ok = sg && num(sg.score) >= 0.5 && prodById(sg.product_id);
      const qty = roundQty(num(it.qty) || 1);
      const cost = int(it.unit_price) || (it.total && qty ? Math.round(num(it.total) / qty) : 0);
      return { product_id: ok ? prodById(sg.product_id).id : null, name: it.name, qty, cost, ext: { name: it.name, unit: it.unit || '', score: sg ? num(sg.score) : null } };
    }));
  } catch (e) {
    PU.scanErr = (e instanceof NetError ? t('pu.scan_net') : errMsg(e)) + ' ' + t('pu.scan_retry');
  }
  PU.scanning = false; savePuDraft(); RENDER.purchases();
}
function puAdd(p) {
  const ex = PU.lines.find(l => l.product_id == p.id && !l.ext);
  if (ex) ex.qty = roundQty(num(ex.qty) + 1);
  else PU.lines.push({ product_id: p.id, name: p.name, qty: 1, cost: isOwner() ? int(p.cost_price) : 0 });
  PU.q = ''; PU.result = null; savePuDraft(); RENDER.purchases();
  const idx = PU.lines.findIndex(l => l.product_id == p.id && !l.ext);
  const inp = $$('[data-pu-qty]')[idx]; if (inp) { inp.focus(); inp.select(); }
}

async function savePurchase() {
  const err = $('#pu-err');
  const block = puBlockReason();
  if (block) { err.textContent = block; return; }
  const items = PU.lines.map(l => ({ product_id: l.product_id, qty: roundQty(l.qty), cost_price: int(l.cost) }));
  if (items.some(i => !(i.qty > 0))) { err.textContent = t('pu.bad_qty'); return; }
  if (items.some(i => !(i.cost_price > 0))) { const ok = await confirmBox(t('pu.zero_cost')); if (!ok.ok) return; }
  const btn = $('#pu-save'); btn.disabled = true; btn.textContent = t('saving');
  const before = new Map(PU.lines.map(l => { const p = prodById(l.product_id); return [l.product_id, p ? { stock: p.stock, cost: p.cost_price } : {}]; }));
  try {
    const data = { purchase_date: PU.date || today(), supplier: PU.supplier.trim(), note: PU.note.trim(), items };
    if (PU.photo_id) data.photo_id = PU.photo_id;
    const r = await api('save_purchase', data);
    applyStock(r.stock);
    const sups = store.get('suppliers', []); if (PU.supplier.trim() && !sups.includes(PU.supplier.trim())) { sups.unshift(PU.supplier.trim()); store.set('suppliers', sups.slice(0, 30)); }

/* ========== Reports (Laporan) ========== */
const RP = { preset: 'today', from: '', to: '', data: null, err: '', mode: 'period' };
const SOURCE_RULES = [
  ['tiktok', /tik\s*tok/],
  ['instagram', /instagram|\big\b|insta/],
  ['facebook', /facebook|\bfb\b/],
  ['google', /google|maps|gmaps/],
  ['friends', /teman|temen|keluarga|saudara|sodara|tetangga|kawan|rekomendasi|dikasih tahu|dikasih tau|kenalan/],
  ['passing', /lewat|kebetulan|depan toko|lihat toko|papan nama|spanduk/],
  ['regular', /langganan|pelanggan lama|sudah lama|dari dulu|sudah sering/]
];
const isSourceQuestion = q => /dari mana|tahu .*khair|tau .*khair|from where|من أين/i.test(String(q || ''));
function classifySource(a) { const s = norm(a); for (const [k, re] of SOURCE_RULES) if (re.test(s)) return k; return 'other'; }

function computeReport(d, from, to) {
  const ok = d.sales.filter(s => s.status !== 'void');
  const inv = new Set(ok.map(s => s.invoice_no));
  const items = d.items.filter(i => inv.has(i.invoice_no));
  const hasProfit = ok.length ? ok.every(s => s.profit != null) : isOwner();
  const omzet = sum(ok, s => int(s.total));
  const laba = sum(ok, s => int(s.profit));
  const count = ok.length;
  const split = { eceran: 0, grosir: 0 };
  items.forEach(i => { split[i.price_type === 'grosir' ? 'grosir' : 'eceran'] += int(i.line_total); });
  const methods = { tunai: 0, transfer: 0, qris: 0, hutang: 0 };
  ok.forEach(s => { methods[s.payment_method] = (methods[s.payment_method] || 0) + int(s.total); });
  const purchases = d.purchases.filter(p => !isAdjustRow(p));
  const agg = new Map();
  items.forEach(i => {
    const k = String(i.product_id);
    const a = agg.get(k) || { id: i.product_id, name: i.name, qty: 0, omzet: 0, laba: 0 };
    a.qty += num(i.qty); a.omzet += int(i.line_total); a.laba += int(i.line_profit); agg.set(k, a);
  });
  const prods = [...agg.values()].map(a => Object.assign(a, { qty: roundQty(a.qty), unit: (prodById(a.id) || {}).unit || '', margin: a.omzet ? a.laba / a.omzet * 100 : 0 }));
  const active = S.products.filter(p => p.active !== false);
  const slow = active.map(p => ({ id: p.id, name: p.name, unit: p.unit, stock: p.stock, qty: (agg.get(String(p.id)) || { qty: 0 }).qty })).sort((a, b) => a.qty - b.qty || a.name.localeCompare(b.name)).slice(0, 10);
  // series
  const single = from === to;
  let buckets = [];
  if (single) {
    const hours = ok.map(s => jktHour(s.sale_time));
    const lo = Math.min(8, ...hours), hi = Math.max(21, ...hours);
    for (let h = lo; h <= hi; h++) buckets.push({ key: h, label: String(h).padStart(2, '0'), omzet: 0, laba: 0 });
    ok.forEach(s => { const b = buckets.find(x => x.key === jktHour(s.sale_time)); if (b) { b.omzet += s.total; b.laba += int(s.profit); } });
  } else {
    const days = daysBetween(from, to) + 1;
    const byMonth = days > 62;
    if (byMonth) { let m = monthStart(from); while (m <= to) { buckets.push({ key: m.slice(0, 7), label: m.slice(5, 7) + '/' + m.slice(2, 4), omzet: 0, laba: 0 }); m = addDays(monthEnd(m), 1); } }
    else for (let i = 0; i < days; i++) { const dt = addDays(from, i); buckets.push({ key: dt, label: dt.slice(8, 10) + '/' + dt.slice(5, 7), omzet: 0, laba: 0 }); }
    const idx = new Map(buckets.map(b => [b.key, b]));
    ok.forEach(s => { const b = idx.get(byMonth ? String(s.sale_date).slice(0, 7) : s.sale_date); if (b) { b.omzet += s.total; b.laba += int(s.profit); } });
  }
  // survey
  const sources = {}; SOURCE_RULES.forEach(([k]) => sources[k] = 0); sources.other = 0;
  const answers = [];
  ok.slice().sort((a, b) => String(b.sale_time).localeCompare(String(a.sale_time))).forEach(s => {
    parseSurvey(s.survey).forEach(x => {
      if (!x || !String(x.a || '').trim()) return;
      if (isSourceQuestion(x.q)) sources[classifySource(x.a)]++;
      answers.push({ q: x.q, a: x.a, time: s.sale_time, date: s.sale_date, customer: s.customer_name });
    });
  });
  return {
    from, to, hasProfit, omzet, laba, margin: omzet ? laba / omzet * 100 : 0, count, avg: count ? Math.round(omzet / count) : 0,
    split, methods, newDebt: sum(ok, s => int(s.debt_amount)), paymentsIn: sum(d.payments, p => int(p.amount)),
    channels: (() => { const m = {}; ok.forEach(s => { const c = s.channel || 'toko'; m[c] = m[c] || { n: 0, omzet: 0 }; m[c].n++; m[c].omzet += int(s.total); }); return m; })(),
    promos: (() => { const m = {}; ok.filter(s => s.promo_code).forEach(s => { const c = s.promo_code; m[c] = m[c] || { code: c, n: 0, omzet: 0 }; m[c].n++; m[c].omzet += int(s.total); }); return Object.values(m).sort((a, b) => b.omzet - a.omzet); })(),
    expensesTotal: sum(d.expenses || [], x => int(x.amount)), net: laba - sum(d.expenses || [], x => int(x.amount)),
    purchasesTotal: sum(purchases, p => int(p.total)), purchasesCount: purchases.length, adjustCount: d.purchases.length - purchases.length,
    receivable: sum(S.customers, c => int(c.debt_balance)),
    topQty: prods.slice().sort((a, b) => b.qty - a.qty).slice(0, 10),
    topOmzet: prods.slice().sort((a, b) => b.omzet - a.omzet).slice(0, 10),
    topLaba: prods.slice().sort((a, b) => b.laba - a.laba).slice(0, 10),
    slow, lowStock: active.filter(isLow).sort((a, b) => a.stock - b.stock), buckets, single, sources, answers: answers.slice(0, 15),
    surveyCount: sum(Object.values(sources))
  };
}

function prodTable(rows, cols, id) {

function chartSVG(buckets, showLaba) {
  const W = 820, H = 250, padL = 58, padB = 28, padT = 12, padR = 8;
  const max = Math.max(1, ...buckets.map(b => Math.max(b.omzet, showLaba ? b.laba : 0)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const n = buckets.length, cw = (W - padL - padR) / Math.max(1, n), bw = Math.max(2, Math.min(28, cw * (showLaba ? 0.38 : 0.7)));
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  const ticks = [0, .25, .5, .75, 1].map(f => nice * f);
  const every = Math.ceil(n / 16);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('rep.chart'))}">`;
  ticks.forEach(tv => { s += `<line x1="${padL}" x2="${W - padR}" y1="${y(tv)}" y2="${y(tv)}" class="c-grid"/><text x="${padL - 6}" y="${y(tv) + 4}" text-anchor="end" font-size="11" class="c-txt">${esc(fmtShort(Math.round(tv)))}</text>`; });
  buckets.forEach((b, i) => {
    const x0 = padL + cw * i + cw / 2;
    const xo = showLaba ? x0 - bw - 1 : x0 - bw / 2;
    s += `<rect x="${xo}" y="${y(b.omzet)}" width="${bw}" height="${Math.max(0, y(0) - y(b.omzet))}" rx="2" class="c-omzet"><title>${esc(b.label)} · ${esc(t('rep.omzet'))} ${esc(fmtRp(b.omzet))}</title></rect>`;
    if (showLaba) s += `<rect x="${x0 + 1}" y="${y(Math.max(0, b.laba))}" width="${bw}" height="${Math.max(0, y(0) - y(Math.max(0, b.laba)))}" rx="2" class="c-laba"><title>${esc(b.label)} · ${esc(t('rep.profit'))} ${esc(fmtRp(b.laba))}</title></rect>`;
    if (i % every === 0) s += `<text x="${x0}" y="${H - 9}" text-anchor="middle" font-size="11" class="c-txt">${esc(b.label)}</text>`;
  });
  return s + '</svg>';
}

const tid = (k, v) => { const save = S.lang; S.lang = 'id'; try { return t(k, v); } finally { S.lang = save; } };
function reportText(R, kind) {
  const st = settings();
  const title = kind === 'month' ? tid('rep.txt_month') : tid('rep.txt_day');
  const period = R.from === R.to ? fmtDate(R.from) : `${fmtDate(R.from)} – ${fmtDate(R.to)}`;
  const out = [`*${title} ${st.store_name}*`, `${tid('rep.period')}: ${period}`, '',
    `${tid('rep.omzet')}: *${fmtRp(R.omzet)}*`];
  if (R.hasProfit) out.push(`${tid('rep.profit')}: *${fmtRp(R.laba)}*`, `${tid('rep.margin')}: ${fmtPct(R.margin)}`, `${tid('yr.expenses')}: ${fmtRp(R.expensesTotal)}`, `${tid('yr.net')}: *${fmtRp(R.net)}*`);
  out.push(`${tid('rep.tx_count')}: ${fmtNum(R.count)} (${tid('rep.avg').toLowerCase()} ${fmtRp(R.avg)})`,
    `${tid('eceran')}: ${fmtRp(R.split.eceran)} · ${tid('grosir')}: ${fmtRp(R.split.grosir)}`,
    `${['tunai', 'transfer', 'qris', 'hutang'].map(m => `${tid('pm.' + m)} ${fmtRp(R.methods[m] || 0)}`).join(' · ')}`, '',
    `*${tid('rep.top5')}:*`);
  R.topOmzet.slice(0, 5).forEach((p, i) => out.push(`${i + 1}. ${p.name} — ${fmtQty(p.qty)} ${p.unit} — ${fmtRp(p.omzet)}`));
  if (!R.topOmzet.length) out.push('-');
  out.push('', `${tid('rep.receivable')}: ${fmtRp(R.receivable)}`, `${tid('rep.new_debt')}: ${fmtRp(R.newDebt)} · ${tid('rep.payments_in')}: ${fmtRp(R.paymentsIn)}`,

  return out.join('\n');
}

async function saveSettings(partial, errEl) {
  try {
    const r = await api('save_settings', { settings: partial });
    S.settings = Object.assign({}, S.settings, r.settings || partial); saveCache();
    toast(t('saved'), 'ok'); renderShell(); return true;
  } catch (e) { if (errEl) errEl.textContent = errMsg(e); else toast(errMsg(e), 'err'); return false; }
}
async function saveUser(data, errEl) {
  try {
    const r = await api('save_user', data);
    upsertByName(S.users, r.user || data); saveCache();
    toast(t('saved'), 'ok'); RENDER.settings(); return true;
  } catch (e) { if (errEl) errEl.textContent = errMsg(e); else toast(errMsg(e), 'err'); return false; }
}
function upsertByName(arr, u) { const i = arr.findIndex(x => x.name.toLowerCase() === u.name.toLowerCase()); const clean = { name: u.name, role: u.role, active: u.active !== false }; if (i >= 0) arr[i] = clean; else arr.push(clean); }
function askNewPin(name) {
  return new Promise(resolve => {
    let done = false;
    const el = openModal({
      title: t('set.reset_pin') + ' — ' + name, cls: 'narrow',
      body: `<div class="field"><label class="f" for="rp-pin">${esc(t('pin'))}</label><input class="input" id="rp-pin" type="password" inputmode="numeric" maxlength="6" autofocus autocomplete="new-password"></div>
        <div class="field"><label class="f" for="rp-pin2">${esc(t('pin_again'))}</label><input class="input" id="rp-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div><div class="red" id="rp-err"></div>`,
      foot: `<button class="btn" data-act="modal-close">${esc(t('cancel'))}</button><button class="btn primary" id="rp-ok">${esc(t('save'))}</button>`,
      onClose: () => { if (!done) resolve(null); }
    });
    $('#rp-ok', el).onclick = () => {
      const a = $('#rp-pin', el).value, b = $('#rp-pin2', el).value;
      const err = pinError(a, b); if (err) { $('#rp-err', el).textContent = err; return; }
      done = true; closeModal(); resolve(a);
    };
  });
}
function pinError(a, b) { if (!/^\d{4,6}$/.test(a)) return t('login.pin_len'); if (a !== b) return t('pin_mismatch'); return ''; }

function renderLoginKeep() {
  const keep = {}; ['su-name', 'su-pin', 'su-pin2'].forEach(id => { const e = $('#' + id); if (e) keep[id] = e.value; });
  renderLogin();
  Object.entries(keep).forEach(([id, v]) => { const e = $('#' + id); if (e) e.value = v; });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(errMsg(err), 'err'); });
});
document.addEventListener('keydown', e => {
  if (!$('#login').hidden && L.step === 'pin' && !modalOpen()) {
    if (/^\d$/.test(e.key)) { if (L.pin.length < 6) { L.pin += e.key; L.err = ''; renderLogin(); } e.preventDefault(); return; }
    if (e.key === 'Backspace') { L.pin = L.pin.slice(0, -1); renderLogin(); e.preventDefault(); return; }
    if (e.key === 'Enter') { submitPin(); e.preventDefault(); return; }
  }
  if (e.key === 'Escape' && modalOpen()) { e.preventDefault(); closeModal(); return; }
  if (!S.inApp || $('#app').hidden || modalOpen()) return;
  if (S.view === 'pos') {
    if (e.key === 'F9') { e.preventDefault(); checkout(); return; }
    if (e.key === 'F2') { e.preventDefault(); const s = $('#pos-search'); if (s) s.focus(); return; }
    const a = document.activeElement;
    const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable);
    if (!typing && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { const s = $('#pos-search'); if (s) { s.focus(); } }
  }
});
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!isPhone()) closeCartSheet(); }, 150); });

/* ========== Boot ========== */
function applyTheme() {
  const th = store.get('theme', 'auto');
  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
}
/* ========== Trial links (?demo=1 / ?mock=1) can be closed by the owner ==========
   khair-pos/demo.json {"open": false} (or deleting the file) closes every trial link and wipes the trial data
   on the phone; {"open": true, "until": "<ISO time>"} closes them by themselves at that time (server clock from
   the Date header, the phone's clock as fallback; remembered for offline use). Real mode is never affected; a
   local test server is never closed. */
async function demoStillOpen() {
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return true;
  try {
    const r = await fetch('demo.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) return false;
    if (!r.ok) return true;
    const j = await r.json();
    try { localStorage.setItem('kdemo.until', j.until ? String(j.until) : ''); } catch (e) { }
    const now = Date.parse(r.headers.get('date') || '') || Date.now();
    return j.open === true && !(j.until && now > Date.parse(j.until));
  } catch (e) { // offline: only the last known expiry can be checked
    let u = ''; try { u = localStorage.getItem('kdemo.until') || ''; } catch (e2) { }
    return !(u && Date.now() > Date.parse(u));
  }
}
function showDemoClosed() {
  try { Object.keys(localStorage).filter(k => k.indexOf('kpos.mock.') === 0 || k.indexOf('kmock.') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { }
  document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;background:#f4f6fb;color:#1b2440">'
    + '<div style="max-width:360px"><div style="font-size:44px">🔒</div><h2 style="margin:8px 0">Link uji coba sudah ditutup</h2>'
    + '<p style="margin:0 0 12px;color:#55607a">Terima kasih sudah mencoba Khair Mart. Hubungi pemilik toko untuk akses.</p>'
    + '<p dir="rtl" style="margin:0;color:#55607a">انتهت فترة التجربة وتم إغلاق هذا الرابط. شكرًا لكم.</p></div></div>';
}
async function init() {
  applyTheme();
  applyLangAttrs();
  if (MOCK && !(await demoStillOpen())) { showDemoClosed(); return; }
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href) && !/[?&]nosw\b/.test(location.search)) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  if (MOCK) { try { await MockServer.ensure(); } catch (e) { console.error(e); } }
  const sess = store.get('session');
  if (DEMO) {
    if (!S.key) { S.key = 'demo'; store.set('key', 'demo'); }
    const want = new URLSearchParams(location.search).get('u');
    if (want && !(sess && sess.user && sess.user.toLowerCase() === want.toLowerCase())) { demoLogin(want); return; }
  }
  if (S.key && sess && sess.user && sess.pin_hash) {
    if (sess.role === 'kasir' || sess.role === 'sales') { showKasirRedirect(sess.user, sess.role); return; }
    S.user = sess.user; S.role = sess.role; S.pin_hash = sess.pin_hash; enterApp(false); return;
  }
  if (S.key) { if (sess && sess.user) { L.sel = sess.user; } showLogin('pin'); return; }
  showLogin('key');
}
window.KPOS = { S, MOCK, computeReport, parseCSV, guessMapping, parseNum, syncOutbox, cartView, pinHash, sha256Fallback, checkMyRequests, refreshAttention, brandOf };
init();
