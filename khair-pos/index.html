<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E40AF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khair POS">
<meta name="description" content="Kasir (POS) Khair Mart — grosir &amp; eceran">
<title>Khair Mart POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ========== Tokens ========== */
:root{
  /* brand: logo blue + red accent (sparingly) */
  --brand:#1E40AF; --brand-d:#1E3A8A; --brand-l:#DBEAFE; --brand-ll:#EFF6FF; --brand-text:#1E3A8A; --on-brand:#FFFFFF;
  --accent:#DC2626; --accent-l:#FEE2E2; --accent-text:#B91C1C;
  /* meaning only (never chrome) */
  --ok:#15803D; --ok-l:#DCFCE7; --danger:#B91C1C; --danger-l:#FEF2F2; --danger-b:#FCA5A5; --warn:#B45309; --warn-l:#FEF3C7; --warn-b:#FCD34D;
  /* surfaces */
  --bg:#F4F6FA; --card:#FFFFFF; --surface:#F8FAFC; --surface-2:#EEF2F7; --text:#0F172A; --muted:#526075; --border:#DCE3EC; --border-d:#C3CDDA;
  --toast:#0F172A; --backdrop:rgba(15,23,42,.5); --chart-grid:#E2E8F0; --focus:#1E3A8A; --login-a:#1E40AF; --login-b:#172554;
  --radius:12px; --radius-s:8px; --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.06);
  --shadow-l:0 10px 40px rgba(15,23,42,.24);
  --rail:88px; --top:56px; --tab:62px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic","Geeza Pro",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#2563EB; --brand-d:#1E3A8A; --brand-l:#1E2B4D; --brand-ll:#162038; --brand-text:#93C5FD;
  --accent:#EF4444; --accent-l:#3A1418; --accent-text:#FCA5A5;
  --ok:#4ADE80; --ok-l:#10291A; --danger:#F87171; --danger-l:#2A1215; --danger-b:#7F1D1D; --warn:#FBBF24; --warn-l:#2B2108; --warn-b:#78350F;
  --bg:#0B1220; --card:#111A2E; --surface:#0F172A; --surface-2:#1A2540; --text:#E5E9F2; --muted:#9AA8BF; --border:#24324D; --border-d:#334366;
  --toast:#1E293B; --backdrop:rgba(0,0,0,.6); --chart-grid:#24324D; --focus:#93C5FD; --login-a:#1E3A8A; --login-b:#0B1220;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-l:0 10px 40px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#2563EB; --brand-d:#1E3A8A; --brand-l:#1E2B4D; --brand-ll:#162038; --brand-text:#93C5FD;
  --accent:#EF4444; --accent-l:#3A1418; --accent-text:#FCA5A5;
  --ok:#4ADE80; --ok-l:#10291A; --danger:#F87171; --danger-l:#2A1215; --danger-b:#7F1D1D; --warn:#FBBF24; --warn-l:#2B2108; --warn-b:#78350F;
  --bg:#0B1220; --card:#111A2E; --surface:#0F172A; --surface-2:#1A2540; --text:#E5E9F2; --muted:#9AA8BF; --border:#24324D; --border-d:#334366;
  --toast:#1E293B; --backdrop:rgba(0,0,0,.6); --chart-grid:#24324D; --focus:#93C5FD; --login-a:#1E3A8A; --login-b:#0B1220;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-l:0 10px 40px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.topbar :focus-visible,#login :focus-visible{outline-color:#FCD34D}
a{color:var(--brand-text)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.red{color:var(--danger)}
.green{color:var(--ok)}
.right{text-align:end}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========== Controls ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-s);border:1px solid var(--border-d);background:var(--card);font-weight:600;line-height:1.1;text-decoration:none;color:var(--text);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--brand-ll)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger-b)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--brand-ll)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.xs{min-height:30px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:17px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--radius-s);border:1px solid var(--border-d);background:var(--card);padding:0;flex:none}
.icon-btn:hover{background:var(--brand-ll)}
.icon-btn.ghost{border-color:transparent;background:transparent}
.icon-btn.sm{width:36px;height:36px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg.i{width:19px;height:19px}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--border-d);border-radius:var(--radius-s);background:var(--card)}
textarea.input{min-height:70px;resize:vertical}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.input.num{text-align:end}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:1px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-d);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:var(--radius-s);border:1px solid var(--border-d);background:var(--card);font-weight:700;font-size:14px;padding:0 4px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg button.on.debt{background:var(--warn);border-color:var(--warn);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--brand-l);color:var(--brand-text);white-space:nowrap}
.badge.gold{background:var(--brand);color:#fff}
.badge.red{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.badge.green{background:var(--ok-l);color:var(--ok)}
.badge.accent{background:var(--accent);color:#fff}
.badge.amber{background:var(--warn-l);color:var(--warn)}
.badge.gray{background:var(--surface-2);color:var(--muted)}
.badge.blue{background:var(--brand-l);color:var(--brand-text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--border);margin:12px 0}

/* ========== App shell ========== */
#app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:var(--top) 1fr;height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;background:var(--brand);color:#fff;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.2px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.85}
.topbar .icon-btn,.topbar .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.topbar .icon-btn:hover,.topbar .btn:hover{background:rgba(255,255,255,.22)}
.topbar .btn{min-height:38px;padding:0 12px}
.outbox-badge{background:var(--warn-l)!important;color:var(--warn)!important;border:1px solid var(--warn-b)!important;font-weight:800}
.who{font-size:13px;text-align:end;line-height:1.15;opacity:.95}
.who b{display:block;font-size:14px}
.rail{background:var(--card);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 2px;text-align:center}
.nav-btn svg.i{width:24px;height:24px}
.nav-btn:hover{background:var(--brand-ll);color:var(--brand-text)}
.nav-btn.on{background:var(--brand-l);color:var(--brand-text)}
.nav-btn{position:relative}
.nav-btn .dot{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.nav-btn .l-short{display:none}
main{overflow:hidden;position:relative;min-width:0}
.view{height:100%;overflow-y:auto;padding:16px 20px 32px}
.view.pos-view{padding:0;overflow:hidden}
.view-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.view-head h1{font-size:21px;margin:0;flex:1;min-width:160px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;flex:1;min-width:180px}
.toolbar select.input{flex:0 1 auto;min-width:140px}

/* ========== Tables / lists ========== */
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:start;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--brand-ll)}
.tbl th.r,.tbl td.r{text-align:end}
.tbl tr.void td{color:var(--muted);text-decoration:line-through}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);min-height:60px;text-align:start;width:100%}
button.li:hover{border-color:var(--brand)}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted)}

/* ========== POS ========== */
.pos{display:grid;grid-template-columns:1fr minmax(360px,410px);height:100%}
.pos-left{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px 0}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-box{position:relative;flex:1}
.search-box svg.i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-inline-start:42px;min-height:50px;font-size:16px;border-width:2px}
.prod-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:10px;align-content:start;grid-auto-rows:max-content;padding:2px 2px 18px}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:start;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);min-height:120px;box-shadow:var(--shadow);position:relative}
.pcard:hover{border-color:var(--brand)}
.pcard:active{transform:scale(.98)}
.pcard .nm{font-weight:700;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pcard .sku{font-size:12px;color:var(--muted);gap:6px}
.pcard .sku .badge{font-size:11.5px;padding:1px 7px}
.pcard .pr{font-weight:800;font-size:16px;color:var(--brand-text);margin-top:auto}
.pcard .gr{font-size:12px;color:var(--brand-text);font-weight:600}
.pcard.low{border-color:var(--danger-b)}
.cart{display:flex;flex-direction:column;min-height:0;background:var(--card);border-inline-start:1px solid var(--border)}
.cart-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.cust-btn{flex:1;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border:1px dashed var(--border-d);border-radius:var(--radius-s);background:var(--brand-ll);text-align:start;min-width:0}
.cust-btn b{display:block;font-size:14.5px}
.cust-btn span{font-size:12.5px;color:var(--muted)}
.cart-lines{flex:1;overflow-y:auto;padding:6px 10px;min-height:80px;position:relative}
.cline{padding:10px 4px;border-bottom:1px solid var(--border)}
.cline:last-child{border-bottom:0}
.cline .top{display:flex;gap:8px;align-items:flex-start}
.cline .nm{flex:1;font-weight:700;font-size:14.5px;line-height:1.25}
.cline .lt{font-weight:800}
.cline .bot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1px solid var(--border-d);border-radius:var(--radius-s);overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--brand-text)}
.qty input{width:64px;height:40px;border:0;text-align:center;font-weight:700;font-size:15px;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.ptype{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border-d);background:var(--card);font-size:12.5px;font-weight:700;color:var(--muted)}
.ptype.grosir{background:var(--brand-l);border-color:var(--brand);color:var(--brand-text)}
.ptype.manual::after{content:" •";color:var(--accent)}
.cart-foot{border-top:1px solid var(--border);padding:10px 14px 14px;background:var(--surface)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.sumrow.total{font-size:22px;font-weight:800;color:var(--brand-text);padding:6px 0}
.sumrow .input{width:140px;min-height:38px;padding:6px 10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.quick .btn{flex:1 0 auto}
.paybox{margin-top:8px}
.paybox .result{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:6px 10px;border-radius:var(--radius-s);margin:6px 0;background:var(--brand-l);color:var(--brand-text)}
.paybox .result.debt{background:var(--warn-l);color:var(--warn)}
.paybox .result.err{background:var(--danger-l);color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.paybox .result.err::before{content:"⚠";margin-inline-end:6px}
.cart-bar{display:none}
.cart-close{display:none}
/* Hold sale ("Tahan") + quantity sheet */
.cats-row{display:flex;gap:8px;align-items:flex-start;min-width:0}
.cats-row .chips{flex:1;min-width:0}
.held-chip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--brand);background:var(--brand-l);color:var(--brand-text);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.held-chip svg.i{width:18px;height:18px}
.held-chip.old{border-color:var(--warn-b);background:var(--warn-l);color:var(--warn)}
.held{flex-wrap:wrap}
.held.old{border-color:var(--warn-b);background:var(--warn-l)}
.held .acts{display:flex;gap:8px;width:100%;justify-content:flex-end}
.hold-btn svg.i{width:19px;height:19px}
.qs-info{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.qs-info .pr{font-weight:800;font-size:18px;color:var(--brand-text)}
.qs-info .gr{font-size:13.5px;font-weight:700;color:var(--brand-text);background:var(--brand-l);border-radius:999px;padding:2px 10px}
.qs-row{display:grid;grid-template-columns:60px 1fr 60px;gap:10px}
.qs-row button{height:64px;border-radius:12px;border:1px solid var(--border-d);background:var(--surface-2);font-size:30px;font-weight:800;color:var(--brand-text)}
.qs-row input{height:64px;width:100%;min-width:0;border-radius:12px;border:2px solid var(--brand);background:var(--card);color:var(--text);text-align:center;font-size:34px;font-weight:800;-moz-appearance:textfield}
.qs-row input:focus{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.qs-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.qs-chips button{flex:1 0 48px;min-height:46px;border-radius:10px;border:1px solid var(--border-d);background:var(--card);font-weight:800;font-size:16px}
.qs-chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.qs-chips button.g{flex-basis:96px;border:2px dashed var(--brand);color:var(--brand-text)}
.qs-chips button.g.on{border-style:solid;color:#fff}
.qs-total{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--brand-ll);margin-top:8px}
.qs-total b{font-size:21px;color:var(--brand-text)}
.qs-warn{color:var(--danger);font-weight:700;font-size:13.5px;min-height:20px;margin-top:6px}
.qs-ok{flex:1}
.survey-tag{font-size:12px}

/* ========== Modal / toast ========== */
.modal-bg{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .12s}
.modal{background:var(--card);border-radius:16px;box-shadow:var(--shadow-l);width:100%;max-width:520px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:900px}
.modal.narrow{max-width:400px}
.modal-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h2{flex:1;margin:0;font-size:18px}
.modal-b{padding:16px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--toast);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-l);font-weight:600;font-size:14.5px;animation:fade .15s;text-align:center}
.toast.err{background:var(--card);color:var(--danger);border:2px solid var(--danger)}
.toast.err::before{content:"⚠ "}
.toast.ok{background:var(--brand-d)}
.toast.warn{background:var(--warn-l);color:var(--warn);border:2px solid var(--warn-b)}

/* ========== Login ========== */
#login{position:fixed;inset:0;background:linear-gradient(160deg,var(--login-a) 0%,var(--brand-d) 55%,var(--login-b) 100%);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.login-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow-l);width:100%;max-width:400px;padding:22px 20px;margin:auto}
.login-card .brand{color:var(--text);justify-content:center;margin-bottom:14px;font-size:20px}
.login-card h2{text-align:center;font-size:17px;margin:0 0 14px}
.users-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.users-pick button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border-d);background:var(--card);font-weight:700}
.users-pick button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:8px 0 16px;min-height:18px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand);display:block}
.pin-dots i.f{background:var(--brand)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:60px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:24px;font-weight:700}
.pinpad button:active{background:var(--brand-l)}
.pinpad button.ok{background:var(--brand);color:#fff;font-size:17px}
.login-err{color:var(--danger);text-align:center;font-weight:600;min-height:22px;margin:4px 0}
.login-links{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.lang-sw{display:flex;gap:6px;justify-content:center;margin-top:10px}

/* ========== Receipt ========== */
.receipt{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;font-size:13px;line-height:1.35;color:#000;background:#fff;margin:0 auto;padding:12px 10px;border:1px dashed var(--border-d);max-width:330px;direction:ltr;text-align:left}
.receipt.w58{max-width:260px}
.receipt .c{text-align:center}
.receipt .b{font-weight:700}
.receipt .big{font-size:16px;font-weight:800}
.receipt .ln{border-top:1px dashed #000;margin:6px 0}
.receipt .r2{display:flex;justify-content:space-between;gap:6px}
.receipt .it{margin:3px 0}
.receipt .stamp{border:2px solid #000;text-align:center;font-weight:800;padding:3px;margin:6px 0}
#print-area{display:none}

/* ========== Reports ========== */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{background:var(--brand);color:#fff;border-color:var(--brand)}
.kpi.hl .k,.kpi.hl .s{color:rgba(255,255,255,.85)}
.kpi.gold{border-top:3px solid var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel .pb{padding:12px 14px}
.panel .tbl th{position:static}
.bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.bar{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar i.g{background:var(--accent)}
.chart .pb svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:0 14px 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* ========== Survey ========== */
.sq{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:10px}
.sq .q{font-weight:700;margin-bottom:6px}
.sq .a{display:flex;gap:8px;align-items:flex-start}
.sq textarea{min-height:44px;flex:1}
.mic{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-d);background:var(--card);display:grid;place-items:center;flex:none;color:var(--brand-text)}
.mic.on{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse 1.2s infinite}
.interim{font-size:13px;color:var(--muted);font-style:italic;min-height:0;margin-top:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}70%{box-shadow:0 0 0 10px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.cam video{width:100%;border-radius:var(--radius-s);background:#000;max-height:60vh}

/* ========== Approvals & photos ========== */
.appr-badge{background:#FFFFFF!important;color:#1E3A8A!important;font-weight:800}
.appr-badge b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;padding:0 6px}
.apr-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.apr-sum div{background:var(--surface);border-radius:8px;padding:8px 10px}
.apr-sum .k{font-size:12px;color:var(--muted);font-weight:600}
.apr-sum .v{font-weight:800;font-size:16px}
.apr-card{margin-bottom:12px}
.apr-card.new{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.wait-box{text-align:center;padding:8px 0}
.wait-box .rid{font-size:26px;font-weight:900;letter-spacing:1px;color:var(--brand-text)}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--brand-l);border-top-color:var(--brand);animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.photo-step{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-inline-start:4px solid var(--accent)}
.photo-step.done{border-inline-start-color:var(--ok)}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none;border:1px solid var(--border)}
tr.unmatched td{background:var(--warn-l)}
.exit-box{border-radius:12px;padding:12px 14px;margin-bottom:12px;border:2px solid var(--warn-b);background:var(--warn-l)}
.exit-box.cocok{border-color:var(--ok);background:var(--ok-l)}
.exit-box.tidak_cocok{border-color:var(--danger);background:var(--danger-l)}
.exit-box.perlu_cek{border-color:var(--warn);background:var(--warn-l)}
.exit-box .st{font-size:18px;font-weight:900}
.exit-box.cocok .st{color:var(--ok)} .exit-box.tidak_cocok .st{color:var(--danger)} .exit-box.perlu_cek .st{color:var(--warn)}
.exit-box.tidak_cocok .st::before{content:"⚠ "}
.missing-list{border:2px solid var(--danger-b);background:var(--card)}
.missing-list h3{color:var(--danger);background:var(--danger-l)}

.bell{position:relative}
.bell b{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.li.att.err{border-color:var(--danger-b);background:var(--danger-l)}.li.att.err svg{color:var(--danger)}
.li.att.warn{border-color:var(--warn-b);background:var(--warn-l)}.li.att.warn svg{color:var(--warn)}
tr.diff td{background:var(--danger-l)}
.nav-btn{min-height:56px}

.mute-btn.on{background:var(--accent-l);color:var(--accent-text)}
.mute-chip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin:2px 0 6px}
.mute-chip.on{background:var(--accent-l);color:var(--accent-text);border-color:var(--accent)}

/* charts & receipt brand */
.c-omzet{fill:var(--brand)} .c-laba{fill:var(--accent)} .c-line{stroke:var(--accent);fill:none} .c-dot{fill:var(--accent)} .c-grid{stroke:var(--chart-grid)} .c-txt{fill:var(--muted)} .c-txt2{fill:var(--accent-text)}
.lg-omzet{background:var(--brand)} .lg-laba{background:var(--accent)}
.receipt .rc-name{color:#1E40AF;letter-spacing:.3px}
.receipt .rc-rule{height:3px;background:#DC2626;border-radius:2px;margin:4px auto 6px;width:40%}
.cart-bar .go{color:#1E3A8A}

.pthumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--border);display:inline-block}
.prod-photo{max-width:100%;max-height:260px;border-radius:12px;border:1px solid var(--border)}
.vthumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);cursor:zoom-in}
.vnum{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--brand);color:#fff;font-weight:800;font-size:13px;flex:none}

.vnum.map{box-shadow:0 0 0 2px #fff}
.fd-map{height:380px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.fd-map[data-mode="svg"]{height:auto;overflow:visible;background:none}
.fd-svg{width:100%;height:auto;display:block}
.c-mapbg{fill:var(--surface)} .c-route{fill:none;stroke:var(--brand);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.c-shop{fill:var(--card);stroke:var(--muted);stroke-width:2} .c-start{fill:var(--ok)} .c-last{fill:var(--brand);stroke:#fff;stroke-width:3}
.c-visit circle{fill:var(--brand);stroke:#fff;stroke-width:2} .c-visit text{fill:#fff} .c-visit.far circle{fill:var(--accent)}
.rep-card{border:1px solid var(--border);font:inherit;color:inherit} .rep-card.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.fo-banner{margin:8px 14px 0;padding:6px 10px;border-radius:8px;background:var(--brand-l);color:var(--brand-text);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.vpop{font:13px/1.4 var(--font)}

@media (min-width:760px) and (max-height:860px){

body.busy::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:300;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}

@media (max-width:759px){

  .rail{grid-row:3;flex-direction:row;border-inline-end:0;border-top:1px solid var(--border);padding:4px 2px calc(4px + env(safe-area-inset-bottom));gap:0;overflow:visible;box-shadow:0 -2px 10px rgba(0,0,0,.04)}

  .cart.open{transform:none}

  .cart-bar{display:flex;position:absolute;inset-inline:10px;bottom:10px;z-index:15;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--brand-d);color:#fff;box-shadow:var(--shadow-l);border:0;min-height:58px;text-align:start}

  .grid3{grid-template-columns:1fr 1fr}
  .hide-phone{display:none!important}

  .kpi{padding:10px 12px}

  .panel{min-width:0}
  .tbl th,.tbl td{padding:9px 8px}
  #toasts{bottom:calc(var(--tab) + 16px)}
}
@media (min-width:760px){ .show-phone{display:none!important} }

/* ========== Print ========== */
@media print{

  #print-area .report td.r{text-align:end}
}

<script>

/** Parse "Rp 12.500", "12.500", "12,500.50", "1,5" … to a number (Indonesian-aware). */

  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim().replace(/rp\.?/i, '').replace(/idr/i, '').replace(/[\s ]/g, '');

  const lastDot = s.lastIndexOf('.'), lastCom = s.lastIndexOf(',');
  if (lastDot >= 0 && lastCom >= 0) {
    const dec = lastDot > lastCom ? '.' : ',';
    const thou = dec === '.' ? ',' : '.';
    s = s.split(thou).join('').replace(dec, '.');
  } else if (lastCom >= 0) {
    const parts = s.split(',');
    s = (parts.length > 2 || (parts[1] && parts[1].length === 3)) ? parts.join('') : parts.join('.');

    s = (parts.length > 2 || (parts[1] && parts[1].length === 3)) ? parts.join('') : s;

}
/** Read a money input ("12.500" or "12500") as integer Rupiah. */
const moneyVal = v => Math.max(0, int(parseNum(v)));

/* ========== Dates (Asia/Jakarta) ========== */
const DTF_DATE = new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

function monthStart(ymd) { return ymd.slice(0, 8) + '01'; }
function monthEnd(ymd) { const [y, m] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); }

/* ========== Storage (always guarded) ========== */
const store = {
  get(k, def = null) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(PREFIX + k); } catch (e) { } }

/* ========== IDs & hashing ========== */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.random() * 256 | 0; }

}
/** Pure-JS SHA-256 fallback for non-secure contexts (e.g. http on a LAN IP). */

async function sha256Hex(str) {

      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { }
  return sha256Fallback(str);
}
const pinHash = (key, user, pin) => sha256Hex(`${key}:${String(user).toLowerCase()}:${pin}`);

/** Phone → wa.me number (62…). */
function waNumber(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('0')) d = '62' + d.slice(1);
  else if (d.startsWith('8')) d = '62' + d;
  return d.length >= 9 ? d : '';
}
function waLink(phone, text) { const n = waNumber(phone); return `https://wa.me/${n}?text=${encodeURIComponent(text)}`; }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';

/* ========== API client ========== */
class ApiError extends Error { constructor(code, message) { super(message || code); this.code = code || 'SERVER'; } }
class NetError extends Error { constructor(message) { super(message || 'NETWORK'); this.code = 'NETWORK'; } }
/** Only real network failures/timeouts queue a sale; an {ok:false} answer is shown, never queued. */
const isRetryable = e => e instanceof NetError;

let inflight = 0;
function setBusy(d) { inflight = Math.max(0, inflight + d); document.body.classList.toggle('busy', inflight > 0); }
async function apiRaw(action, data, cred, opts = {}) {
  setBusy(1);
  try { return await apiRawInner(action, data, cred, opts); } finally { setBusy(-1); }
}
async function apiRawInner(action, data, cred, opts) {
  const body = { action, key: cred.key };
  if (cred.user) body.user = cred.user;
  if (cred.pin_hash) body.pin_hash = cred.pin_hash;
  body.data = data || {};
  let res;
  if (MOCK) {
    res = await MockServer.request(clone(body), opts);
  } else {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), opts.timeout || 20000);
    let r, txt;
    try {
      r = await fetch(opts.field ? CONFIG.FIELD_URL : opts.photo ? CONFIG.PHOTO_URL : CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' });
      txt = await r.text();
    } catch (e) { throw new NetError(e && e.message); } finally { clearTimeout(timer); }
    try { res = JSON.parse(txt); } catch (e) {
      if (r.status >= 500 || r.status === 404 || r.status === 0) throw new NetError('HTTP ' + r.status);
      throw new ApiError('SERVER', 'HTTP ' + r.status);
    }
    if (Array.isArray(res)) res = res[0];
  }
  if (!res || res.ok !== true) throw new ApiError((res && res.error) || 'SERVER', res && res.message);
  return res;
}
/** Authenticated call with the current session; BAD_PIN / BAD_KEY send the user back to login. */
const sessCred = () => ({ key: S.key, user: S.user, pin_hash: S.pin_hash });
async function api(action, data, opts) {
  try {
    return await apiRaw(action, data, sessCred(), opts);
  } catch (e) {
    if (e.code === 'BAD_PIN' || e.code === 'BAD_KEY' || e.code === 'NO_USERS') { forceRelogin(e); }
    throw e;
  }
}
function errMsg(e) {
  if (!e) return t('err.SERVER');
  if (e instanceof NetError) return t('err.NETWORK');
  const k = 'err.' + e.code;
  const base = I18N.id[k] ? t(k) : t('err.SERVER');
  return e.message && e.message !== e.code && S.lang === 'id' ? `${base} (${e.message})` : base;
}

/* ========== Mock backend (?mock=1) — mirrors API.md ========== */
const MockServer = (() => {
  const DBKEY = 'kmock.db';
  const COST_KEYS = ['cost_price', 'total_cost', 'profit', 'line_profit', 'cost'];
  const CHANNELS = ['toko', 'whatsapp', 'shopee', 'tiktok', 'tokopedia', 'web', 'lainnya'];
  const READ_ONLY = ['users', 'login', 'bootstrap', 'get_sales', 'check_approval', 'list_approvals', 'list_photos', 'field_bootstrap', 'list_field', 'product_images'];
  class MockErr extends Error { constructor(code, message) { super(message || code); this.code = code; } }
  const E = (code, msg) => new MockErr(code, msg);
  let ready = null;

  function load() { try { return JSON.parse(localStorage.getItem(DBKEY) || 'null'); } catch (e) { return null; } }
  function save(db) { try { localStorage.setItem(DBKEY, JSON.stringify(db)); } catch (e) { throw E('SERVER', 'mock storage full'); } }

    if (!ready) ready = (async () => { if (!load()) save(await seed(new URLSearchParams(location.search).get('seed'))); })();
    return ready;
  }
  function stripPayload(str) {
    try { const pl = JSON.parse(str); if (pl && pl.changes && pl.changes.cost_price) { pl.changes.cost_price = { from: null, to: null }; } return JSON.stringify(pl); } catch (e) { return str; }
  }
  function strip(o) {
    if (o && typeof o === 'object' && !Array.isArray(o) && typeof o.payload === 'string' && o.kind === 'price') o = Object.assign({}, o, { payload: stripPayload(o.payload) });
    if (Array.isArray(o)) return o.map(strip);
    if (o && typeof o === 'object') { const r = {}; for (const k in o) if (!COST_KEYS.includes(k)) r[k] = strip(o[k]); return r; }
    return o;
  }
  const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
  const nextId = (db, k) => (db.seq[k] = (db.seq[k] || 0) + 1);
  function invoiceNo(db, ymd) {
    const n = db.sales.filter(s => s.sale_date === ymd).length + 1;
    return `KM${ymd.slice(2).replace(/-/g, '')}-${String(n).padStart(4, '0')}`;
  }
  function productFields(src, base) {
    const p = Object.assign({}, base);
    const str = k => { if (src[k] !== undefined) p[k] = String(src[k] == null ? '' : src[k]).trim(); };
    const money = k => { if (src[k] !== undefined && src[k] !== '') p[k] = Math.max(0, int(src[k])); };
    ['sku', 'name', 'category', 'unit', 'notes'].forEach(str);
    ['cost_price', 'retail_price', 'wholesale_price'].forEach(money);
    if (src.wholesale_min_qty !== undefined && src.wholesale_min_qty !== '') p.wholesale_min_qty = Math.max(0, roundQty(src.wholesale_min_qty));
    if (src.min_stock !== undefined && src.min_stock !== '') p.min_stock = Math.max(0, roundQty(src.min_stock));
    if (src.active !== undefined) p.active = !(src.active === false || src.active === 'false' || src.active === 0);
    return p;
  }
  function priceSale(db, data) {
    if (!Array.isArray(data.items) || !data.items.length) throw E('INVALID', 'items required');
    if (!['tunai', 'transfer', 'qris', 'hutang'].includes(data.payment_method)) throw E('INVALID', 'payment_method');
    const cust = data.customer_id ? db.customers.find(c => c.id === Number(data.customer_id)) : null;
    if (data.customer_id && !cust) throw E('NOT_FOUND', 'customer');
    const lines = data.items.map(it => {
      const p = db.products.find(x => x.id === Number(it.product_id));
      if (!p) throw E('NOT_FOUND', 'product ' + it.product_id);
      const qty = roundQty(it.qty);
      if (!(qty > 0)) throw E('INVALID', 'qty must be > 0');
      const unit_price = Math.max(0, int(it.unit_price));
      const line_total = Math.round(qty * unit_price), line_cost = Math.round(qty * p.cost_price);
      return { p, qty, unit_price, price_type: it.price_type === 'grosir' ? 'grosir' : 'eceran', line_total, line_cost };
    });
    const subtotal = sum(lines, l => l.line_total);
    const discount = Math.min(subtotal, Math.max(0, int(data.discount)));
    const total = subtotal - discount;
    const total_cost = sum(lines, l => l.line_cost);
    const paid = Math.max(0, int(data.paid_amount));
    const debt = Math.max(0, total - paid);
    if (debt > 0 && !cust) throw E('INVALID', 'Debt requires customer_id');

  if (d.settings && typeof d.settings === 'object') S.settings = d.settings;

  if (d.approvals_pending != null && typeof AP !== 'undefined') AP.count = int(d.approvals_pending);
  if ('shift' in d) { S.shift = d.shift || null; S.shiftsSupported = true; }
  if (Array.isArray(d.users) && S.inApp && S.user) { const me = d.users.find(u => u.name.toLowerCase() === S.user.toLowerCase()); if (me && (me.role === 'kasir' || me.role === 'sales') && S.role !== me.role) setTimeout(() => showKasirRedirect(S.user, me.role), 0); }
  if (Array.isArray(d.open_shifts)) S.openShifts = d.open_shifts;
  S.products.forEach(p => { p.id = isNaN(Number(p.id)) ? p.id : Number(p.id); ['retail_price', 'wholesale_price', 'cost_price'].forEach(k => { if (k in p) p[k] = int(p[k]); }); p.stock = num(p.stock); p.min_stock = num(p.min_stock); p.wholesale_min_qty = num(p.wholesale_min_qty); p.active = !(p.active === false || p.active === 'false' || p.active === 0 || p.active === '0'); });

function saveCache() {

}
/** Re-applies unsynced outbox sales to locally loaded stock / debts. */
function applyPendingToLocal() {
  for (const e of S.outbox) {
    for (const it of e.req.items) { const p = prodById(it.product_id); if (p) p.stock = roundQty(p.stock - it.qty); }
    const c = custById(e.req.customer_id); if (c && e.rc) c.debt_balance += int(e.rc.debt);
  }
}
const pendingQty = pid => sum(S.outbox.flatMap(e => e.req.items.filter(i => i.product_id == pid)), i => num(i.qty));
async function refreshData(quiet) {
  try {

/* ========== POS: cart model ========== */
function newCart() { return { client_id: uuid(), lines: [], customer_id: null, discount: 0, method: 'tunai', paid: '', survey: null, notes: '', channel: 'toko', promo: '' }; }
const cleanPromo = v => String(v || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 30);
function loadCart() { const c = store.get('cart'); return c && Array.isArray(c.lines) && c.client_id ? c : newCart(); }
const saveCart = () => store.set('cart', S.cart);
function lineCalc(line, cust) {
  const p = prodById(line.product_id) || { name: line.name || '?', retail_price: 0, wholesale_price: 0, wholesale_min_qty: 0, unit: '', stock: 0 };
  const wmin = num(p.wholesale_min_qty);
  const auto = (cust && cust.type === 'grosir') || (wmin > 0 && line.qty >= wmin) ? 'grosir' : 'eceran';
  let type = line.override || auto;
  if (type === 'grosir' && !(int(p.wholesale_price) > 0)) type = 'eceran';
  const unit_price = type === 'grosir' ? int(p.wholesale_price) : int(p.retail_price);
  return { p, type, auto, unit_price, total: Math.round(line.qty * unit_price), manual: !!line.override && line.override !== auto };
}
function cartView(c = S.cart) {
  const cust = custById(c.customer_id);
  const lines = c.lines.map(l => Object.assign({ line: l }, lineCalc(l, cust)));
  const subtotal = sum(lines, l => l.total);
  const discount = Math.min(subtotal, Math.max(0, int(c.discount)));
  const total = subtotal - discount;
  const typed = String(c.paid).trim() !== '';
  const paid = typed ? moneyVal(c.paid) : (c.method === 'hutang' ? 0 : total);
  const change = Math.max(0, paid - total), debt = Math.max(0, total - paid);
  const items = sum(c.lines, l => l.qty);
  let error = '';
  if (debt > 0 && !cust) error = c.method === 'hutang' ? t('pos.debt_needs_customer') : t('pos.partial_needs_customer');
  return { cust, lines, subtotal, discount, total, paid, typed, change, debt, items, error };
}
/** Adds qty of p (scan, tap with "ask quantity" off); with set=true the line gets exactly qty (quantity sheet). */
function addToCart(p, qty = 1, set = false) {
  if (!p) return;
  if (p.active === false) { toast(t('pos.inactive'), 'warn'); return; }
  const ex = S.cart.lines.find(l => l.product_id == p.id);
  if (ex) ex.qty = set ? roundQty(qty) : roundQty(ex.qty + qty); else S.cart.lines.push({ product_id: p.id, name: p.name, qty: roundQty(qty), override: null });
  saveCart(); renderCart(p.id);
  speakAdded(p, ex ? ex.qty : qty);
  const stockLeft = num(p.stock) - (ex ? ex.qty : qty);
  if (stockLeft < 0) toast(t('pos.stock_low', { name: p.name }), 'warn', 2000);
}
function findBySku(code) {
  const c = String(code || '').trim().toLowerCase();
  if (!c) return null;
  return S.products.find(p => p.active !== false && String(p.sku || '').trim().toLowerCase() === c) || null;
}
function filterProducts(q, cat, opts = {}) {
  const toks = norm(q).split(' ').filter(Boolean);
  let list = S.products.filter(p => (opts.includeInactive || p.active !== false) && (!cat || p.category === cat));
  if (toks.length) {
    list = list.filter(p => { const h = norm(`${p.name} ${p.sku} ${p.category}`); return toks.every(tk => h.includes(tk)); });
    const nq = norm(q);
    list.sort((a, b) => (norm(b.sku) === nq) - (norm(a.sku) === nq) || norm(b.name).startsWith(nq) - norm(a.name).startsWith(nq) || a.name.localeCompare(b.name));
  } else list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}
const categories = () => [...new Set(S.products.filter(p => p.category).map(p => p.category))].sort();
const isLow = p => num(p.stock) <= num(p.min_stock);

/* ========== Cashier voice: speak each item so the customer hears the count ==========
   Only product names and quantities are ever spoken — never prices, totals, discounts,
   customer names, debts or payment methods. */
const VOICE = { on: store.get('voice_on', true) !== false, lang: store.get('voice_lang', 'id-ID') === 'ar-SA' ? 'ar-SA' : 'id-ID', timer: null };
const UNIT_WORDS = { kg: 'kilo', kilo: 'kilo', gr: 'gram', g: 'gram', gram: 'gram', ml: 'mili', ltr: 'liter', lt: 'liter', l: 'liter', liter: 'liter' };
function speakableName(name) {
  let s = ' ' + String(name || '') + ' ';
  s = s.replace(/\[[^\]]*\]|\([^)]*\)|\{[^}]*\}/g, ' ');
  s = s.replace(/\b(?:sku|kode|code)\s*[:#]?\s*[\w-]+/gi, ' ');
  s = s.replace(/\b\d{6,}\b/g, ' ');
  s = s.replace(/\b[A-Z]{1,4}-?\d{3,}[\w-]*\b/g, ' ');
  s = s.replace(/(\d+(?:[.,]\d+)?)\s*(kg|kilo|gr|gram|g|ml|ltr|lt|liter|l)(?![a-z])/gi, (m, n, u) => `${n} ${UNIT_WORDS[u.toLowerCase()]}`);
  s = s.replace(/\b(pcs|pc)\b/gi, ' ');
  return s.replace(/\s+/g, ' ').trim();
}
const spokenQty = q => String(roundQty(q)).replace('.', VOICE.lang === 'ar-SA' ? '.' : ',');
function pickVoice(ss) {
  try { const vs = ss.getVoices() || []; if (!vs.length) return undefined; const pre = VOICE.lang.slice(0, 2); return vs.find(v => v.lang === VOICE.lang) || vs.find(v => String(v.lang).toLowerCase().startsWith(pre)) || null; } catch (e) { return undefined; }
}
function speak(text) {
  if (!VOICE.on || !text || (S.cart && S.cart.muted)) return;
  try {
    const ss = window.speechSynthesis, U = window.SpeechSynthesisUtterance;
    if (!ss || !U) return;
    const voice = pickVoice(ss);
    if (voice === null) return; // voices known but none for this language → stay silent
    ss.cancel();
    const u = new U(text); u.lang = VOICE.lang; u.rate = 1.1; if (voice) u.voice = voice;
    ss.speak(u);
  } catch (e) { }
}
function speakAdded(p, qty) { clearTimeout(VOICE.timer); speak(`${speakableName(p.name)}, ${spokenQty(qty)}`); }
/** Quantity changed (stepper or typed): say "jumlah N" 500 ms after the last change. */
function speakQtyLater(pid) {
  clearTimeout(VOICE.timer);
  VOICE.timer = setTimeout(() => { const l = S.cart.lines.find(x => x.product_id == pid); if (l) speak(`${VOICE.lang === 'ar-SA' ? 'الكمية' : 'jumlah'} ${spokenQty(l.qty)}`); }, 500);
}
function toggleSaleMute() {
  S.cart.muted = !S.cart.muted; saveCart();
  if (S.cart.muted) { clearTimeout(VOICE.timer); try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { } }
  const b = $('#cart-mute'); if (b) { b.classList.toggle('on', !!S.cart.muted); b.innerHTML = ic(S.cart.muted ? 'mute' : 'speaker'); b.setAttribute('aria-pressed', S.cart.muted ? 'true' : 'false'); b.title = t(S.cart.muted ? 'voice.unmute' : 'voice.mute'); }
  const m = !!S.cart.muted;
  document.querySelectorAll('.mute-chip').forEach(x => { x.classList.toggle('on', m); x.setAttribute('aria-pressed', m ? 'true' : 'false'); x.innerHTML = muteChipHtml(); });
}
/** Labelled "Suara / Senyap" button next to the payment, for the customer who prefers silence. */
function muteChipHtml() { const m = !!(S.cart && S.cart.muted); return `${ic(m ? 'mute' : 'speaker')} ${esc(t(m ? 'voice.silent' : 'voice.sound'))}`; }

/* ========== POS: quantity sheet — a tapped product asks "how many?" (barcode scans still add 1) ==========
   Per-device setting "ask_qty" (default on, shared with Khair Kasir on this device). */
const askQty = () => store.get('ask_qty', true) !== false;
const WEIGHT_UNITS = ['kg', 'kilo', 'g', 'gr', 'gram', 'ons', 'l', 'lt', 'ltr', 'liter', 'litre', 'ml'];
const isWeightUnit = u => WEIGHT_UNITS.includes(String(u || '').trim().toLowerCase());
const QTY_CHIPS = [1, 2, 3, 5, 10], QTY_MAX = 100000;
/** Product tap / single search result → quantity sheet, or straight +1 when the setting is off. */
function pickProduct(p) {
  if (!p) return;
  if (!askQty()) { addToCart(p); focusSearch(); return; }
  openQtySheet(p);
}
function openQtySheet(p) {
  if (p.active === false) { toast(t('pos.inactive'), 'warn'); return; }
  const ex = S.cart.lines.find(l => l.product_id == p.id);
  const wmin = num(p.wholesale_min_qty), hasW = int(p.wholesale_price) > 0 && wmin > 0;
  let q = ex ? roundQty(ex.qty) : 1;
  const el = openModal({
    title: p.name, cls: 'narrow qty-modal', id: 'qty-sheet',
    body: `<div class="qs-info"><span class="pr num"><bdi>${fmtRp(p.retail_price)}</bdi><span class="muted small">/${esc(p.unit || 'pcs')}</span></span>${hasW ? `<span class="gr" id="qs-gr">${esc(t('grosir'))} <bdi class="num">${fmtRp(p.wholesale_price)}</bdi> · <bdi>≥${fmtQty(wmin)}</bdi></span>` : ''}<span class="muted small">${esc(t('stock'))} <bdi class="num">${fmtQty(p.stock)} ${esc(p.unit || '')}</bdi></span></div>
      <div class="qs-row"><button type="button" id="qs-dec" aria-label="−">−</button><input id="qs-qty" type="text" inputmode="${isWeightUnit(p.unit) ? 'decimal' : 'numeric'}" autocomplete="off" enterkeyhint="done" aria-label="${esc(t('qty'))}" value="${esc(fmtQtyInput(q))}"><button type="button" id="qs-inc" aria-label="+">+</button></div>
      <div class="qs-chips" id="qs-chips">${QTY_CHIPS.map(n => `<button type="button" data-q="${n}">${n}</button>`).join('')}${hasW ? `<button type="button" class="g" data-q="${wmin}" id="qs-chip-g">${esc(t('grosir'))} ${esc(fmtQty(wmin))}</button>` : ''}</div>
      <div class="qs-total"><span><span class="ptype" id="qs-pt"></span> <span class="muted small num" id="qs-up"></span></span><b class="num" id="qs-total"></b></div>
      <div class="qs-warn" id="qs-warn" role="alert"></div>`,
    foot: `<button class="btn" data-act="modal-close">${esc(t('cancel'))}</button><button class="btn primary big qs-ok" id="qs-ok">${esc(ex ? t('qty.change') : t('qty.add'))}</button>`
  });
  const inp = $('#qs-qty', el);
  // same price rule as the cart line (grosir customer, wholesale_min_qty, the line's manual override)
  const draw = () => {
    const c = lineCalc({ product_id: p.id, qty: q, override: ex ? ex.override : null }, custById(S.cart.customer_id));
    const pt = $('#qs-pt', el); pt.className = 'ptype ' + c.type; pt.textContent = t(c.type);
    $('#qs-up', el).textContent = `${fmtQty(q)} × ${fmtRp(c.unit_price)}`;
    $('#qs-total', el).textContent = fmtRp(c.total);
    $$('#qs-chips [data-q]', el).forEach(b => b.classList.toggle('on', num(b.dataset.q) === q));
    $('#qs-warn', el).textContent = q > num(p.stock) ? t('pos.stock_low', { name: p.name }) : '';
    if (q >= QTY_MAX) $('#qs-warn', el).textContent = t('qty.too_big');
    $('#qs-ok', el).disabled = !(q > 0 && q < QTY_MAX);
  };
  const setQ = v => { q = Math.max(0, roundQty(v)); inp.value = fmtQtyInput(q); draw(); };
  inp.addEventListener('input', () => { q = qtyVal(inp.value); draw(); });
  inp.addEventListener('focus', () => inp.select());
  // a barcode scanner typing into the box (very fast keys + Enter) is a scan, not a quantity
  const keys = [];
  inp.addEventListener('keydown', e => { if (e.key.length === 1) keys.push(performance.now()); });
  const scanned = () => keys.length >= 4 && (keys[keys.length - 1] - keys[keys.length - 4]) / 3 < 50;
  $('#qs-dec', el).onclick = () => { if (q > 1) setQ(Math.ceil(q - 1e-9) - 1); };
  $('#qs-inc', el).onclick = () => setQ(Math.floor(q + 1e-9) + 1);
  $('#qs-chips', el).onclick = e => { const b = e.target.closest('[data-q]'); if (b) setQ(num(b.dataset.q)); };
  const ok = () => {
    q = qtyVal(inp.value);
    if (!(q > 0) || q >= QTY_MAX) { $('#qs-warn', el).textContent = t(q > 0 ? 'qty.too_big' : 'qty.invalid'); return; }
    closeModal();
    addToCart(p, q, true); // speaks name + quantity once
    focusSearch();
  };
  $('#qs-ok', el).onclick = ok;
  el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const b = e.target.closest && e.target.closest('button'); if (b && b.id !== 'qs-ok') return;
    e.preventDefault();
    if (e.target === inp && scanned()) { const code = inp.value; closeModal(); onSearchEnter(code, true); return; }
    ok();
  });
  draw();
}

const POS = { q: '', cat: '', limit: 60, keyTimes: [] };

    if (e.key === 'Escape') { inp.value = ''; POS.q = ''; renderGrid(); return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { POS.keyTimes.push(performance.now()); if (POS.keyTimes.length > 64) POS.keyTimes.shift(); }
    else if (e.key === 'Backspace') POS.keyTimes = [];

}
/** Barcode scanners type very fast (<50 ms per char). */
function isFastInput() {
  const k = POS.keyTimes; if (k.length < 4) return false;
  const span = k[k.length - 1] - k[0];
  return span / (k.length - 1) < 50;
}
function onSearchEnter(raw, fast) {

const fmtQtyInput = q => String(roundQty(q)).replace('.', ',');
const fmtShort = n => n >= 1000000 ? String(Math.round(n / 100000) / 10).replace('.', ',') + 'jt' : n >= 1000 ? Math.round(n / 1000) + 'rb' : String(n);
function quickAmounts(total) {
  if (total <= 0) return [];
  const set = new Set();
  for (const step of [5000, 10000, 20000, 50000, 100000]) { const v = Math.ceil(total / step) * step; if (v > total) set.add(v); }
  return [...set].sort((a, b) => a - b).slice(0, 4);
}
function refreshCartNumbers() {
  const v = cartView();
  v.lines.forEach((l, i) => {
    const row = $(`.cline[data-line="${i}"]`); if (!row) return;
    $('[data-ref="lt"]', row).textContent = fmtRp(l.total);
    $('[data-ref="up"]', row).textContent = '× ' + fmtRp(l.unit_price);
    const pt = $('[data-ref="pt"]', row); pt.className = `ptype ${l.type} ${l.manual ? 'manual' : ''}`; pt.textContent = t(l.type);
  });
  const set = (r, txt) => { const e = $(`#cart [data-ref="${r}"]`); if (e) e.textContent = txt; };
  set('sub', fmtRp(v.subtotal)); set('total', fmtRp(v.total)); set('items', `(${fmtQty(v.items)} ${t('items')})`);
  const res = $('#cart [data-ref="result"]');
  if (res) {
    res.className = 'result' + (v.error ? ' err' : v.debt > 0 ? ' debt' : '');
    res.innerHTML = v.error ? esc(v.error) : v.debt > 0 ? `<span>${esc(t('pos.debt_new'))}</span><span class="num">${fmtRp(v.debt)}</span>` : `<span>${esc(t('pos.change'))}</span><span class="num" id="cart-change">${fmtRp(v.change)}</span>`;
  }
  const btn = $('#btn-checkout'); if (btn) btn.disabled = !v.lines.length;
  const hb = $('#btn-hold'); if (hb) hb.hidden = !canHold();
  updateHeldChip();
  const ex = $('#cart-exit'); if (ex) ex.hidden = !v.lines.length || !localExitRequired(v);
  const bar = $('#cart-bar');
  if (bar) {
    bar.hidden = false;
    bar.innerHTML = `${ic('cart')}<div class="grow"><b class="num">${fmtRp(v.total)}</b><span>${esc(t('pos.lines', { n: v.lines.length }))}${v.cust ? ' · ' + esc(v.cust.name) : ''}</span></div><span class="go">${esc(t('pos.open_cart'))}</span>`;
  }
}
function bindCartInputs() {
  $$('#cart [data-qty]').forEach(inp => {
    inp.addEventListener('input', () => { const q = qtyVal(inp.value); if (q > 0) { const l = S.cart.lines[+inp.dataset.qty]; l.qty = q; saveCart(); refreshCartNumbers(); speakQtyLater(l.product_id); } });
    inp.addEventListener('change', () => {
      const i = +inp.dataset.qty, q = qtyVal(inp.value);
      if (!(q > 0)) { S.cart.lines.splice(i, 1); saveCart(); renderCart(); return; }
      S.cart.lines[i].qty = q; inp.value = fmtQtyInput(q); saveCart(); refreshCartNumbers(); // no full re-render: a click on "Bayar" right after typing must not be lost
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { inp.blur(); focusSearch(); } });
    inp.addEventListener('focus', () => inp.select());
  });
  const disc = $('#cart-disc');
  disc.addEventListener('input', () => { S.cart.discount = moneyVal(disc.value); saveCart(); refreshCartNumbers(); });
  disc.addEventListener('change', () => { disc.value = S.cart.discount ? fmtNum(S.cart.discount) : ''; });
  const promo = $('#cart-promo');
  if (promo) promo.addEventListener('input', () => { S.cart.promo = cleanPromo(promo.value); saveCart(); });
  const more = $('#cart-more'); if (more) more.addEventListener('toggle', () => { POS.moreOpen = more.open; });
  const paid = $('#cart-paid');
  paid.addEventListener('input', () => { S.cart.paid = paid.value.trim() === '' ? '' : String(moneyVal(paid.value)); saveCart(); refreshCartNumbers(); });
  paid.addEventListener('change', () => { paid.value = S.cart.paid === '' ? '' : fmtNum(moneyVal(S.cart.paid)); });
  paid.addEventListener('keydown', e => { if (e.key === 'Enter') ACT.checkout(); });
}
function openCartSheet() { const c = $('#cart'); if (c) c.classList.add('open'); }
function closeCartSheet() { const c = $('#cart'); if (c) c.classList.remove('open'); }

/* ========== POS: hold sale ("Tahan") — park the cart, serve the next customer, resume later ==========
   Held carts stay on this device under the store key (separate from Khair Kasir's). Only product ids,
   quantities and the cart settings are kept: a resumed cart is priced again from the current product data. */
const HOLD_MAX = 10, HOLD_OLD_MS = 12 * 3600000;
const heldKey = () => 'held.' + String(S.key || '');
function heldList() { const a = store.get(heldKey(), []); return Array.isArray(a) ? a.filter(h => h && h.id && h.cart && Array.isArray(h.cart.lines)) : []; }
const saveHeld = list => { store.set(heldKey(), list); updateHeldChip(); };
const isOldHeld = h => Date.now() - new Date(h.held_at).getTime() > HOLD_OLD_MS;
/** Not while saving or while a credit approval is pending for this cart. */
const holdBlocked = () => !!(S.cart && S.cart.remote) || !!$('#apr-step') || !!$('#apr-wait') || saving;
const canHold = () => !!(S.cart && S.cart.lines.length) && !holdBlocked();
function defaultHoldLabel(list, cart) {
  const cust = custById(cart.customer_id); if (cust) return cust.name;
  const used = new Set(list.map(h => h.label));
  let n = 1; while (used.has(t('hold.default', { n }))) n++;
  return t('hold.default', { n });
}
function heldAgo(iso) {
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  return m < 1 ? t('hold.just_now') : m < 60 ? t('hold.min_ago', { n: m }) : t('hold.hour_ago', { n: Math.floor(m / 60) });
}
/** A held cart priced with today's product data; lines whose product is gone or inactive are left out. */
function heldView(h) {
  const ok = h.cart.lines.filter(l => { const p = prodById(l.product_id); return p && p.active !== false; });
  return Object.assign(cartView(Object.assign({}, h.cart, { lines: ok, paid: '' })), { gone: h.cart.lines.length - ok.length });
}
/** Moves the current cart into the held list and starts an empty one. Returns the label ('' = refused). */
function holdCurrent(label) {
  const list = heldList();
  if (list.length >= HOLD_MAX) { toast(t('hold.full', { max: HOLD_MAX }), 'err', 4000); return ''; }
  const cart = Object.assign(clone(S.cart), { paid: '', remote: null });
  const lbl = String(label || '').trim().slice(0, 40) || defaultHoldLabel(list, cart);
  list.push({ id: uuid(), label: lbl, held_at: new Date().toISOString(), by: S.user, cart });
  saveHeld(list);
  clearTimeout(VOICE.timer);
  S.cart = newCart(); saveCart();
  return lbl;
}
function openHold() {
  if (!canHold()) { if (S.cart.lines.length) toast(t('hold.busy'), 'warn'); return; }
  const list = heldList();
  if (list.length >= HOLD_MAX) { toast(t('hold.full', { max: HOLD_MAX }), 'err', 4000); return; }
  const el = openModal({
    title: t('hold.title'), cls: 'narrow', id: 'hold-prompt',
    body: `<p style="margin-top:0">${esc(t('hold.hint'))}</p>
      <div class="field"><label class="f" for="hold-label">${esc(t('hold.label'))}</label><input class="input" id="hold-label" maxlength="40" autocomplete="off" placeholder="${esc(defaultHoldLabel(list, S.cart))}"></div>
      <p class="small muted" style="margin:-4px 0 0">${esc(t('hold.label_hint'))}</p>`,
    foot: `<button class="btn" data-act="modal-close">${esc(t('cancel'))}</button><button class="btn primary" id="hold-ok">${ic('pause')} ${esc(t('hold.btn'))}</button>`
  });
  const fin = () => {
    const lbl = holdCurrent($('#hold-label', el).value);
    if (!lbl) return;
    closeModal(); closeCartSheet(); renderCart(); focusSearch();
    toast(t('hold.held', { label: lbl }), 'ok');
  };
  $('#hold-ok', el).onclick = fin;
  $('#hold-label', el).addEventListener('keydown', e => { if (e.key === 'Enter') fin(); });
}
function updateHeldChip() {
  const b = $('#held-chip'); if (!b) return;
  const list = heldList();
  b.hidden = !list.length;
  b.classList.toggle('old', list.some(isOldHeld));
  b.innerHTML = `${ic('pause')}<span>${esc(t('hold.chip', { n: list.length }))}</span>`;
}
function openHeld() {
  const el = openModal({ title: t('hold.list'), id: 'held-list', body: '' });
  drawHeld(el);
}
function drawHeld(el) {
  const body = $('.modal-b', el); if (!body) return;
  const list = heldList();
  body.innerHTML = list.length ? `<div class="list" id="held-items">${list.map(h => {
    const v = heldView(h), old = isOldHeld(h);
    return `<div class="li held ${old ? 'old' : ''}" data-id="${esc(h.id)}">${ic('pause')}
      <div class="grow"><div class="t">${esc(h.label)} ${old ? `<span class="badge amber">${esc(t('hold.old'))}</span>` : ''}</div>
        <div class="s"><span data-ref="n">${esc(t('pos.lines', { n: v.lines.length }))}</span> · <span data-ref="ago">${esc(heldAgo(h.held_at))}</span> (${esc(jktTime(h.held_at))})${h.by ? ' · ' + esc(h.by) : ''}</div>
        ${v.gone ? `<div class="s red">${esc(t('hold.n_gone', { n: v.gone }))}</div>` : ''}</div>
      <b class="num" data-ref="total">${fmtRp(v.total)}</b>
      <div class="acts"><button class="btn sm danger" data-act="held-del" data-id="${esc(h.id)}">${ic('trash')} ${esc(t('delete'))}</button><button class="btn sm primary" data-act="held-resume" data-id="${esc(h.id)}">${esc(t('hold.resume'))}</button></div></div>`;
  }).join('')}</div>` : `<div class="empty">${esc(t('hold.empty'))}</div>`;
}
/** Resume a held cart. A non-empty current cart is held first (swap). Voice stays silent. */
function resumeHeld(id) {
  const list = heldList(), h = list.find(x => x.id === id);
  if (!h) { const m = $('#held-list'); if (m) drawHeld(m); return; }
  if (S.cart.lines.length && !canHold()) { toast(t('hold.busy'), 'warn'); return; }
  // the swap label is chosen before the resumed entry leaves the list ("Pelanggan 1" is not reused at once)
  const swapLabel = S.cart.lines.length ? defaultHoldLabel(list, S.cart) : '';
  saveHeld(list.filter(x => x.id !== id));
  const swapped = swapLabel ? holdCurrent(swapLabel) : '';
  const cart = Object.assign(newCart(), h.cart, { paid: '', remote: null });
  const gone = [];
  cart.lines = cart.lines.filter(l => { const p = prodById(l.product_id); if (!p || p.active === false) { gone.push(p ? p.name : l.name); return false; } l.name = p.name; return true; });
  if (cart.customer_id != null && !custById(cart.customer_id)) { cart.customer_id = null; if (cart.method === 'hutang') cart.method = 'tunai'; }
  S.cart = cart; saveCart();
  closeModal(true);
  renderCart();
  if (cart.lines.length && isPhone()) openCartSheet();
  toast(swapped ? t('hold.swapped', { held: swapped, label: h.label }) : t('hold.resumed', { label: h.label }), 'ok', swapped ? 5000 : 2800);
  if (gone.length) toast(t('hold.dropped', { names: gone.join(', ') }), 'warn', 6000);
  const low = cart.lines.find(l => num(prodById(l.product_id).stock) < l.qty);
  if (low) toast(t('pos.stock_low', { name: low.name }), 'warn', 3000);
}
async function deleteHeld(id) {
  const h = heldList().find(x => x.id === id); if (!h) return;
  const r = await confirmBox(t('hold.del_confirm', { label: h.label }), { danger: true, ok: t('delete') });
  if (!r.ok) return;
  saveHeld(heldList().filter(x => x.id !== id));
  toast(t('hold.deleted'), 'ok');
  const m = $('#held-list'); if (m) drawHeld(m);
}

function upsertLocal(arr, obj) { const i = arr.findIndex(x => x.id == obj.id); if (i >= 0) arr[i] = Object.assign(arr[i], obj); else arr.push(obj); return obj; }

/* ========== POS: survey (consent + speech-to-text, text only) ========== */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const SP = { rec: null, idx: -1, want: false, base: '', fin: '' };
function stopSpeech() { SP.want = false; if (SP.rec) { try { SP.rec.stop(); } catch (e) { } } SP.rec = null; SP.idx = -1; $$('.mic.on').forEach(b => b.classList.remove('on')); }
function startSpeech(i, root) {
  stopSpeech();
  const ta = $(`[data-sq="${i}"]`, root), intEl = $(`#sv-int-${i}`, root), btn = $(`.mic[data-i="${i}"]`, root);
  const rec = new SpeechRec();
  rec.lang = 'id-ID'; rec.continuous = true; rec.interimResults = true;
  SP.rec = rec; SP.idx = i; SP.want = true; SP.base = ta.value.trim() ? ta.value.trim() + ' ' : ''; SP.fin = '';
  rec.onresult = e => {
    let interim = '';
    for (let k = e.resultIndex; k < e.results.length; k++) { const r = e.results[k]; if (r.isFinal) SP.fin += r[0].transcript; else interim += r[0].transcript; }
    ta.value = (SP.base + SP.fin).trim(); intEl.textContent = interim;
  };

function checkout() {

function buildSaleRequest(v) {

    items: v.lines.map(l => ({ product_id: l.p.id, qty: roundQty(l.line.qty), unit_price: l.unit_price, price_type: l.type })),
    discount: v.discount, payment_method: c.method, paid_amount: Math.min(v.paid, v.total),

function receiptFromCart(v, req) {

    customer_name: v.cust ? v.cust.name : t('pos.walkin'), customer_phone: v.cust ? v.cust.phone : '', customer_id: v.cust ? v.cust.id : null,
    lines: v.lines.map(l => ({ name: l.p.name, unit: l.p.unit || '', qty: roundQty(l.line.qty), unit_price: l.unit_price, price_type: l.type, line_total: l.total })),
    subtotal: v.subtotal, discount: v.discount, total: v.total, method: S.cart.method, paid: v.paid, change: v.change, debt: v.debt, status: 'ok', promo_code: req.promo_code, channel: req.channel,

}
/** Saves the cart. extra = {approver} | {approval_id}; meta.approvedBy for the receipt.
 *  Returns 'ok' | 'queued' | 'approval_error' | 'error' | 'needs_approval'. */
async function doSave(extra = {}, meta = {}) {
  if (saving) return 'error';
  const v = cartView();
  if (!v.lines.length || v.error) { checkout(); return 'error'; }
  if (needsApproval(v) && !extra.approver && !extra.approval_id) { openApprovalStep(v); return 'needs_approval'; }
  saving = true;
  const btn = $('#btn-checkout'); if (btn) { btn.disabled = true; btn.textContent = t('saving'); }
  const req = Object.assign(buildSaleRequest(v), extra), rc = receiptFromCart(v, req);
  rc.approved_by = meta.approvedBy || (extra.approver ? extra.approver.user : '');
  rc.exit_required = localExitRequired(v);
  try {
    const r = extra.approver ? await apiRaw('save_sale', req, sessCred()) : await api('save_sale', req);
    rc.invoice_no = r.invoice_no || (r.sale && r.sale.invoice_no) || '';
    if (r.sale) { rc.total = int(r.sale.total ?? rc.total); rc.debt = int(r.sale.debt_amount ?? rc.debt); if (r.sale.approved_by) rc.approved_by = r.sale.approved_by; }
    if (r.exit_photo_required != null) rc.exit_required = !!r.exit_photo_required;
    applyStock(r.stock);
    if (v.cust && !r.duplicate) { v.cust.debt_balance = int(v.cust.debt_balance) + rc.debt; }
    rc.debt_after = v.cust ? v.cust.debt_balance : 0;
    finishSale(rc);
    return 'ok';
  } catch (e) {
    if (isRetryable(e)) { queueSale(req, rc); finishSale(Object.assign(rc, { pending: true, invoice_no: 'OFFLINE-' + req.client_id.slice(0, 8).toUpperCase() })); toast(t('outbox.queued'), 'warn', 4000); return 'queued'; }
    if (extra.approver && ['BAD_PIN', 'APPROVAL_REQUIRED'].includes(e.code)) return 'approval_error';
    if (e.code === 'APPROVAL_REQUIRED') { toast(errMsg(e), 'err', 5000); if (!extra.approval_id) openApprovalStep(v); return 'error'; }
    if (e.code === 'SHIFT_REQUIRED') { S.shift = null; S.shiftsSupported = true; promptOpenShift(() => doSave(extra, meta)); return 'error'; }
    if (!['BAD_PIN', 'BAD_KEY', 'NO_USERS'].includes(e.code)) toast(errMsg(e), 'err', 5000);
    return 'error';
  } finally {
    saving = false;
    const b = $('#btn-checkout'); if (b) { b.disabled = !S.cart.lines.length; b.textContent = t('pos.pay_save'); }
  }
}
const needsApproval = v => v.debt > 0 && S.role === 'kasir';
function localExitRequired(v) {
  const st = settings(), minT = int(st.exit_photo_min_total ?? 1000000), minQ = num(st.exit_photo_min_qty ?? 20);
  return (minT > 0 && v.total >= minT) || (minQ > 0 && v.lines.some(l => num(l.line ? l.line.qty : l.qty) >= minQ));
}
function applyStock(list) {
  (list || []).forEach(s => { const p = prodById(s.product_id); if (p) { p.stock = roundQty(num(s.stock) - pendingQty(p.id)); if (s.cost_price != null && isOwner()) p.cost_price = int(s.cost_price); } });
  saveCache();
}
function finishSale(rc) {
  const fo = S.cart && S.cart.field_order;
  if (fo && !rc.pending && rc.invoice_no) markOrderProcessed(fo, rc.invoice_no);
  rememberReceipt(rc);

}

/* ========== Outbox (offline queue for sales) ========== */
let syncing = false;
function saveOutbox() { store.set('outbox', S.outbox); updateOutboxBadge(); }
function queueSale(req, rc) {
  if (S.outbox.some(e => e.client_id === req.client_id)) return;
  S.outbox.push({ client_id: req.client_id, req, rc, key: S.key, user: S.user, pin_hash: S.pin_hash, queued_at: new Date().toISOString(), tries: 0, error: '', field_order: S.cart && S.cart.field_order || null });
  for (const it of req.items) { const p = prodById(it.product_id); if (p) p.stock = roundQty(p.stock - it.qty); }
  const c = custById(req.customer_id); if (c) { c.debt_balance += rc.debt; rc.debt_after = c.debt_balance; }
  saveOutbox(); saveCache();
}
function updateOutboxBadge() {
  const b = $('#tb-outbox'); if (!b) return;
  const n = S.outbox.length;
  b.hidden = !n; b.textContent = t('outbox.badge', { n });
}
async function syncOutbox(manual) {
  if (syncing || !S.outbox.length) { if (manual && !S.outbox.length) toast(t('outbox.empty'), 'ok'); return; }
  syncing = true;
  let sent = 0;
  try {
    for (const e of S.outbox.slice()) {
      const cred = manual && e.error === 'BAD_PIN' && S.pin_hash ? { key: S.key, user: S.user, pin_hash: S.pin_hash } : { key: e.key, user: e.user, pin_hash: e.pin_hash };
      try {
        const r = await apiRaw('save_sale', e.req, cred);
        S.outbox = S.outbox.filter(x => x.client_id !== e.client_id);
        saveOutbox();
        applyStock(r.stock);
        const rc = Object.assign({}, e.rc, { pending: false, invoice_no: r.invoice_no || (r.sale && r.sale.invoice_no) || e.rc.invoice_no });
        rememberReceipt(rc);
        if (e.field_order && rc.invoice_no) markOrderProcessed(e.field_order, rc.invoice_no);
        sent++;
      } catch (err) {
        e.tries++; e.error = err.code || 'SERVER'; e.message = err.message || '';
        saveOutbox();
        if (err instanceof NetError) break;
      }
    }
  } finally { syncing = false; }
  if (sent) { toast(t('outbox.synced', { n: sent }), 'ok'); if (S.view === 'history' || S.view === 'settings') RENDER[S.view](); }
  else if (manual && S.outbox.length) toast(t('outbox.still', { n: S.outbox.length }), 'warn');
}

const APR_POLL_MS = 4000, APR_MAX_MS = 15 * 60000;
function openWaiting(ap) {
  let timer = null, stopped = false;
  const started = Date.now();
  const el = openModal({
    title: t('apr.waiting_title'), cls: 'narrow', id: 'apr-wait',
    body: `<div class="wait-box"><div class="small muted">${esc(t('apr.request_id'))}</div><div class="rid" id="aw-id">${esc(ap.request_id)}</div>
      <p style="margin:6px 0"><b>${esc(ap.customer_name || '')}</b></p>
      <div class="row" style="justify-content:center;gap:18px"><span>${esc(t('apr.debt_new'))}: <b class="red num">${fmtRp(ap.debt_amount)}</b></span><span>${esc(t('total'))}: <b class="num">${fmtRp(ap.total)}</b></span></div>
      <div id="aw-state"><div class="spinner"></div><div id="aw-msg">${esc(t('apr.waiting'))}</div><div class="small muted" id="aw-time"></div></div></div>`,
    foot: `<button class="btn" id="aw-cancel">${esc(t('apr.stop_wait'))}</button>`,
    onClose: () => { stopped = true; clearTimeout(timer); refreshCartNumbers(); }
  });
  const msg = txt => { const m = $('#aw-msg', el); if (m) m.textContent = txt; };
  const finish = html => { stopped = true; clearTimeout(timer); $('#aw-state', el).innerHTML = html; };
  $('#aw-cancel', el).onclick = () => closeModal();
  const tick = async () => {
    if (stopped) return;
    const secs = Math.round((Date.now() - started) / 1000);
    const tm = $('#aw-time', el); if (tm) tm.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    if (Date.now() - started > APR_MAX_MS) {
      finish(`<p class="red"><b>${esc(t('apr.timeout'))}</b></p><button class="btn primary" id="aw-again">${esc(t('apr.wait_again'))}</button>`);
      $('#aw-again', el).onclick = () => { closeModal(); openWaiting(ap); };
      return;
    }
    try {
      const r = await api('check_approval', { request_id: ap.request_id });
      if (stopped) return;
      const a = r.approval || {};
      if (a.status === 'approved' || a.status === 'used') {
        finish(`<p class="green"><b>${esc(t('apr.approved_by', { name: a.decided_by || '' }))}</b></p><div class="spinner"></div>`);
        closeModal();
        const res = await doSave({ approval_id: ap.request_id }, { approvedBy: a.decided_by });
        if (res === 'ok' || res === 'queued') { S.cart.remote = null; }
        return;
      }
      if (a.status === 'rejected') {
        S.cart.remote = null; saveCart();
        finish(`<p class="red" style="font-size:18px"><b>${esc(t('apr.rejected_by', { name: a.decided_by || '' }))}</b></p>${a.note ? `<p id="aw-note">“${esc(a.note)}”</p>` : ''}<button class="btn primary" data-act="modal-close" id="aw-back">${esc(t('apr.back_to_cart'))}</button>`);
        return;
      }
      msg(t('apr.waiting'));
    } catch (e) {
      if (stopped) return;
      msg(e instanceof NetError ? t('apr.retrying') : errMsg(e));
    }
    timer = setTimeout(tick, APR_POLL_MS);
  };
  timer = setTimeout(tick, 600);
}

/* ========== Photos: resize on device, AI read via photo endpoint ========== */
async function imageToJpeg(file, max = 1600, quality = 0.8) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = url; });
    const draw = (m, q) => {
      const sc = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', q);
    };
    const full = draw(max, quality);
    return { base64: full.slice(full.indexOf(',') + 1), mime: 'image/jpeg', thumb: draw(240, 0.7) };
  } finally { URL.revokeObjectURL(url); }
}

async function remakeSale(inv, saleDate) {

const YR = { year: +today().slice(0, 4), cur: null, prev: null, err: '' };
const pctChange = (now, base) => base ? (now - base) / Math.abs(base) * 100 : null;
const fmtDelta = p => p == null ? '—' : (p > 0 ? '+' : '') + fmtPct(p);
function monthAgg(d, year) {
  const M = Array.from({ length: 12 }, (_, i) => ({ m: i + 1, omzet: 0, hpp: 0, laba: 0, exp: 0, n: 0 }));
  d.sales.forEach(s => { if (s.status === 'void' || String(s.sale_date).slice(0, 4) !== String(year)) return; const x = M[+s.sale_date.slice(5, 7) - 1]; x.omzet += int(s.total); x.hpp += int(s.total_cost); x.laba += int(s.profit); x.n++; });
  (d.expenses || []).forEach(e => { if (String(e.expense_date).slice(0, 4) !== String(year)) return; M[+e.expense_date.slice(5, 7) - 1].exp += int(e.amount); });
  M.forEach(x => { x.net = x.laba - x.exp; x.margin = x.omzet ? x.laba / x.omzet * 100 : 0; });
  return M;
}
function computeAnnual(cur, prev, year) {
  const M = monthAgg(cur, year), P = prev ? monthAgg(prev, year - 1) : null;
  M.forEach((x, i) => { const base = i ? M[i - 1].omzet : (P ? P[11].omzet : 0); x.dPrev = pctChange(x.omzet, base); x.dYoY = P ? pctChange(x.omzet, P[i].omzet) : null; });

  const T = { omzet: tot('omzet'), hpp: tot('hpp'), laba: tot('laba'), exp: tot('exp'), net: tot('net'), n: tot('n') };
  T.margin = T.omzet ? T.laba / T.omzet * 100 : 0; T.netMargin = T.omzet ? T.net / T.omzet * 100 : 0;
  const PT = P ? { omzet: sum(P, x => x.omzet), laba: sum(P, x => x.laba), exp: sum(P, x => x.exp), net: sum(P, x => x.net) } : null;
  const ok = new Set(cur.sales.filter(s => s.status !== 'void' && String(s.sale_date).slice(0, 4) === String(year)).map(s => s.invoice_no));
  const agg = new Map();
  cur.items.forEach(i => { if (!ok.has(i.invoice_no)) return; const a = agg.get(String(i.product_id)) || { id: i.product_id, name: i.name, qty: 0, omzet: 0, laba: 0 }; a.qty += num(i.qty); a.omzet += int(i.line_total); a.laba += int(i.line_profit); agg.set(String(i.product_id), a); });
  const totalLineProfit = sum([...agg.values()], a => a.laba);
  const products = [...agg.values()].map(a => Object.assign(a, { qty: roundQty(a.qty), cost: a.omzet - a.laba, margin: a.omzet ? a.laba / a.omzet * 100 : 0, share: totalLineProfit ? a.laba / totalLineProfit * 100 : 0, unit: (prodById(a.id) || {}).unit || '' })).sort((a, b) => b.laba - a.laba);
  const exps = (cur.expenses || []).filter(e => String(e.expense_date).slice(0, 4) === String(year));
  const byCat = EXP_CATS.map(c => ({ cat: c, amount: sum(exps.filter(e => e.category === c), e => int(e.amount)) })).filter(x => x.amount > 0).sort((a, b) => b.amount - a.amount);
  return { year, M, P, T, PT, products, byCat, totalLineProfit };
}

const ATT = { items: [], notifs: store.get('notifs', []), myReq: store.get('my_requests', []) };
