<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7B5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khair POS">
<meta name="description" content="Kasir (POS) Khair Mart — grosir &amp; eceran">
<title>Khair Mart POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ========== Tokens ========== */
:root{
  --green:#0F7B5F; --green-d:#0A5E48; --green-l:#E4F3EE; --green-ll:#F1F8F5;
  --gold:#C8A24A; --gold-d:#8F6F22; --gold-l:#FBF4E2;
  --bg:#F4F6F5; --card:#FFFFFF; --text:#17251F; --muted:#5B6B65; --border:#DDE5E2; --border-d:#C5D1CC;
  --red:#B42318; --red-l:#FDECEA; --amber:#B54708; --amber-l:#FEF4E6; --blue:#1D4ED8; --blue-l:#E8EEFD;
  --radius:12px; --radius-s:8px; --shadow:0 1px 2px rgba(16,40,32,.06),0 2px 8px rgba(16,40,32,.06);
  --shadow-l:0 10px 40px rgba(16,40,32,.22);
  --rail:88px; --top:56px; --tab:62px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic","Geeza Pro",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--green-d)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.red{color:var(--red)}
.green{color:var(--green-d)}
.right{text-align:end}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========== Controls ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-s);border:1px solid var(--border-d);background:var(--card);font-weight:600;line-height:1.1;text-decoration:none;color:var(--text);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--green-ll)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b2208}
.btn.danger{color:var(--red);border-color:#F1B8B2}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--green-ll)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.xs{min-height:30px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:17px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--radius-s);border:1px solid var(--border-d);background:var(--card);padding:0;flex:none}
.icon-btn:hover{background:var(--green-ll)}
.icon-btn.ghost{border-color:transparent;background:transparent}
.icon-btn.sm{width:36px;height:36px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg.i{width:19px;height:19px}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--border-d);border-radius:var(--radius-s);background:#fff}
textarea.input{min-height:70px;resize:vertical}
.input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(15,123,95,.18)}
.input.num{text-align:end}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--green);flex:none;margin:1px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-d);background:#fff;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:var(--radius-s);border:1px solid var(--border-d);background:#fff;font-weight:700;font-size:14px;padding:0 4px}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.seg button.on.debt{background:var(--amber);border-color:var(--amber)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--green-l);color:var(--green-d);white-space:nowrap}
.badge.gold{background:var(--gold-l);color:var(--gold-d)}
.badge.red{background:var(--red-l);color:var(--red)}
.badge.amber{background:var(--amber-l);color:var(--amber)}
.badge.gray{background:#EEF1F0;color:var(--muted)}
.badge.blue{background:var(--blue-l);color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--border);margin:12px 0}

/* ========== App shell ========== */
#app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:var(--top) 1fr;height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;background:var(--green);color:#fff;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.2px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#2b2208;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.85}
.topbar .icon-btn,.topbar .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.topbar .icon-btn:hover,.topbar .btn:hover{background:rgba(255,255,255,.22)}
.topbar .btn{min-height:38px;padding:0 12px}
.outbox-badge{background:var(--gold)!important;color:#2b2208!important;font-weight:800}
.who{font-size:13px;text-align:end;line-height:1.15;opacity:.95}
.who b{display:block;font-size:14px}
.rail{background:#fff;border-inline-end:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 2px;text-align:center}
.nav-btn svg.i{width:24px;height:24px}
.nav-btn:hover{background:var(--green-ll);color:var(--green-d)}
.nav-btn.on{background:var(--green-l);color:var(--green-d)}
.nav-btn .l-short{display:none}
main{overflow:hidden;position:relative;min-width:0}
.view{height:100%;overflow-y:auto;padding:16px 20px 32px}
.view.pos-view{padding:0;overflow:hidden}
.view-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.view-head h1{font-size:21px;margin:0;flex:1;min-width:160px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;flex:1;min-width:180px}
.toolbar select.input{flex:0 1 auto;min-width:140px}

/* ========== Tables / lists ========== */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:#F7FAF9;text-align:start;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--green-ll)}
.tbl th.r,.tbl td.r{text-align:end}
.tbl tr.void td{color:var(--muted);text-decoration:line-through}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);min-height:60px;text-align:start;width:100%}
button.li:hover{border-color:var(--green)}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted)}

/* ========== POS ========== */
.pos{display:grid;grid-template-columns:1fr minmax(360px,410px);height:100%}
.pos-left{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px 0}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-box{position:relative;flex:1}
.search-box svg.i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-inline-start:42px;min-height:50px;font-size:16px;border-width:2px}
.prod-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:10px;align-content:start;grid-auto-rows:max-content;padding:2px 2px 18px}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:start;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;min-height:120px;box-shadow:var(--shadow);position:relative}
.pcard:hover{border-color:var(--green)}
.pcard:active{transform:scale(.98)}
.pcard .nm{font-weight:700;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pcard .sku{font-size:12px;color:var(--muted);gap:6px}
.pcard .sku .badge{font-size:11.5px;padding:1px 7px}
.pcard .pr{font-weight:800;font-size:16px;color:var(--green-d);margin-top:auto}
.pcard .gr{font-size:12px;color:var(--gold-d);font-weight:600}
.pcard.low{border-color:#F3C3BE}
.cart{display:flex;flex-direction:column;min-height:0;background:#fff;border-inline-start:1px solid var(--border)}
.cart-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.cust-btn{flex:1;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border:1px dashed var(--border-d);border-radius:var(--radius-s);background:var(--green-ll);text-align:start;min-width:0}
.cust-btn b{display:block;font-size:14.5px}
.cust-btn span{font-size:12.5px;color:var(--muted)}
.cart-lines{flex:1;overflow-y:auto;padding:6px 10px;min-height:80px;position:relative}
.cline{padding:10px 4px;border-bottom:1px solid var(--border)}
.cline:last-child{border-bottom:0}
.cline .top{display:flex;gap:8px;align-items:flex-start}
.cline .nm{flex:1;font-weight:700;font-size:14.5px;line-height:1.25}
.cline .lt{font-weight:800}
.cline .bot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1px solid var(--border-d);border-radius:var(--radius-s);overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:#F3F6F5;font-size:20px;font-weight:700;color:var(--green-d)}
.qty input{width:64px;height:40px;border:0;text-align:center;font-weight:700;font-size:15px;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.ptype{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border-d);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted)}
.ptype.grosir{background:var(--gold-l);border-color:var(--gold);color:var(--gold-d)}
.ptype.manual::after{content:" •";color:var(--blue)}
.cart-foot{border-top:1px solid var(--border);padding:10px 14px 14px;background:#FBFCFC}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.sumrow.total{font-size:22px;font-weight:800;color:var(--green-d);padding:6px 0}
.sumrow .input{width:140px;min-height:38px;padding:6px 10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.quick .btn{flex:1 0 auto}
.paybox{margin-top:8px}
.paybox .result{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:6px 10px;border-radius:var(--radius-s);margin:6px 0;background:var(--green-l);color:var(--green-d)}
.paybox .result.debt{background:var(--amber-l);color:var(--amber)}
.paybox .result.err{background:var(--red-l);color:var(--red)}
.cart-bar{display:none}
.cart-close{display:none}
.survey-tag{font-size:12px}

/* ========== Modal / toast ========== */
.modal-bg{position:fixed;inset:0;background:rgba(10,30,24,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .12s}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-l);width:100%;max-width:520px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:900px}
.modal.narrow{max-width:400px}
.modal-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h2{flex:1;margin:0;font-size:18px}
.modal-b{padding:16px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:#FBFCFC}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#17251F;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-l);font-weight:600;font-size:14.5px;animation:fade .15s;text-align:center}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green-d)}
.toast.warn{background:var(--amber)}

/* ========== Login ========== */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0F7B5F 0%,#0A5E48 55%,#084A39 100%);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.login-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-l);width:100%;max-width:400px;padding:22px 20px;margin:auto}
.login-card .brand{color:var(--text);justify-content:center;margin-bottom:14px;font-size:20px}
.login-card h2{text-align:center;font-size:17px;margin:0 0 14px}
.users-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.users-pick button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border-d);background:#fff;font-weight:700}
.users-pick button.on{background:var(--green);color:#fff;border-color:var(--green)}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:8px 0 16px;min-height:18px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--green);display:block}
.pin-dots i.f{background:var(--green)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:60px;border-radius:14px;border:1px solid var(--border);background:#F5F8F7;font-size:24px;font-weight:700}
.pinpad button:active{background:var(--green-l)}
.pinpad button.ok{background:var(--green);color:#fff;font-size:17px}
.login-err{color:var(--red);text-align:center;font-weight:600;min-height:22px;margin:4px 0}
.login-links{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.lang-sw{display:flex;gap:6px;justify-content:center;margin-top:10px}

/* ========== Receipt ========== */
.receipt{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;font-size:13px;line-height:1.35;color:#000;background:#fff;margin:0 auto;padding:12px 10px;border:1px dashed var(--border-d);max-width:330px;direction:ltr;text-align:left}
.receipt.w58{max-width:260px}
.receipt .c{text-align:center}
.receipt .b{font-weight:700}
.receipt .big{font-size:16px;font-weight:800}
.receipt .ln{border-top:1px dashed #000;margin:6px 0}
.receipt .r2{display:flex;justify-content:space-between;gap:6px}
.receipt .it{margin:3px 0}
.receipt .stamp{border:2px solid #000;text-align:center;font-weight:800;padding:3px;margin:6px 0}
#print-area{display:none}

/* ========== Reports ========== */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{background:var(--green);color:#fff;border-color:var(--green)}
.kpi.hl .k,.kpi.hl .s{color:rgba(255,255,255,.85)}
.kpi.gold{border-top:3px solid var(--gold)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel .pb{padding:12px 14px}
.panel .tbl th{position:static}
.bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.bar{height:12px;background:#EEF2F1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.bar i.g{background:var(--gold)}
.chart .pb svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:0 14px 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* ========== Survey ========== */
.sq{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:10px}
.sq .q{font-weight:700;margin-bottom:6px}
.sq .a{display:flex;gap:8px;align-items:flex-start}
.sq textarea{min-height:44px;flex:1}
.mic{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-d);background:#fff;display:grid;place-items:center;flex:none;color:var(--green-d)}
.mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
.interim{font-size:13px;color:var(--muted);font-style:italic;min-height:0;margin-top:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.45)}70%{box-shadow:0 0 0 10px rgba(180,35,24,0)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}
.cam video{width:100%;border-radius:var(--radius-s);background:#000;max-height:60vh}

/* ========== Busy bar ========== */
body.busy::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:300;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}

/* ========== Phone ========== */
@media (max-width:759px){
  #app{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr var(--tab)}
  .topbar{padding:0 8px 0 12px;gap:6px}
  .brand small{display:none}
  .who{display:none}
  .rail{grid-row:3;flex-direction:row;border-inline-end:0;border-top:1px solid var(--border);padding:4px 2px calc(4px + env(safe-area-inset-bottom));gap:0;overflow:visible;box-shadow:0 -2px 10px rgba(0,0,0,.04)}

          else qty = R() < 0.08 ? p.wholesale_min_qty : ri(1, 3);
          const pt = grosir || (p.wholesale_min_qty > 0 && qty >= p.wholesale_min_qty) ? 'grosir' : 'eceran';
          const unit_price = pt === 'grosir' ? p.wholesale_price : p.retail_price;

        const total = subtotal - discount;

        items.push(...lines);

      }

function newCart() { return { client_id: uuid(), lines: [], customer_id: null, discount: 0, method: 'tunai', paid: '', survey: null, notes: '' }; }
function loadCart() { const c = store.get('cart'); return c && Array.isArray(c.lines) && c.client_id ? c : newCart(); }
const saveCart = () => store.set('cart', S.cart);
function lineCalc(line, cust) {
  const p = prodById(line.product_id) || { name: line.name || '?', retail_price: 0, wholesale_price: 0, wholesale_min_qty: 0, unit: '', stock: 0 };
  const wmin = num(p.wholesale_min_qty);
  const auto = (cust && cust.type === 'grosir') || (wmin > 0 && line.qty >= wmin) ? 'grosir' : 'eceran';
  let type = line.override || auto;
  if (type === 'grosir' && !(int(p.wholesale_price) > 0)) type = 'eceran';
  const unit_price = type === 'grosir' ? int(p.wholesale_price) : int(p.retail_price);
  return { p, type, auto, unit_price, total: Math.round(line.qty * unit_price), manual: !!line.override && line.override !== auto };
}
function cartView() {
  const c = S.cart, cust = custById(c.customer_id);
  const lines = c.lines.map(l => Object.assign({ line: l }, lineCalc(l, cust)));
  const subtotal = sum(lines, l => l.total);
  const discount = Math.min(subtotal, Math.max(0, int(c.discount)));
  const total = subtotal - discount;
  const typed = String(c.paid).trim() !== '';
  const paid = typed ? moneyVal(c.paid) : (c.method === 'hutang' ? 0 : total);
  const change = Math.max(0, paid - total), debt = Math.max(0, total - paid);
  const items = sum(c.lines, l => l.qty);
  let error = '';
  if (debt > 0 && !cust) error = c.method === 'hutang' ? t('pos.debt_needs_customer') : t('pos.partial_needs_customer');
  return { cust, lines, subtotal, discount, total, paid, typed, change, debt, items, error };
}
function addToCart(p, qty = 1) {
  if (!p) return;
  if (p.active === false) { toast(t('pos.inactive'), 'warn'); return; }
  const ex = S.cart.lines.find(l => l.product_id == p.id);
  if (ex) ex.qty = roundQty(ex.qty + qty); else S.cart.lines.push({ product_id: p.id, name: p.name, qty, override: null });
  saveCart(); renderCart(p.id);
  const stockLeft = num(p.stock) - (ex ? ex.qty : qty);
  if (stockLeft < 0) toast(t('pos.stock_low', { name: p.name }), 'warn', 2000);
}
function findBySku(code) {
  const c = String(code || '').trim().toLowerCase();
  if (!c) return null;
  return S.products.find(p => p.active !== false && String(p.sku || '').trim().toLowerCase() === c) || null;
}
function filterProducts(q, cat, opts = {}) {
  const toks = norm(q).split(' ').filter(Boolean);
  let list = S.products.filter(p => (opts.includeInactive || p.active !== false) && (!cat || p.category === cat));
  if (toks.length) {
    list = list.filter(p => { const h = norm(`${p.name} ${p.sku} ${p.category}`); return toks.every(tk => h.includes(tk)); });
    const nq = norm(q);
    list.sort((a, b) => (norm(b.sku) === nq) - (norm(a.sku) === nq) || norm(b.name).startsWith(nq) - norm(a.name).startsWith(nq) || a.name.localeCompare(b.name));
  } else list.sort((a, b) => a.name.localeCompare(b.name));

}

  rec.onerror = e => { if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)) { SP.want = false; toast(t('survey.mic_denied'), 'err'); } };
  rec.onend = () => {

/* ========== POS: checkout ========== */
let saving = false;
function checkout() {
  const v = cartView();
  if (!v.lines.length) { toast(t('pos.cart_empty'), 'warn'); return; }
  if (v.error) { toast(v.error, 'err'); openCartSheet(); const b = $('#cart-cust'); if (b) b.animate([{ outline: '3px solid #B42318' }, { outline: '0' }], { duration: 1200 }); return; }
  if (v.lines.some(l => !l.p.id)) { toast(t('pos.unknown_product'), 'err'); return; }
  const qs = surveyQuestions();
  if (!S.cart.survey && qs.length && settings().survey_auto !== false) { openSurvey(true); return; }
  doSave();
}
function buildSaleRequest(v) {

  const now = new Date();
  return {
    client_id: c.client_id, sale_date: jktDate(now), sale_time: jktISO(now),
    customer_id: v.cust ? v.cust.id : null, customer_name: v.cust ? v.cust.name : 'Umum', customer_type: v.cust ? v.cust.type : 'eceran',
    items: v.lines.map(l => ({ product_id: l.p.id, qty: roundQty(l.line.qty), unit_price: l.unit_price, price_type: l.type })),
    discount: v.discount, payment_method: c.method, paid_amount: Math.min(v.paid, v.total),
    survey: sv && !sv.skipped && sv.consent ? sv.answers : [], survey_consent: !!(sv && !sv.skipped && sv.consent),

}
function receiptFromCart(v, req) {
  return {
    invoice_no: '', client_id: req.client_id, pending: false, sale_date: req.sale_date, sale_time: req.sale_time, cashier: S.user,
    customer_name: v.cust ? v.cust.name : t('pos.walkin'), customer_phone: v.cust ? v.cust.phone : '', customer_id: v.cust ? v.cust.id : null,
    lines: v.lines.map(l => ({ name: l.p.name, unit: l.p.unit || '', qty: roundQty(l.line.qty), unit_price: l.unit_price, price_type: l.type, line_total: l.total })),
    subtotal: v.subtotal, discount: v.discount, total: v.total, method: S.cart.method, paid: v.paid, change: v.change, debt: v.debt, status: 'ok',
    debt_after: v.cust ? int(v.cust.debt_balance) + v.debt : 0
  };
}
async function doSave() {
  if (saving) return;
  const v = cartView();
  if (!v.lines.length || v.error) { checkout(); return; }
  saving = true;
  const btn = $('#btn-checkout'); if (btn) { btn.disabled = true; btn.textContent = t('saving'); }
  const req = buildSaleRequest(v), rc = receiptFromCart(v, req);
  try {
    const r = await api('save_sale', req);
    rc.invoice_no = r.invoice_no || (r.sale && r.sale.invoice_no) || '';
    if (r.sale) { rc.total = int(r.sale.total ?? rc.total); rc.debt = int(r.sale.debt_amount ?? rc.debt); }
    applyStock(r.stock);
    if (v.cust && !r.duplicate) { v.cust.debt_balance = int(v.cust.debt_balance) + rc.debt; }
    rc.debt_after = v.cust ? v.cust.debt_balance : 0;
    finishSale(rc);
  } catch (e) {
    if (isRetryable(e)) { queueSale(req, rc); finishSale(Object.assign(rc, { pending: true, invoice_no: 'OFFLINE-' + req.client_id.slice(0, 8).toUpperCase() })); toast(t('outbox.queued'), 'warn', 4000); }
    else if (!['BAD_PIN', 'BAD_KEY', 'NO_USERS'].includes(e.code)) toast(errMsg(e), 'err', 5000);
  } finally {
    saving = false;
    const b = $('#btn-checkout'); if (b) { b.disabled = !S.cart.lines.length; b.textContent = t('pos.pay_save'); }
  }
}
function applyStock(list) {
  (list || []).forEach(s => { const p = prodById(s.product_id); if (p) { p.stock = roundQty(num(s.stock) - pendingQty(p.id)); if (s.cost_price != null && isOwner()) p.cost_price = int(s.cost_price); } });
  saveCache();
}
function finishSale(rc) {
  rememberReceipt(rc);
  S.cart = newCart(); saveCart();
  closeCartSheet(); renderGrid(); renderCart();
  showReceipt(rc, { fromSale: true });
}
function rememberReceipt(rc) {
  const all = store.get('receipts', []).filter(x => x.client_id !== rc.client_id);
  all.unshift(rc); store.set('receipts', all.slice(0, 60));
}

/* ========== Outbox (offline queue for sales) ========== */
let syncing = false;
function saveOutbox() { store.set('outbox', S.outbox); updateOutboxBadge(); }
function queueSale(req, rc) {
  if (S.outbox.some(e => e.client_id === req.client_id)) return;
  S.outbox.push({ client_id: req.client_id, req, rc, key: S.key, user: S.user, pin_hash: S.pin_hash, queued_at: new Date().toISOString(), tries: 0, error: '' });
  for (const it of req.items) { const p = prodById(it.product_id); if (p) p.stock = roundQty(p.stock - it.qty); }
  const c = custById(req.customer_id); if (c) { c.debt_balance += rc.debt; rc.debt_after = c.debt_balance; }
  saveOutbox(); saveCache();
}
function updateOutboxBadge() {
  const b = $('#tb-outbox'); if (!b) return;
  const n = S.outbox.length;
  b.hidden = !n; b.textContent = t('outbox.badge', { n });
}
async function syncOutbox(manual) {
  if (syncing || !S.outbox.length) { if (manual && !S.outbox.length) toast(t('outbox.empty'), 'ok'); return; }
  syncing = true;
  let sent = 0;
  try {
    for (const e of S.outbox.slice()) {
      const cred = manual && e.error === 'BAD_PIN' && S.pin_hash ? { key: S.key, user: S.user, pin_hash: S.pin_hash } : { key: e.key, user: e.user, pin_hash: e.pin_hash };
      try {
        const r = await apiRaw('save_sale', e.req, cred);
        S.outbox = S.outbox.filter(x => x.client_id !== e.client_id);
        saveOutbox();
        applyStock(r.stock);
        const rc = Object.assign({}, e.rc, { pending: false, invoice_no: r.invoice_no || (r.sale && r.sale.invoice_no) || e.rc.invoice_no });
        rememberReceipt(rc);
        sent++;
      } catch (err) {
        e.tries++; e.error = err.code || 'SERVER'; e.message = err.message || '';
        saveOutbox();
        if (err instanceof NetError) break;
      }
    }
  } finally { syncing = false; }
  if (sent) { toast(t('outbox.synced', { n: sent }), 'ok'); if (S.view === 'history' || S.view === 'settings') RENDER[S.view](); }
  else if (manual && S.outbox.length) toast(t('outbox.still', { n: S.outbox.length }), 'warn');
}
setInterval(() => { if (S.inApp) syncOutbox(); }, OUTBOX_RETRY_MS);

}

/* ========== CSV import (majoo etc.) ========== */
const IMPORT_FIELDS = [
  ['name', ['name', 'nama', 'nama produk', 'produk', 'nama barang', 'nama item', 'product', 'product name', 'item name']],
  ['sku', ['sku', 'barcode', 'kode', 'kode produk', 'sku produk', 'kode barang', 'code', 'product code']],
  ['category', ['category', 'kategori', 'kategori produk', 'jenis']],
  ['unit', ['unit', 'satuan', 'uom']],
  ['cost_price', ['cost_price', 'harga modal', 'hpp', 'harga beli', 'cost', 'harga pokok', 'modal']],
  ['retail_price', ['retail_price', 'harga jual', 'harga eceran', 'harga', 'price', 'harga satuan', 'selling price']],
  ['wholesale_price', ['wholesale_price', 'harga grosir', 'grosir', 'wholesale']],
  ['wholesale_min_qty', ['wholesale_min_qty', 'min grosir', 'minimal grosir', 'min qty grosir', 'minimum grosir']],
  ['stock', ['stock', 'stok', 'qty', 'jumlah', 'stok akhir', 'quantity']],
  ['min_stock', ['min_stock', 'stok minimum', 'stok minimal', 'minimum stok', 'min stok']]
];
function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/).find(l => l.trim()) || '';
  const count = ch => { let n = 0, q = false; for (const c of firstLine) { if (c === '"') q = !q; else if (c === ch && !q) n++; } return n; };
  const sep = count(';') > count(',') ? ';' : (count('\t') > count(',') ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return { sep, rows: rows.filter(r => r.some(x => String(x).trim() !== '')) };
}
function guessMapping(headers) {
  const h = headers.map(x => norm(x).replace(/[_*:()]/g, ' ').replace(/\s+/g, ' ').trim());
  const map = {}, used = new Set();
  for (const [field, syn] of IMPORT_FIELDS) {
    let idx = h.findIndex((x, i) => !used.has(i) && syn.includes(x));
    if (idx < 0) idx = h.findIndex((x, i) => !used.has(i) && syn.some(s => s.length > 3 && x.includes(s)));
    if (idx >= 0) { map[field] = idx; used.add(idx); }
  }
  return map;
}
function mapRow(r, map) {
  const o = {};
  for (const [field] of IMPORT_FIELDS) {
    if (map[field] == null || map[field] === '') continue;
    const raw = String(r[map[field]] ?? '').trim();
    if (raw === '') continue;
    if (['cost_price', 'retail_price', 'wholesale_price'].includes(field)) o[field] = Math.max(0, int(parseNum(raw)));
    else if (['stock', 'min_stock', 'wholesale_min_qty'].includes(field)) o[field] = roundQty(parseNum(raw));
    else o[field] = raw;
  }
  return o;
}

  $('#im-go', el).onclick = async () => {

      await refreshData();
    } catch (e) {
      $('#im-err', el).textContent = `${errMsg(e)} — ${t('imp.partial', { done, total: rows.length })}`;
      btn.disabled = false; btn.textContent = t('imp.retry_rest');
      IM.data = IM.data.filter(r => { const m = mapRow(r, IM.map); return m.name || m.sku; }).slice(done);
    }
  };
}

async function loadSales(from, to, useCache) {
  const k = from + '|' + to;

  const r = await api('get_sales', { from, to });
  const data = { sales: r.sales || [], items: r.items || [], payments: r.payments || [], purchases: r.purchases || [] };
  data.sales.forEach(s => { ['subtotal', 'discount', 'total', 'paid_amount', 'debt_amount'].forEach(f => s[f] = int(s[f])); if ('profit' in s) s.profit = int(s.profit); if ('total_cost' in s) s.total_cost = int(s.total_cost); });
  data.items.forEach(i => { i.qty = num(i.qty); i.unit_price = int(i.unit_price); i.line_total = int(i.line_total); if ('line_profit' in i) i.line_profit = int(i.line_profit); });
  data.payments.forEach(p => p.amount = int(p.amount));
  data.purchases.forEach(p => { p.qty = num(p.qty); p.total = int(p.total); });
  salesCache[k] = { at: Date.now(), data };
  return data;
}

/* ========== Reports (Laporan) ========== */
const RP = { preset: 'today', from: '', to: '', data: null, err: '' };
const SOURCE_RULES = [
  ['tiktok', /tik\s*tok/],
  ['instagram', /instagram|\big\b|insta/],
  ['facebook', /facebook|\bfb\b/],
  ['google', /google|maps|gmaps/],
  ['friends', /teman|temen|keluarga|saudara|sodara|tetangga|kawan|rekomendasi|dikasih tahu|dikasih tau|kenalan/],
  ['passing', /lewat|kebetulan|depan toko|lihat toko|papan nama|spanduk/],
  ['regular', /langganan|pelanggan lama|sudah lama|dari dulu|sudah sering/]
];
const isSourceQuestion = q => /dari mana|tahu .*khair|tau .*khair|from where|من أين/i.test(String(q || ''));
function classifySource(a) { const s = norm(a); for (const [k, re] of SOURCE_RULES) if (re.test(s)) return k; return 'other'; }

function computeReport(d, from, to) {
  const ok = d.sales.filter(s => s.status !== 'void');
  const inv = new Set(ok.map(s => s.invoice_no));
  const items = d.items.filter(i => inv.has(i.invoice_no));
  const hasProfit = ok.length ? ok.every(s => s.profit != null) : isOwner();
  const omzet = sum(ok, s => int(s.total));
  const laba = sum(ok, s => int(s.profit));
  const count = ok.length;
  const split = { eceran: 0, grosir: 0 };
  items.forEach(i => { split[i.price_type === 'grosir' ? 'grosir' : 'eceran'] += int(i.line_total); });
  const methods = { tunai: 0, transfer: 0, qris: 0, hutang: 0 };
  ok.forEach(s => { methods[s.payment_method] = (methods[s.payment_method] || 0) + int(s.total); });
  const purchases = d.purchases.filter(p => !isAdjustRow(p));
  const agg = new Map();
  items.forEach(i => {
    const k = String(i.product_id);
    const a = agg.get(k) || { id: i.product_id, name: i.name, qty: 0, omzet: 0, laba: 0 };
    a.qty += num(i.qty); a.omzet += int(i.line_total); a.laba += int(i.line_profit); agg.set(k, a);
  });
  const prods = [...agg.values()].map(a => Object.assign(a, { qty: roundQty(a.qty), unit: (prodById(a.id) || {}).unit || '', margin: a.omzet ? a.laba / a.omzet * 100 : 0 }));
  const active = S.products.filter(p => p.active !== false);
  const slow = active.map(p => ({ id: p.id, name: p.name, unit: p.unit, stock: p.stock, qty: (agg.get(String(p.id)) || { qty: 0 }).qty })).sort((a, b) => a.qty - b.qty || a.name.localeCompare(b.name)).slice(0, 10);
  // series
  const single = from === to;
  let buckets = [];
  if (single) {
    const hours = ok.map(s => jktHour(s.sale_time));
    const lo = Math.min(8, ...hours), hi = Math.max(21, ...hours);
    for (let h = lo; h <= hi; h++) buckets.push({ key: h, label: String(h).padStart(2, '0'), omzet: 0, laba: 0 });
    ok.forEach(s => { const b = buckets.find(x => x.key === jktHour(s.sale_time)); if (b) { b.omzet += s.total; b.laba += int(s.profit); } });
  } else {
    const days = daysBetween(from, to) + 1;
    const byMonth = days > 62;
    if (byMonth) { let m = monthStart(from); while (m <= to) { buckets.push({ key: m.slice(0, 7), label: m.slice(5, 7) + '/' + m.slice(2, 4), omzet: 0, laba: 0 }); m = addDays(monthEnd(m), 1); } }
    else for (let i = 0; i < days; i++) { const dt = addDays(from, i); buckets.push({ key: dt, label: dt.slice(8, 10) + '/' + dt.slice(5, 7), omzet: 0, laba: 0 }); }
    const idx = new Map(buckets.map(b => [b.key, b]));
    ok.forEach(s => { const b = idx.get(byMonth ? String(s.sale_date).slice(0, 7) : s.sale_date); if (b) { b.omzet += s.total; b.laba += int(s.profit); } });
  }
  // survey
  const sources = {}; SOURCE_RULES.forEach(([k]) => sources[k] = 0); sources.other = 0;
  const answers = [];
  ok.slice().sort((a, b) => String(b.sale_time).localeCompare(String(a.sale_time))).forEach(s => {
    parseSurvey(s.survey).forEach(x => {
      if (!x || !String(x.a || '').trim()) return;
      if (isSourceQuestion(x.q)) sources[classifySource(x.a)]++;
      answers.push({ q: x.q, a: x.a, time: s.sale_time, date: s.sale_date, customer: s.customer_name });
    });
  });
  return {
    from, to, hasProfit, omzet, laba, margin: omzet ? laba / omzet * 100 : 0, count, avg: count ? Math.round(omzet / count) : 0,
    split, methods, newDebt: sum(ok, s => int(s.debt_amount)), paymentsIn: sum(d.payments, p => int(p.amount)),
    purchasesTotal: sum(purchases, p => int(p.total)), purchasesCount: purchases.length, adjustCount: d.purchases.length - purchases.length,
    receivable: sum(S.customers, c => int(c.debt_balance)),
    topQty: prods.slice().sort((a, b) => b.qty - a.qty).slice(0, 10),
    topOmzet: prods.slice().sort((a, b) => b.omzet - a.omzet).slice(0, 10),
    topLaba: prods.slice().sort((a, b) => b.laba - a.laba).slice(0, 10),
    slow, lowStock: active.filter(isLow).sort((a, b) => a.stock - b.stock), buckets, single, sources, answers: answers.slice(0, 15),
    surveyCount: sum(Object.values(sources))
  };
}

function chartSVG(buckets, showLaba) {
  const W = 820, H = 250, padL = 58, padB = 28, padT = 12, padR = 8;
  const max = Math.max(1, ...buckets.map(b => Math.max(b.omzet, showLaba ? b.laba : 0)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const n = buckets.length, cw = (W - padL - padR) / Math.max(1, n), bw = Math.max(2, Math.min(28, cw * (showLaba ? 0.38 : 0.7)));
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  const ticks = [0, .25, .5, .75, 1].map(f => nice * f);
  const every = Math.ceil(n / 16);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('rep.chart'))}">`;
  ticks.forEach(tv => { s += `<line x1="${padL}" x2="${W - padR}" y1="${y(tv)}" y2="${y(tv)}" stroke="#E3E9E7"/><text x="${padL - 6}" y="${y(tv) + 4}" text-anchor="end" font-size="11" fill="#5B6B65">${esc(fmtShort(Math.round(tv)))}</text>`; });
  buckets.forEach((b, i) => {
    const x0 = padL + cw * i + cw / 2;
    const xo = showLaba ? x0 - bw - 1 : x0 - bw / 2;
    s += `<rect x="${xo}" y="${y(b.omzet)}" width="${bw}" height="${Math.max(0, y(0) - y(b.omzet))}" rx="2" fill="#0F7B5F"><title>${esc(b.label)} · ${esc(t('rep.omzet'))} ${esc(fmtRp(b.omzet))}</title></rect>`;
    if (showLaba) s += `<rect x="${x0 + 1}" y="${y(Math.max(0, b.laba))}" width="${bw}" height="${Math.max(0, y(0) - y(Math.max(0, b.laba)))}" rx="2" fill="#C8A24A"><title>${esc(b.label)} · ${esc(t('rep.profit'))} ${esc(fmtRp(b.laba))}</title></rect>`;
    if (i % every === 0) s += `<text x="${x0}" y="${H - 9}" text-anchor="middle" font-size="11" fill="#5B6B65">${esc(b.label)}</text>`;
  });
  return s + '</svg>';
}

async function saveSettings(partial, errEl) {
  try {
    const r = await api('save_settings', { settings: partial });
    S.settings = Object.assign({}, S.settings, r.settings || partial); saveCache();
    toast(t('saved'), 'ok'); renderShell(); return true;
  } catch (e) { if (errEl) errEl.textContent = errMsg(e); else toast(errMsg(e), 'err'); return false; }
}
async function saveUser(data, errEl) {
  try {
    const r = await api('save_user', data);
    upsertByName(S.users, r.user || data); saveCache();
    toast(t('saved'), 'ok'); RENDER.settings(); return true;
  } catch (e) { if (errEl) errEl.textContent = errMsg(e); else toast(errMsg(e), 'err'); return false; }
}
function upsertByName(arr, u) { const i = arr.findIndex(x => x.name.toLowerCase() === u.name.toLowerCase()); const clean = { name: u.name, role: u.role, active: u.active !== false }; if (i >= 0) arr[i] = clean; else arr.push(clean); }
function askNewPin(name) {
  return new Promise(resolve => {
    let done = false;
    const el = openModal({
      title: t('set.reset_pin') + ' — ' + name, cls: 'narrow',
      body: `<div class="field"><label class="f" for="rp-pin">${esc(t('pin'))}</label><input class="input" id="rp-pin" type="password" inputmode="numeric" maxlength="6" autofocus autocomplete="new-password"></div>
        <div class="field"><label class="f" for="rp-pin2">${esc(t('pin_again'))}</label><input class="input" id="rp-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div><div class="red" id="rp-err"></div>`,
      foot: `<button class="btn" data-act="modal-close">${esc(t('cancel'))}</button><button class="btn primary" id="rp-ok">${esc(t('save'))}</button>`,
      onClose: () => { if (!done) resolve(null); }
    });
    $('#rp-ok', el).onclick = () => {
      const a = $('#rp-pin', el).value, b = $('#rp-pin2', el).value;
      const err = pinError(a, b); if (err) { $('#rp-err', el).textContent = err; return; }
      done = true; closeModal(); resolve(a);
    };
  });
}
function pinError(a, b) { if (!/^\d{4,6}$/.test(a)) return t('login.pin_len'); if (a !== b) return t('pin_mismatch'); return ''; }

/* ========== Actions (event delegation) ========== */
const ACT = {
  'go': el => { go(el.dataset.view); },
  'toggle-lang': () => setLang(S.lang === 'ar' ? 'id' : 'ar'),
  'set-lang': el => setLang(el.dataset.lang),
  'lock': () => lock(),
  'modal-close': () => closeModal(),
  'refresh-data': async () => { if (await refreshData()) toast(t('set.data_reloaded'), 'ok'); },
  'logout-store': async () => { const r = await confirmBox(t('set.logout_confirm'), { danger: true }); if (r.ok) logoutStore(); },
  'mock-reset': async () => { const r = await confirmBox(t('set.mock_reset') + '?', { danger: true }); if (!r.ok) return; MockServer.reset(); try { Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k)); } catch (e) { } location.reload(); },

  /* login */
  'login-key': async () => {
    const k = ($('#lg-key') || {}).value; const key = String(k || '').trim();
    if (!key) { L.err = t('required'); renderLogin(); return; }
    L.busy = true; L.err = ''; renderLogin();
    try {
      const r = await apiRaw('users', {}, { key });
      if (S.key !== key) { store.del('cache'); S.products = []; S.customers = []; }
      S.key = key; store.set('key', key);
      L.users = r.users || []; store.set('users_' + key, L.users);
      L.busy = false; L.sel = L.users.length === 1 ? L.users[0].name : store.get('last_user', '');
      if (!L.users.some(u => u.name === L.sel)) L.sel = L.users.length === 1 ? L.users[0].name : '';
      L.step = L.users.length ? 'pin' : 'setup'; L.pin = '';
      renderLogin();
    } catch (e) { L.busy = false; L.err = e.code === 'BAD_KEY' ? t('err.BAD_KEY') : errMsg(e); renderLogin(); }
  },
  'login-setup': async () => {
    const name = $('#su-name').value.trim(), a = $('#su-pin').value, b = $('#su-pin2').value;
    if (!name) { L.err = t('required') + ': ' + t('setup.owner_name'); renderLoginKeep(); return; }
    const pe = pinError(a, b); if (pe) { L.err = pe; renderLoginKeep(); return; }
    L.busy = true; L.err = '';
    try {
      const hash = await pinHash(S.key, name, a);
      const r = await apiRaw('setup', { owner_name: name, pin_hash: hash }, { key: S.key });
      const u = r.user || { name, role: 'owner' };
      L.users = [{ name: u.name, role: 'owner' }]; store.set('users_' + S.key, L.users);
      const pins = store.get('pins', {}); pins[u.name.toLowerCase()] = { h: hash, role: 'owner' }; store.set('pins', pins);
      startSession(u.name, 'owner', hash, false);
      toast(t('setup.done'), 'ok');
    } catch (e) { L.busy = false; L.err = errMsg(e); renderLoginKeep(); }
  },
  'login-change-key': () => { L.users = []; L.sel = ''; S.inApp = false; L.step = 'key'; L.err = ''; renderLogin(); },
  'login-user': el => { L.sel = el.dataset.name; L.pin = ''; L.err = ''; renderLogin(); },
  'pin-key': el => {
    const k = el.dataset.k;
    if (k === 'del') L.pin = L.pin.slice(0, -1);
    else if (k === 'ok') { submitPin(); return; }
    else if (L.pin.length < 6) L.pin += k;
    L.err = ''; renderLogin();
  },

  'qty-dec': el => { const i = +el.dataset.i, l = S.cart.lines[i]; const nq = l.qty > 1 ? roundQty(Math.ceil(l.qty - 1e-9) - 1) : 0; if (nq <= 0) S.cart.lines.splice(i, 1); else l.qty = nq; saveCart(); renderCart(); },

  'checkout': () => checkout(),
  'cam-scan': () => cameraScan(code => { const p = findBySku(code); if (p) addToCart(p); else toast(t('pos.barcode_nf', { code }), 'err'); }),
  'rc-print': el => { const m = el.closest('.modal-bg'); if (m && m._rc) printReceipt(m._rc); },
  'rc-copy': async el => { const m = el.closest('.modal-bg'); if (!m || !m._rc) return; const ok = await copyText(receiptText(m._rc)); toast(ok ? t('copied') : t('copy_failed'), ok ? 'ok' : 'err'); },
  'void-sale': el => voidSale(el.dataset.inv),

  /* products */
  'import-csv': () => openImport(),
  'prod-new': () => openProductEditor(null),
  'prod-edit': (el, e) => { if (e.target.closest('[data-act="stock-adj"]')) return; openProductEditor(prodById(el.dataset.id)); },
  'stock-adj': el => openStockAdjust(prodById(el.dataset.id)),

  /* purchases */
  'pu-add': el => puAdd(prodById(el.dataset.id)),
  'pu-del': el => { PU.lines.splice(+el.dataset.i, 1); savePuDraft(); RENDER.purchases(); },
  'pu-clear': () => { PU.lines = []; PU.result = null; savePuDraft(); RENDER.purchases(); },
  'pu-save': () => savePurchase(),

  /* customers */
  'cust-new': () => openCustomerEditor(null),
  'cust-open': el => openCustomerDetail(custById(el.dataset.id)),
  'cust-pay': el => openPayment(custById(el.dataset.id)),
  'cust-edit': el => openCustomerEditor(custById(el.dataset.id), c => { closeModal(); openCustomerDetail(c); }),

  /* history */
  'hist-load': () => { Object.keys(salesCache).forEach(k => delete salesCache[k]); loadHistory(); },
  'hist-preset': el => { [HI.from, HI.to] = presetRange(el.dataset.p); RENDER.history(); },
  'hist-open': el => {
    const inv = el.dataset.inv;
    const sources = [HI.data].concat(Object.values(salesCache).map(c => c.data)).filter(Boolean);
    for (const d of sources) { const s = d.sales.find(x => x.invoice_no === inv); if (s) { showReceipt(rcFromSale(s, d.items), { sale: s }); return; } }
  },
  'outbox-open': el => { const e = S.outbox.find(x => x.client_id === el.dataset.cid); if (e) showReceipt(e.rc); },

  /* reports */
  'rep-load': () => loadReport(),
  'rep-preset': el => { RP.preset = el.dataset.p; [RP.from, RP.to] = presetRange(RP.preset); RENDER.reports(); },
  'rep-copy': el => copyReport(el.dataset.kind),
  'rep-print': () => printReport(),

  /* settings */
  'set-save-store': () => {
    const paper = ($('#st-paper .on') || {}).dataset ? $('#st-paper .on').dataset.p : '58';
    saveSettings({ store_name: $('#st-name').value.trim() || 'Khair Mart', address: $('#st-addr').value.trim(), phone: $('#st-phone').value.trim(), receipt_footer: $('#st-foot').value, paper }, $('#st-err'));
  },
  'sq-up': el => { const i = +el.dataset.i; [ST.qs[i - 1], ST.qs[i]] = [ST.qs[i], ST.qs[i - 1]]; RENDER.settings(); },
  'sq-down': el => { const i = +el.dataset.i; [ST.qs[i + 1], ST.qs[i]] = [ST.qs[i], ST.qs[i + 1]]; RENDER.settings(); },
  'sq-del': el => { ST.qs.splice(+el.dataset.i, 1); RENDER.settings(); },
  'sq-add': () => { const v = $('#st-q-new').value.trim(); if (!v) return; ST.qs.push(v); RENDER.settings(); const n = $('#st-q-new'); if (n) n.focus(); },
  'sq-reset': () => { ST.qs = DEFAULT_SURVEY.slice(); RENDER.settings(); },
  'set-save-survey': () => saveSettings({ survey_questions: ST.qs.slice(), survey_auto: $('#st-sv-auto').checked }, $('#st-sv-err')),
  'user-add': async () => {
    const name = $('#nu-name').value.trim(), role = $('#nu-role').value, a = $('#nu-pin').value, b = $('#nu-pin2').value, err = $('#nu-err');
    if (!name) { err.textContent = t('required') + ': ' + t('name'); return; }
    if (S.users.some(u => u.name.toLowerCase() === name.toLowerCase())) { err.textContent = t('set.user_exists'); return; }
    const pe = pinError(a, b); if (pe) { err.textContent = pe; return; }
    saveUser({ name, role, pin_hash: await pinHash(S.key, name, a), active: true }, err);
  },
  'user-pin': async el => {
    const u = S.users.find(x => x.name === el.dataset.name); if (!u) return;
    const pin = await askNewPin(u.name); if (!pin) return;
    const hash = await pinHash(S.key, u.name, pin);
    if (await saveUser({ name: u.name, role: u.role, pin_hash: hash, active: u.active !== false }) && u.name.toLowerCase() === S.user.toLowerCase()) {
      S.pin_hash = hash; store.set('session', { user: S.user, role: S.role, pin_hash: hash });
      const pins = store.get('pins', {}); pins[S.user.toLowerCase()] = { h: hash, role: S.role }; store.set('pins', pins);
    }
  },
  'user-toggle': async el => {
    const u = S.users.find(x => x.name === el.dataset.name); if (!u) return;
    if (u.active !== false) { const r = await confirmBox(t('set.deactivate_confirm', { name: u.name }), { danger: true }); if (!r.ok) return; }
    saveUser({ name: u.name, role: u.role, active: u.active === false });
  },
  'outbox-sync': () => syncOutbox(true),
  'outbox-copy': async () => { const ok = await copyText(JSON.stringify(S.outbox.map(e => e.req), null, 1)); toast(ok ? t('copied') : t('copy_failed'), ok ? 'ok' : 'err'); }
};
function renderLoginKeep() {
  const keep = {}; ['su-name', 'su-pin', 'su-pin2'].forEach(id => { const e = $('#' + id); if (e) keep[id] = e.value; });
  renderLogin();
  Object.entries(keep).forEach(([id, v]) => { const e = $('#' + id); if (e) e.value = v; });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(errMsg(err), 'err'); });
});
document.addEventListener('keydown', e => {
  if (!$('#login').hidden && L.step === 'pin' && !modalOpen()) {
    if (/^\d$/.test(e.key)) { if (L.pin.length < 6) { L.pin += e.key; L.err = ''; renderLogin(); } e.preventDefault(); return; }
    if (e.key === 'Backspace') { L.pin = L.pin.slice(0, -1); renderLogin(); e.preventDefault(); return; }
    if (e.key === 'Enter') { submitPin(); e.preventDefault(); return; }
  }
  if (e.key === 'Escape' && modalOpen()) { e.preventDefault(); closeModal(); return; }
  if (!S.inApp || $('#app').hidden || modalOpen()) return;
  if (S.view === 'pos') {
    if (e.key === 'F9') { e.preventDefault(); checkout(); return; }
    if (e.key === 'F2') { e.preventDefault(); const s = $('#pos-search'); if (s) s.focus(); return; }
    const a = document.activeElement;
    const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable);
    if (!typing && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { const s = $('#pos-search'); if (s) { s.focus(); } }
  }
});
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!isPhone()) closeCartSheet(); }, 150); });

/* ========== Boot ========== */
async function init() {
  applyLangAttrs();
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href) && !/[?&]nosw\b/.test(location.search)) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  if (MOCK) { try { await MockServer.ensure(); } catch (e) { console.error(e); } }
  const sess = store.get('session');
  if (S.key && sess && sess.user && sess.pin_hash) { S.user = sess.user; S.role = sess.role; S.pin_hash = sess.pin_hash; enterApp(false); return; }
  if (S.key) { if (sess && sess.user) { L.sel = sess.user; } showLogin('pin'); return; }
  showLogin('key');
}
window.KPOS = { S, MOCK, computeReport, parseCSV, guessMapping, parseNum, syncOutbox, cartView, pinHash, sha256Fallback };
init();
</script>
