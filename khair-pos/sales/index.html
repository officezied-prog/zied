<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E40AF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khair Sales">
<meta name="description" content="Khair Sales — aplikasi sales lapangan Khair Mart">
<title>Khair Sales</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>

/* ========== Tokens (store logo: blue + red) ========== */
:root{
  --p:#1E40AF; --pd:#1E3A8A; --pt:#DBEAFE; --pll:#EFF6FF;
  --red:#DC2626; --redd:#B91C1C; --redt:#FEE2E2;
  --ok:#0F766E; --okt:#CCFBF1; --warn:#B45309; --warnt:#FEF3C7;
  --bg:#F1F5F9; --card:#FFFFFF; --text:#0F172A; --muted:#475569; --line:#E2E8F0; --line2:#CBD5E1;
  --r:14px; --rs:10px; --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.06); --shadow-l:0 12px 40px rgba(15,23,42,.25);
  --top:56px; --tabs:64px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic","Geeza Pro",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
a{color:var(--p)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13.5px} .red{color:var(--red)} .okc{color:var(--ok)}
.center{text-align:center} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px} .row.wrap{flex-wrap:wrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========== Controls ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--card);font-weight:700;line-height:1.1;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--pll)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn.primary:hover{background:var(--pd)}
.btn.danger{color:var(--redd);border-color:#FCA5A5}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.xs{min-height:34px;padding:0 10px;font-size:14px;border-radius:8px}
.btn.big{min-height:58px;font-size:18px}
.btn.block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--card);padding:0;flex:none}
.icon-btn.ghost{border-color:transparent;background:transparent}
.icon-btn.sm{width:40px;height:40px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--rs);background:#fff;font-size:16px}
textarea.input{min-height:48px;resize:vertical}
.input:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px rgba(30,64,175,.2)}
.input.num{text-align:end}
.input.money{font-size:22px;font-weight:800;text-align:end}
label.f{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:flex-start;gap:10px;min-height:48px;padding:10px 12px;cursor:pointer;background:var(--pll);border-radius:var(--rs);margin-bottom:12px}
.check input{width:24px;height:24px;accent-color:var(--p);flex:none;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:52px;border-radius:var(--rs);border:1px solid var(--line2);background:#fff;font-weight:800;font-size:15px;padding:0 4px}
.seg button.on{background:var(--p);color:#fff;border-color:var(--p)}
.seg button:disabled{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:15px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--pt);color:var(--pd);white-space:nowrap}
.badge.red{background:var(--redt);color:var(--redd)}
.badge.ok{background:var(--okt);color:var(--ok)}
.badge.warn{background:var(--warnt);color:var(--warn)}
.badge.gray{background:#E2E8F0;color:#334155}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);min-height:64px;text-align:start;width:100%;color:var(--text)}
button.li:hover{border-color:var(--p)}
.li .t{font-weight:800}
.li .s{font-size:13.5px;color:var(--muted)}
.li > svg.i{color:var(--p)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}

/* ========== Shell ========== */
#app{display:grid;grid-template-rows:var(--top) 1fr var(--tabs);height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;background:var(--p);color:#fff;z-index:20;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;position:relative}
.mark::after{content:"";position:absolute;inset-inline-end:-3px;bottom:-3px;width:12px;height:12px;border-radius:4px;background:var(--red);border:2px solid var(--p)}
.top .ttl{min-width:0;line-height:1.15}
.top .ttl b{display:block;font-size:16px}
.top .ttl span{font-size:13px;opacity:.9}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:14px;white-space:nowrap}
.pill b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12.5px;padding:0 6px}
.pill.warn{background:#FEF3C7;color:#78350F}
.top .icon-btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;width:42px;height:42px}
.demo{background:#FEF3C7;color:#78350F;border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:900}
main{overflow:hidden;position:relative;min-width:0}
.view{height:100%;overflow-y:auto;padding:14px 14px 28px}
.view.sell{padding:0;overflow:hidden}
.wrapc{max-width:760px;margin:0 auto}
.view h1{font-size:21px;margin:2px 0 12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(15,23,42,.05);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:800;position:relative;min-width:0;padding:4px 2px}
.tab span{max-width:100%;overflow:hidden;line-height:1.1;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tab.on{color:var(--p)}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--p)}
.tab .dot{position:absolute;top:6px;inset-inline-end:calc(50% - 24px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}


/* ========== Modal / toast ========== */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .12s}
.modal{background:#fff;width:100%;max-width:560px;max-height:94dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:18px 18px 0 0;box-shadow:var(--shadow-l)}
.modal-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1;margin:0;font-size:19px}
.modal-b{padding:14px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#F8FAFC}
@media (min-width:700px){ .modal-bg{align-items:center;padding:16px} .modal{border-radius:18px;max-height:calc(100dvh - 32px)} }
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + 86px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#0F172A;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-l);font-weight:700;font-size:15px;animation:fade .15s;text-align:center}
.toast.err{background:var(--redd);color:#fff;margin:0;min-height:0;text-align:center} .toast.ok{background:#134E4A} .toast.warn{background:#78350F}

/* ========== Login / gate ========== */
.screen{position:fixed;inset:0;background:linear-gradient(165deg,#1E40AF 0%,#1E3A8A 70%);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.screen-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-l);width:100%;max-width:420px;padding:20px 18px;margin:auto}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:21px;margin-bottom:14px}
.brand .mark{background:var(--p);color:#fff}
.brand .mark::after{border-color:#fff}
.screen-card h2{text-align:center;font-size:19px;margin:0 0 14px}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.users button{min-height:72px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.users button span{font-size:12.5px;font-weight:700;color:var(--muted)}
.users button:hover{border-color:var(--p)}
.who{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.who b{font-size:21px}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 14px;min-height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--p);display:block}
.dots i.f{background:var(--p)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:64px;border-radius:14px;border:1px solid var(--line);background:#F8FAFC;font-size:26px;font-weight:800;color:var(--text)}
.pinpad button:active{background:var(--pt)}
.pinpad button.ok{background:var(--p);color:#fff;font-size:18px}
.err{color:var(--redd);text-align:center;font-weight:700;min-height:22px;margin:6px 0}
.foot-links{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.langs{display:flex;gap:6px}
.owner-link{font-weight:800;text-decoration:none;padding:8px 4px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick .btn{flex:1 0 auto}


.search{position:relative;flex:1}
.search svg.i{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-inline-start:44px}
.cust-chip{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:2px dashed var(--line2);background:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;text-align:start;color:var(--text)}
.cust-chip.set{border-style:solid;border-color:var(--p);background:var(--pll);color:var(--pd)}
.qty{display:flex;align-items:center;border:2px solid var(--line2);border-radius:12px;overflow:hidden;flex:none}
.qty button{width:42px;height:42px;border:0;background:var(--pll);font-size:22px;font-weight:900;color:var(--p)}
.qty input{width:52px;height:42px;border:0;text-align:center;font-weight:900;font-size:16px}
.pt{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#E2E8F0;color:#334155}
.pt.grosir{background:var(--pt);color:var(--pd)}
.total-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:22px;color:var(--pd)}
.btn.wrapt{white-space:normal;text-align:center;line-height:1.15}
.hero-actions{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:520px){ .hero-actions{grid-template-columns:2fr 1fr} }
@media (max-width:420px){ .top .demo{display:none} }
.li .btn.xs svg.i{width:16px;height:16px}
/* ========== Khair Sales ========== */
.tabs{grid-template-columns:repeat(5,1fr)}
.tab{font-size:12px}
.gps{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:999px;background:#fff;color:var(--pd);font-weight:900;font-size:13px;white-space:nowrap}
.gps i{width:9px;height:9px;border-radius:50%;background:var(--red);display:block;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.hero{border-radius:18px;padding:16px;background:linear-gradient(150deg,#1E40AF,#1E3A8A);color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0 0 12px;opacity:.92}
.hero .btn{background:#fff;color:var(--pd);border:0}
.hero .btn.red{background:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12.5px;opacity:.9}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.map{width:100%;height:220px;border-radius:14px;overflow:hidden;background:#E8EEF8;border:1px solid var(--line);position:relative}
.map.tall{height:340px}
.map svg{width:100%;height:100%;display:block}
.map .note{position:absolute;bottom:6px;inset-inline-start:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px}
.shop-li .dist{font-weight:900;color:var(--pd);white-space:nowrap}
.status-chip{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.status-chip.pelanggan{background:var(--okt);color:var(--ok)}
.status-chip.prospek{background:var(--warnt);color:var(--warn)}
.step-h{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;margin-bottom:10px}
.step-h .n{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.fix{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--pll);font-weight:700}
.fix.bad{background:var(--warnt);color:var(--warn)}
.fix.err{background:var(--redt);color:var(--redd)}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{min-height:46px;padding:0 14px;border-radius:999px;border:2px solid var(--line2);background:#fff;font-weight:800}
.opt button.on{background:var(--p);border-color:var(--p);color:#fff}
.photo-prev{width:120px;height:120px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--pll)}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .cat-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))} }
.pcard{display:flex;flex-direction:column;text-align:start;border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--shadow);padding:0;color:var(--text)}
.pimg{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:linear-gradient(140deg,#DBEAFE,#BFDBFE)}
.pimg.ph{display:grid;place-items:center;font-size:44px;font-weight:900;color:var(--p)}
.pcard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard .nm{font-weight:800;font-size:15px;line-height:1.25;min-height:38px}
.pcard .pr{font-weight:900;font-size:17px;color:var(--pd)}
.pcard .gr{font-size:12.5px;color:var(--muted);font-weight:700}
.stock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;align-self:flex-start}
.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stock.ada{background:var(--okt);color:var(--ok)} .stock.sedikit{background:var(--warnt);color:var(--warn)} .stock.habis{background:var(--redt);color:var(--redd)}
#present{position:fixed;inset:0;z-index:150;background:#0B1533;color:#fff;display:flex;flex-direction:column;touch-action:pan-y}
#present .ph-top{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px) 14px;padding-top:calc(10px + env(safe-area-inset-top))}
#present .ph-top .icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff}
#present .stage{flex:1;display:flex;flex-direction:column;align-items:center;overflow-y:auto;justify-content:center;padding:6px 18px;min-height:0;overflow:hidden}
#present .pbig{width:min(88vw,520px,52vh);flex:none;aspect-ratio:4/3;border-radius:22px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,.45);background:#1E3A8A;display:grid;place-items:center;font-size:90px;font-weight:900}
#present h2{font-size:26px;margin:18px 0 6px;text-align:center;line-height:1.2}
#present .prices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
#present .price{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 16px;text-align:center}
#present .price b{display:block;font-size:24px}
#present .price span{font-size:13px;opacity:.85}
#present .dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
#present .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
#present .dots i.on{background:#fff;width:20px;border-radius:4px}
#present .ph-foot{display:flex;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
#present .ph-foot .btn{flex:1;border:0}
#present .nav{position:absolute;top:45%;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;font-weight:900}
#present .nav.prev{inset-inline-start:10px} #present .nav.next{inset-inline-end:10px}
[dir="rtl"] #present .nav{transform:scaleX(-1)}
.oline{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.oline > .grow{flex-basis:100%}
.oline > .num{margin-inline-start:auto}
.oline:last-child{border-bottom:0}
.ostatus{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#E2E8F0;color:#334155}
.ostatus.baru{background:var(--pt);color:var(--pd)} .ostatus.diproses{background:var(--warnt);color:var(--warn)} .ostatus.dikirim{background:var(--okt);color:var(--ok)} .ostatus.batal{background:var(--redt);color:var(--redd)} .ostatus.pending{background:#FEF3C7;color:#78350F}
.consent-list{padding-inline-start:20px;margin:8px 0} .consent-list li{margin:6px 0}
.leaflet-container{font:inherit}
</style>

const NF = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });

/** Parse "Rp 12.500", "12.500", "12,500.50", "1,5" … to a number (Indonesian-aware). */

  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim().replace(/rp\.?/i, '').replace(/idr/i, '').replace(/[\s ]/g, '');

  if (lastDot >= 0 && lastCom >= 0) {
    const dec = lastDot > lastCom ? '.' : ',';
    const thou = dec === '.' ? ',' : '.';
    s = s.split(thou).join('').replace(dec, '.');
  } else if (lastCom >= 0) {

function fmtDate(ymd) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd || '')); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(ymd || ''); }

/* ========== IDs & hashing ========== */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }

  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
  const bits = len * 8; for (let i = 0; i < 4; i++) m[total - 1 - i] = (bits >>> (8 * i)) & 255;
  m[total - 5] = Math.floor(bits / 2 ** 32) & 255;
  const W = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = (m[o + 4 * i] << 24) | (m[o + 4 * i + 1] << 16) | (m[o + 4 * i + 2] << 8) | m[o + 4 * i + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(W[i - 15], 7) ^ r(W[i - 15], 18) ^ (W[i - 15] >>> 3), s1 = r(W[i - 2], 17) ^ r(W[i - 2], 19) ^ (W[i - 2] >>> 10); W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }

async function sha256Hex(str) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { }
  return sha256Fallback(str);
}
const pinHash = (key, user, pin) => sha256Hex(`${key}:${String(user).toLowerCase()}:${pin}`);

/** Phone → wa.me number (62…). */
function waNumber(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';

  else if (d.startsWith('8')) d = '62' + d;

}

/* ========== API client (copied from the owner app) ========== */
class ApiError extends Error { constructor(code, message) { super(message || code); this.code = code || 'SERVER'; } }
class NetError extends Error { constructor(message) { super(message || 'NETWORK'); this.code = 'NETWORK'; } }
/** Only real network failures/timeouts are queued; an {ok:false} answer is shown, never queued. */
const isRetryable = e => e instanceof NetError;

let inflight = 0;
function setBusy(d) { inflight = Math.max(0, inflight + d); document.body.classList.toggle('busy', inflight > 0); }
async function apiRaw(action, data, cred, opts = {}) {
  setBusy(1);
  try { return await apiRawInner(action, data, cred, opts); } finally { setBusy(-1); }
}
async function apiRawInner(action, data, cred, opts) {
  const body = { action, key: cred.key };
  if (cred.user) body.user = cred.user;
  if (cred.pin_hash) body.pin_hash = cred.pin_hash;
  body.data = data || {};
  let res;
  if (MOCK) {
    res = await MockServer.request(clone(body));
  } else {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), opts.timeout || 20000);
    let r, txt;
    try {
      r = await fetch(FIELD_ACTIONS.includes(action) ? CONFIG.FIELD_URL : opts.photo ? CONFIG.PHOTO_URL : CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' });

      if (r.status >= 500 || r.status === 404 || r.status === 0) throw new NetError('HTTP ' + r.status);

/** Authenticated call with the current session; BAD_PIN / BAD_KEY send the user back to login. */
const sessCred = () => ({ key: S.key, user: S.user, pin_hash: S.pin_hash });
async function api(action, data, opts) {

}

}

/* ========== Mock backend (?mock=1) — copied from the cashier app (same localStorage DB key kmock.db); v8 field actions are routed to ../shared/field-mock.js ========== */

  const CHANNELS = ['toko', 'whatsapp', 'shopee', 'tiktok', 'tokopedia', 'web', 'lainnya'];

}

function applyData(d) {

  if (Array.isArray(d.shops)) S.shops = d.shops.concat(S.shops.filter(s => s.pending && !d.shops.some(x => x.shop_id === s.shop_id)));
  if (Array.isArray(d.customers)) S.customers = d.customers;
  if (d.settings) S.settings = d.settings;
  if (d.day) setDay(d.day, true);

}
function setDay(day, quiet) { S.day = Object.assign({ status: 'off' }, day); FS.set(uk('day'), S.day); if (!quiet && S.inApp) updateGpsIndicator(); }
function saveCache() { FS.set('cache', { products: S.products, shops: S.shops.filter(s => !s.pending), customers: S.customers, settings: S.settings, images_version: S.imagesVersion }); }
async function refreshData(quiet) {

    const pendingShops = S.outbox.filter(e => e.action === 'check_in' && e.tmp_shop).map(e => e.local_shop).filter(Boolean);

/* ========== Product images (cached by image_updated in IndexedDB, memory fallback) ========== */
const IMG = { mem: {}, db: null, loading: false };
function idb() {
  if (IMG.db) return IMG.db;
  IMG.db = new Promise(res => {
    try { const rq = indexedDB.open('khair-sales', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('img'); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); } catch (e) { res(null); }
  });
  return IMG.db;
}
async function idbGet(k) { const d = await idb(); if (!d) return null; return new Promise(res => { try { const r = d.transaction('img').objectStore('img').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } }); }
async function idbPut(k, v) { const d = await idb(); if (!d) return; return new Promise(res => { try { const tx = d.transaction('img', 'readwrite'); tx.objectStore('img').put(v, k); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } }); }
/** base64 without prefix → data URL (JPEG "/9j/", PNG "iVBOR", SVG "PHN2Zy"/"PD94"). */
function b64Url(b) { b = String(b || ''); if (b.startsWith('data:')) return b; const mime = b.startsWith('/9j/') ? 'image/jpeg' : b.startsWith('iVBOR') ? 'image/png' : b.startsWith('UklGR') ? 'image/webp' : (b.startsWith('PHN2Zy') || b.startsWith('PD94')) ? 'image/svg+xml' : 'image/jpeg'; return `data:${mime};base64,${b}`; }
async function loadImages() {
  if (IMG.loading) { IMG.again = true; return; } IMG.loading = true; IMG.again = false;
  try {
    const need = []; let got = 0;
    for (const p of S.products.filter(p => p.image_updated)) {
      const m = IMG.mem[p.id];
      if (m && m.u === p.image_updated) continue;
      const c = await idbGet('p' + p.id);
      if (c && c.u === p.image_updated) { IMG.mem[p.id] = c; got++; continue; }
      need.push(p.id);
    }
    if (need.length) {
      const r = await api('product_images', { ids: need });
      for (const im of r.images || []) {
        const p = prodById(im.product_id); if (!p) continue;
        const v = { u: p.image_updated || im.image_updated || '', d: b64Url(im.image_base64) };
        IMG.mem[p.id] = v; await idbPut('p' + p.id, v);
      }
      FS.set('img_fetches', (FS.get('img_fetches', 0) || 0) + 1);
      got++;
    }
    if (got && S.view === 'catalog') drawCatalogGrid();
    if (got && $('#present')) drawPresent();
  } catch (e) { } finally { IMG.loading = false; if (IMG.again) loadImages(); }
}
const imgOf = p => (IMG.mem[p.id] && IMG.mem[p.id].d) || '';
function imgHTML(p, cls) { const d = imgOf(p); return d ? `<img class="${cls}" src="${esc(d)}" alt="${esc(p.name)}" data-img="${esc(p.id)}" loading="lazy">` : `<div class="${cls} ph" aria-hidden="true">${esc(String(p.name || '?').trim().charAt(0))}</div>`; }

/* ========== Map: Leaflet (cdnjs + OSM) when available, SVG plot otherwise ========== */
const MAPS = { failed: false };
function renderMap(el, { points = [], shops = [], current = null, tall = false }) {
  if (!el) return;
  el.className = 'map' + (tall ? ' tall' : '');
  const useLeaflet = window.L && navigator.onLine && !MAPS.failed;
  if (useLeaflet) { try { return leafletMap(el, points, shops, current); } catch (e) { MAPS.failed = true; } }
  svgMap(el, points, shops, current);
}
function leafletMap(el, points, shops, current) {
  el.dataset.mode = 'leaflet'; el.innerHTML = '';
  const m = window.L.map(el, { zoomControl: false, attributionControl: true });
  let errs = 0, loaded = 0;
  const tiles = window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  tiles.on('tileload', () => { loaded++; });
  tiles.on('tileerror', () => { if (++errs >= 3 && !loaded) { MAPS.failed = true; try { m.remove(); } catch (e) { } svgMap(el, points, shops, current); } });
  const ll = [];
  if (points.length > 1) { const line = points.map(p => [p.lat, p.lng]); window.L.polyline(line, { color: '#1E40AF', weight: 4 }).addTo(m); ll.push(...line); }
  shops.forEach(s => { if (!validPos(s)) return; ll.push([s.lat, s.lng]); window.L.circleMarker([s.lat, s.lng], { radius: 7, color: '#fff', weight: 2, fillColor: s.status === 'pelanggan' ? '#0F766E' : '#DC2626', fillOpacity: 1 }).bindTooltip(s.name).addTo(m); });
  if (validPos(current)) { ll.push([current.lat, current.lng]); window.L.circleMarker([current.lat, current.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1E40AF', fillOpacity: 1 }).addTo(m); }
  if (ll.length) m.fitBounds(ll, { padding: [24, 24], maxZoom: 17 }); else m.setView([-6.2655, 106.8605], 14);
}
function svgMap(el, points, shops, current) {
  el.dataset.mode = 'svg';
  const all = points.concat(shops.filter(validPos)).concat(validPos(current) ? [current] : []);
  if (!all.length) { el.innerHTML = `<div class="empty" style="padding-top:80px">${esc(t('map.empty'))}</div>`; return; }
  let minLat = Math.min(...all.map(p => p.lat)), maxLat = Math.max(...all.map(p => p.lat)), minLng = Math.min(...all.map(p => p.lng)), maxLng = Math.max(...all.map(p => p.lng));
  const k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  let w = Math.max((maxLng - minLng) * k, 0.002), h = Math.max(maxLat - minLat, 0.002);
  const W = 400, Hh = el.classList.contains('tall') ? 340 : 220, pad = 18;
  const sc = Math.min((W - 2 * pad) / w, (Hh - 2 * pad) / h);
  const cx = (minLng + maxLng) / 2, cy = (minLat + maxLat) / 2;
  const X = p => (W / 2 + (p.lng - cx) * k * sc).toFixed(1), Y = p => (Hh / 2 - (p.lat - cy) * sc).toFixed(1);
  const grid = Array.from({ length: 9 }, (_, i) => `<path d="M${i * 50} 0V${Hh}M0 ${i * 50}H${W}" stroke="#D5DEEC" stroke-width="1"/>`).join('');
  const line = points.length > 1 ? `<polyline points="${points.map(p => X(p) + ',' + Y(p)).join(' ')}" fill="none" stroke="#1E40AF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>` : '';
  const start = points.length ? `<circle cx="${X(points[0])}" cy="${Y(points[0])}" r="5" fill="#fff" stroke="#1E40AF" stroke-width="3"/>` : '';
  const sh = shops.filter(validPos).map(s => `<g data-shop="${esc(s.shop_id)}"><circle cx="${X(s)}" cy="${Y(s)}" r="7" fill="${s.status === 'pelanggan' ? '#0F766E' : '#DC2626'}" stroke="#fff" stroke-width="2"><title>${esc(s.name)}</title></circle></g>`).join('');
  const cur = validPos(current) ? `<circle cx="${X(current)}" cy="${Y(current)}" r="12" fill="#1E40AF" opacity=".18"/><circle cx="${X(current)}" cy="${Y(current)}" r="6" fill="#1E40AF" stroke="#fff" stroke-width="2.5"/>` : '';
  const kmw = (W - 2 * pad) / sc * 111.32 / k * k; // width of the box in km (approx.)
  el.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(t('map.label'))}"><rect width="${W}" height="${Hh}" fill="#EEF3FA"/>${grid}${line}${start}${sh}${cur}</svg><div class="note">${esc(t('map.offline'))} · ≈ ${NF1.format(kmw)} km</div>`;
}

/** ≤ 400 px, JPEG ~0.6, and at most 45 KB of base64. */
async function photoThumb(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = url; });
    for (const [max, q] of [[400, 0.6], [400, 0.5], [360, 0.45], [320, 0.4], [280, 0.35]]) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const b = c.toDataURL('image/jpeg', q).split(',')[1];
      if (b.length <= 45 * 1024) return b;
    }
    throw new Error('too big');
  } finally { URL.revokeObjectURL(url); }
}
async function takePhoto(file) {
  try { CI.photo = await photoThumb(file); CI.photoKB = Math.round(CI.photo.length / 1024); } catch (e) { toast(t('visit.photo_fail'), 'err'); }
  RENDER.visit();
}
async function saveCheckin() {
  const err = $('#ci-err'); err.textContent = '';

  if (CI.shop_id) shop = shopById(CI.shop_id);
  else if (CI.isNew) { shopData = Object.assign({ type: 'warung' }, CI.form); shopData.name = String(shopData.name || '').trim(); if (!shopData.name) { err.textContent = t('required') + ': ' + t('shop.name'); $('#ci-name').focus(); return; } }
  else { err.textContent = t('visit.pick_shop'); return; }
  if (!CI.outcome) { err.textContent = t('visit.pick_outcome'); return; }
  if (CI.photo && !CI.consent) { err.textContent = t('visit.need_consent'); return; }
  const data = { client_id: CI.client_id, lat: CI.fix.lat, lng: CI.fix.lng, acc: CI.fix.acc, outcome: CI.outcome, notes: (CI.notes || '').trim(), photo_consent: !!(CI.photo && CI.consent), at: new Date().toISOString() };
  if (shop && !String(shop.shop_id).startsWith('tmp:')) data.shop_id = shop.shop_id;
  else if (shop) data.shop_id = shop.shop_id; // pending new shop: resolved at sync
  else data.shop = shopData;
  if (CI.photo && CI.consent) data.photo_base64 = CI.photo;
  if (CI.next) data.next_visit = CI.next;
  CI.busy = true; $('#ci-ok').disabled = true;
  const localVisit = { client_id: data.client_id, visit_date: today(), visit_time: jktISO(), shop_id: shop ? shop.shop_id : 'tmp:' + data.client_id, shop_name: shop ? shop.name : shopData.name, outcome: data.outcome, lat: data.lat, lng: data.lng, pending: true };
  let result = null;
  if (S.day.status === 'working') keepPoint(Object.assign({}, CI.fix, { t: new Date().toISOString() }), true);
  try {
    if (String(resolveIds(data).shop_id || '').startsWith('tmp:')) throw new NetError('shop pending');
    const r = await api('check_in', resolveIds(data));
    result = r; upsertShop(r.shop); Object.assign(localVisit, r.visit, { pending: false });
  } catch (e) {
    if (!(e instanceof NetError)) { err.textContent = errMsg(e); CI.busy = false; $('#ci-ok').disabled = false; return; }
    const extra = { tmp_visit: 'tmp:v:' + data.client_id };
    if (!shop) { const ls = Object.assign({}, shopData, { shop_id: 'tmp:' + data.client_id, lat: data.lat, lng: data.lng, status: 'prospek', visits: 1, last_visit_at: localVisit.visit_time, next_visit: data.next_visit || '', pending: true, created_by: S.user }); S.shops.push(ls); extra.tmp_shop = ls.shop_id; extra.local_shop = ls; }
    else { shop.last_visit_at = localVisit.visit_time; if (data.next_visit) shop.next_visit = data.next_visit; }
    localVisit.visit_id = extra.tmp_visit;
    queueOp('check_in', data, extra);
    toast(t('outbox.queued'), 'warn', 4000);
  }
  const vs = FS.get(uk('visits'), []); vs.push(localVisit); FS.set(uk('visits'), vs.slice(-300));
  S.lastVisit = { visit_id: localVisit.visit_id, shop_id: localVisit.shop_id, at: Date.now() }; FS.set(uk('last_visit'), S.lastVisit);
  if (result) S.day.visits_today = int(S.day.visits_today) + 1;
  flushTrack();
  const outcome = data.outcome, sid = localVisit.shop_id, name = localVisit.shop_name;
  resetCheckin();

  if (outcome === 'order') { S.cart = Object.assign(newOrderCart(), { shop_id: sid, visit_id: localVisit.visit_id }); saveOrderCart(); go('order', true); }
  else go('today', true);

async function saveOrder() {
  const c = S.cart, err = $('#po-err');

  if (!shop) { err.textContent = t('order.pick_shop'); return; }
  if (!c.lines.length) { err.textContent = t('order.empty'); return; }
  const items = c.lines.map(l => { const p = prodById(l.product_id); const pr = priceFor(p, l.qty, shop); return { product_id: l.product_id, qty: roundQty(l.qty), unit_price: pr.unit_price, price_type: pr.price_type }; });
  const data = { client_id: c.client_id, shop_id: shop.shop_id, items, notes: (c.notes || '').trim() };
  if (c.visit_id) data.visit_id = c.visit_id;
  if (c.delivery_date) data.delivery_date = c.delivery_date;
  $('#po-ok').disabled = true;
  let order;
  try { if (String(resolveIds(data).shop_id || '').startsWith('tmp:')) throw new NetError('shop pending'); const r = await api('field_order', resolveIds(data)); order = r.order; upsertOrder(order); S.day.orders_today = int(S.day.orders_today) + 1; }
  catch (e) {
    if (!(e instanceof NetError)) { err.textContent = errMsg(e); $('#po-ok').disabled = false; return; }

  }

    title: order.pending ? t('order.queued_title') : t('order.saved_title', { id: order.order_id }), id: 'order-done',
    body: `<p style="margin-top:0"><b>${esc(order.shop_name)}</b>${order.delivery_date ? ' · ' + esc(t('order.deliver_on', { date: fmtDate(order.delivery_date) })) : ''}</p>

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(errMsg(err), 'err'); });
});
document.addEventListener('keydown', e => {
  if (!$('#login').hidden && L.step === 'pin' && !modalStack.length) {
    if (/^\d$/.test(e.key)) { if (L.pin.length < 6) { L.pin += e.key; L.err = ''; renderLogin(); } e.preventDefault(); return; }
    if (e.key === 'Backspace') { L.pin = L.pin.slice(0, -1); renderLogin(); e.preventDefault(); return; }
    if (e.key === 'Enter') { submitPin(); e.preventDefault(); return; }
  }
  if ($('#present')) { if (e.key === 'ArrowRight') presentStep(S.lang === 'ar' ? -1 : 1); else if (e.key === 'ArrowLeft') presentStep(S.lang === 'ar' ? 1 : -1); else if (e.key === 'Escape') closePresent(); return; }
  if (e.key === 'Escape' && modalStack.length) { e.preventDefault(); closeModal(); }
});

/* ========== Boot ========== */
async function init() {
  applyLangAttrs();
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href) && !/[?&]nosw\b/.test(location.search)) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
  }
  if (MOCK) { try { await MockServer.ensure(); } catch (e) { console.error(e); } }
  const sess = FS.get('session');
  if (S.key && sess && sess.user && sess.pin_hash) {
    S.user = sess.user; S.role = sess.role; S.pin_hash = sess.pin_hash;
    const cd = FS.get(uk('day')); if (cd && cd.day_date === today()) S.day = cd;
    enterApp(false); return;
  }
  const last = (sess && sess.user) || FS.get('last_user', '');
  if (S.key) { if (last) { L.sel = last; showLogin('pin'); } else showLogin('users'); return; }
  showLogin('key');
}
window.SALES = { S, TR, CI, CAT, flushTrack, syncOutbox, keepPoint, haversine, pathKm, priceFor, MAPS, IMG };
init();
