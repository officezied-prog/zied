<script>
'use strict';
const CONFIG = { API_URL: 'https://ziedapp.app.n8n.cloud/webhook/khair-pos', FIELD_URL: 'https://ziedapp.app.n8n.cloud/webhook/khair-field', TZ: 'Asia/Jakarta', CURRENCY: 'IDR' };
CONFIG.PHOTO_URL = 'https://ziedapp.app.n8n.cloud/webhook/khair-pos-photo';
CONFIG.CHAT_URL = 'https://ziedapp.app.n8n.cloud/webhook/khair-chat';
const APP_VERSION = 'sales-1.0.0';
// ?demo=1 = demo data (like ?mock=1) with an open login: tap a name, no store key or PIN. &u=Name logs that person in directly.
const DEMO = /[?&]demo=1\b/.test(location.search);
const MOCK = DEMO || /[?&]mock=1\b/.test(location.search);
/* Same prefix as the owner and cashier apps (same origin): store key, language and the user list are
   shared on this device. Everything that belongs to Khair Sales lives under the extra "sales." prefix. */
const PREFIX = MOCK ? 'kpos.mock.' : 'kpos.';
const FIELD_ACTIONS = ['field_bootstrap', 'day_start', 'day_end', 'track', 'check_in', 'field_order', 'list_field', 'update_order', 'set_product_image', 'product_images'];

/* ========== Small utilities ========== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ESC_MAP[c]);
const int = v => { const n = Math.round(Number(v)); return Number.isFinite(n) ? n : 0; };
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const roundQty = q => Math.round(num(q) * 1000) / 1000;
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();

const NF = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const NFQ = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 3 });
const NF1 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtRp = n => (int(n) < 0 ? '-Rp ' : 'Rp ') + NF.format(Math.abs(int(n)));
const fmtNum = n => NF.format(int(n));
const fmtQty = q => NFQ.format(num(q));
const fmtPct = p => NF1.format(Number.isFinite(p) ? p : 0) + '%';

/** Parse "Rp 12.500", "12.500", "12,500.50", "1,5" … to a number (Indonesian-aware). */
function parseNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim().replace(/rp\.?/i, '').replace(/idr/i, '').replace(/[\s ]/g, '');
  if (!s) return 0;
  const neg = /^-|^\(.*\)$/.test(s);
  s = s.replace(/[^\d.,]/g, '');
  const lastDot = s.lastIndexOf('.'), lastCom = s.lastIndexOf(',');
  if (lastDot >= 0 && lastCom >= 0) {
    const dec = lastDot > lastCom ? '.' : ',';
    const thou = dec === '.' ? ',' : '.';
    s = s.split(thou).join('').replace(dec, '.');
  } else if (lastCom >= 0) {
    const parts = s.split(',');
    s = (parts.length > 2 || (parts[1] && parts[1].length === 3)) ? parts.join('') : parts.join('.');
  } else if (lastDot >= 0) {
    const parts = s.split('.');
    s = (parts.length > 2 || (parts[1] && parts[1].length === 3)) ? parts.join('') : s;
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? (neg ? -n : n) : 0;
}
/** Read a money input ("12.500" or "12500") as integer Rupiah. */
const moneyVal = v => Math.max(0, int(parseNum(v)));
const qtyVal = v => roundQty(String(v).includes(',') && !String(v).includes('.') ? String(v).replace(',', '.') : parseNum(v));

/* ========== Dates (Asia/Jakarta) ========== */
const DTF_DATE = new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const DTF_TIME = new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const DTF_HOUR = new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.TZ, hour: '2-digit', hour12: false });
const jktDate = (d = new Date()) => DTF_DATE.format(new Date(d));
const jktTime = d => { try { return DTF_TIME.format(new Date(d)); } catch (e) { return ''; } };
const jktHour = d => { try { return int(DTF_HOUR.format(new Date(d))) % 24; } catch (e) { return 0; } };
const today = () => jktDate(new Date());
/** ISO timestamp with +07:00 offset, e.g. 2026-10-06T11:50:00+07:00 */
function jktISO(d = new Date()) { const x = new Date(new Date(d).getTime() + 7 * 3600000).toISOString(); return x.slice(0, 19) + '+07:00'; }
const ADJUST_SUPPLIER = 'PENYESUAIAN STOK';
const isAdjustRow = r => String(r && r.supplier || '').trim().toUpperCase() === ADJUST_SUPPLIER;
function addDays(ymd, n) { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function fmtDate(ymd) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd || '')); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(ymd || ''); }
function fmtDateTime(iso, ymd) { return `${fmtDate(ymd || (iso ? jktDate(iso) : ''))} ${iso ? jktTime(iso) : ''}`.trim(); }
function monthStart(ymd) { return ymd.slice(0, 8) + '01'; }
function monthEnd(ymd) { const [y, m] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }

/* ========== Storage (always guarded) ========== */
const store = {
  get(k, def = null) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(PREFIX + k); } catch (e) { } }
};

/* ========== IDs & hashing ========== */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.random() * 256 | 0; }
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
/** Pure-JS SHA-256 fallback for non-secure contexts (e.g. http on a LAN IP). */
function sha256Fallback(str) {
  const bytes = new TextEncoder().encode(str);
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
  const bits = len * 8; for (let i = 0; i < 4; i++) m[total - 1 - i] = (bits >>> (8 * i)) & 255;
  m[total - 5] = Math.floor(bits / 2 ** 32) & 255;
  const W = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = (m[o + 4 * i] << 24) | (m[o + 4 * i + 1] << 16) | (m[o + 4 * i + 2] << 8) | m[o + 4 * i + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(W[i - 15], 7) ^ r(W[i - 15], 18) ^ (W[i - 15] >>> 3), s1 = r(W[i - 2], 17) ^ r(W[i - 2], 19) ^ (W[i - 2] >>> 10); W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha256Hex(str) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { }
  return sha256Fallback(str);
}
const pinHash = (key, user, pin) => sha256Hex(`${key}:${String(user).toLowerCase()}:${pin}`);

/** Phone → wa.me number (62…). */
function waNumber(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('0')) d = '62' + d.slice(1);
  else if (d.startsWith('8')) d = '62' + d;
  return d.length >= 9 ? d : '';
}
function waLink(phone, text) { const n = waNumber(phone); return `https://wa.me/${n}?text=${encodeURIComponent(text)}`; }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}


/* Khair-Sales-only storage (same device storage as the owner app, separate keys). */
const FS = {
  get: (k, d) => store.get('sales.' + k, d),
  set: (k, v) => store.set('sales.' + k, v),
  del: k => store.del('sales.' + k)
};

/* Session (security H2): the live pin_hash stays in this tab only (sessionStorage, memory fallback) and is wiped on lock /
   logout; localStorage keeps just {user, role}. Offline login compares a verifier: store 'pins' = {[user lower]: {o, role}},
   o = sha256('offline:' + pin_hash) (same format as the owner and cashier apps). */
const SESS_KEY = PREFIX + 'sales.session';
let memSess = null;
const SESS = {
  get() { try { const v = sessionStorage.getItem(SESS_KEY); if (v) return JSON.parse(v); } catch (e) { } return memSess; },
  set(v) { memSess = v; try { sessionStorage.setItem(SESS_KEY, JSON.stringify(v)); } catch (e) { } },
  del() { memSess = null; try { sessionStorage.removeItem(SESS_KEY); } catch (e) { } }
};
const offlineVerifier = hash => sha256Hex('offline:' + hash);
async function migrateSecrets() {
  const pins = store.get('pins', {});
  let changed = false;
  for (const k of Object.keys(pins || {})) { const e = pins[k]; if (e && e.h) { if (!e.o) e.o = await offlineVerifier(e.h); delete e.h; changed = true; } }
  if (changed) store.set('pins', pins);
  const ls = FS.get('session');
  if (ls && ls.pin_hash !== undefined) { if (ls.pin_hash && !SESS.get()) SESS.set({ user: ls.user, role: ls.role, pin_hash: ls.pin_hash }); FS.set('session', { user: ls.user, role: ls.role }); }
}
/** The store key is never shown in full. */
const maskKey = k => k ? '••••' + String(k).slice(-4) : '';

/* ========== API client (copied from the owner app) ========== */
class ApiError extends Error { constructor(code, message) { super(message || code); this.code = code || 'SERVER'; } }
class NetError extends Error { constructor(message) { super(message || 'NETWORK'); this.code = 'NETWORK'; } }
/** Only real network failures/timeouts are queued; an {ok:false} answer is shown, never queued. */
const isRetryable = e => e instanceof NetError;

let inflight = 0;
function setBusy(d) { inflight = Math.max(0, inflight + d); document.body.classList.toggle('busy', inflight > 0); }
async function apiRaw(action, data, cred, opts = {}) {
  setBusy(1);
  try { return await apiRawInner(action, data, cred, opts); } finally { setBusy(-1); }
}
async function apiRawInner(action, data, cred, opts) {
  const body = { action, key: cred.key };
  if (cred.user) body.user = cred.user;
  if (cred.pin_hash) body.pin_hash = cred.pin_hash;
  body.data = data || {};
  // v11: main-API requests (not the field workflow, not photos) say where this device is
  if (!FIELD_ACTIONS.includes(action) && !opts.photo && cred.user && action !== 'users' && action !== 'setup') { body.data = Object.assign({}, body.data, { device: devicePayload() }); DEV.lastMain = Date.now(); }
  let res;
  if (MOCK) {
    res = await MockServer.request(clone(body));
  } else {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), opts.timeout || 20000);
    let r, txt;
    try {
      r = await fetch(opts.chat ? CONFIG.CHAT_URL : FIELD_ACTIONS.includes(action) ? CONFIG.FIELD_URL : opts.photo ? CONFIG.PHOTO_URL : CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' });

  const pt = { lat: Math.round(p.lat * 1e6) / 1e6, lng: Math.round(p.lng * 1e6) / 1e6, acc: Math.round(num(p.acc)), t: new Date(now).toISOString() };

/* ========== Product images (cached by image_updated in IndexedDB, memory fallback) ========== */
const IMG = { mem: {}, db: null, loading: false };
function idb() {
  if (IMG.db) return IMG.db;
  IMG.db = new Promise(res => {
    try { const rq = indexedDB.open('khair-sales', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('img'); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); } catch (e) { res(null); }
  });
  return IMG.db;
}
async function idbGet(k) { const d = await idb(); if (!d) return null; return new Promise(res => { try { const r = d.transaction('img').objectStore('img').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } }); }
async function idbPut(k, v) { const d = await idb(); if (!d) return; return new Promise(res => { try { const tx = d.transaction('img', 'readwrite'); tx.objectStore('img').put(v, k); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } }); }
/** base64 without prefix → data URL (JPEG "/9j/", PNG "iVBOR", SVG "PHN2Zy"/"PD94"). */
function b64Url(b) { b = String(b || ''); if (b.startsWith('data:')) return b; const mime = b.startsWith('/9j/') ? 'image/jpeg' : b.startsWith('iVBOR') ? 'image/png' : b.startsWith('UklGR') ? 'image/webp' : (b.startsWith('PHN2Zy') || b.startsWith('PD94')) ? 'image/svg+xml' : 'image/jpeg'; return `data:${mime};base64,${b}`; }
async function loadImages() {
  if (IMG.loading) { IMG.again = true; return; } IMG.loading = true; IMG.again = false;
  try {
    const need = []; let got = 0;
    for (const p of S.products.filter(p => p.image_updated)) {
      const m = IMG.mem[p.id];
      if (m && m.u === p.image_updated) continue;
      const c = await idbGet('p' + p.id);
      if (c && c.u === p.image_updated) { IMG.mem[p.id] = c; got++; continue; }
      need.push(p.id);
    }
    if (need.length) {
      const r = await api('product_images', { ids: need });
      for (const im of r.images || []) {
        const p = prodById(im.product_id); if (!p) continue;
        const v = { u: p.image_updated || im.image_updated || '', d: b64Url(im.image_base64) };
        IMG.mem[p.id] = v; await idbPut('p' + p.id, v);
      }
      FS.set('img_fetches', (FS.get('img_fetches', 0) || 0) + 1);
      got++;
    }
    if (got && S.view === 'catalog') drawCatalogGrid();
    if (got && $('#present')) drawPresent();
  } catch (e) { } finally { IMG.loading = false; if (IMG.again) loadImages(); }
}
const imgOf = p => (IMG.mem[p.id] && IMG.mem[p.id].d) || '';
function imgHTML(p, cls) { const d = imgOf(p); return d ? `<img class="${cls}" src="${esc(d)}" alt="${esc(p.name)}" data-img="${esc(p.id)}" loading="lazy">` : `<div class="${cls} ph" aria-hidden="true">${esc(String(p.name || '?').trim().charAt(0))}</div>`; }
function stockLevel(p) { const s = num(p.stock); if (s <= 0) return 'habis'; if (s <= Math.max(num(p.min_stock), 0) || s < Math.max(3, num(p.wholesale_min_qty))) return 'sedikit'; return 'ada'; }

/* ========== Map: Leaflet (vendor/leaflet + OSM tiles) when available, SVG plot otherwise ========== */
const MAPS = { failed: false };
function renderMap(el, { points = [], shops = [], current = null, tall = false }) {
  if (!el) return;
  el.className = 'map' + (tall ? ' tall' : '');
  const useLeaflet = window.L && navigator.onLine && !MAPS.failed;
  if (useLeaflet) { try { return leafletMap(el, points, shops, current); } catch (e) { MAPS.failed = true; } }
  svgMap(el, points, shops, current);
}
function leafletMap(el, points, shops, current) {
  el.dataset.mode = 'leaflet'; el.innerHTML = '';
  const m = window.L.map(el, { zoomControl: false, attributionControl: true });
  let errs = 0, loaded = 0;
  const tiles = window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  tiles.on('tileload', () => { loaded++; });
  tiles.on('tileerror', () => { if (++errs >= 3 && !loaded) { MAPS.failed = true; try { m.remove(); } catch (e) { } svgMap(el, points, shops, current); } });
  const ll = [];
  if (points.length > 1) { const line = points.map(p => [p.lat, p.lng]); window.L.polyline(line, { color: '#1E40AF', weight: 4 }).addTo(m); ll.push(...line); }
  shops.forEach(s => { if (!validPos(s)) return; ll.push([s.lat, s.lng]); window.L.circleMarker([s.lat, s.lng], { radius: 7, color: '#fff', weight: 2, fillColor: shopColor(s), fillOpacity: 1 }).bindTooltip(esc(s.name + ' · ' + shopLabel(s))).addTo(m); }); // Leaflet tooltips are HTML: escape (security C1) // colour = shop group
  if (validPos(current)) { ll.push([current.lat, current.lng]); window.L.circleMarker([current.lat, current.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1E40AF', fillOpacity: 1 }).addTo(m); }
  if (ll.length) m.fitBounds(ll, { padding: [24, 24], maxZoom: 17 }); else m.setView([-6.2655, 106.8605], 14);
}
function svgMap(el, points, shops, current) {
  el.dataset.mode = 'svg';
  const all = points.concat(shops.filter(validPos)).concat(validPos(current) ? [current] : []);
  if (!all.length) { el.innerHTML = `<div class="empty" style="padding-top:80px">${esc(t('map.empty'))}</div>`; return; }
  let minLat = Math.min(...all.map(p => p.lat)), maxLat = Math.max(...all.map(p => p.lat)), minLng = Math.min(...all.map(p => p.lng)), maxLng = Math.max(...all.map(p => p.lng));
  const k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  let w = Math.max((maxLng - minLng) * k, 0.002), h = Math.max(maxLat - minLat, 0.002);
  const W = 400, Hh = el.classList.contains('tall') ? 340 : 220, pad = 18;
  const sc = Math.min((W - 2 * pad) / w, (Hh - 2 * pad) / h);
  const cx = (minLng + maxLng) / 2, cy = (minLat + maxLat) / 2;
  const X = p => (W / 2 + (p.lng - cx) * k * sc).toFixed(1), Y = p => (Hh / 2 - (p.lat - cy) * sc).toFixed(1);
  const grid = Array.from({ length: 9 }, (_, i) => `<path d="M${i * 50} 0V${Hh}M0 ${i * 50}H${W}" stroke="#D5DEEC" stroke-width="1"/>`).join('');
  const line = points.length > 1 ? `<polyline points="${points.map(p => X(p) + ',' + Y(p)).join(' ')}" fill="none" stroke="#1E40AF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>` : '';
  const start = points.length ? `<circle cx="${X(points[0])}" cy="${Y(points[0])}" r="5" fill="#fff" stroke="#1E40AF" stroke-width="3"/>` : '';
  const sh = shops.filter(validPos).map(s => `<g data-shop="${esc(s.shop_id)}" data-group="${esc(shopGroup(s))}"><circle cx="${X(s)}" cy="${Y(s)}" r="7" fill="${shopColor(s)}" stroke="#fff" stroke-width="2"><title>${esc(s.name + ' · ' + shopLabel(s))}</title></circle></g>`).join('');
  const cur = validPos(current) ? `<circle cx="${X(current)}" cy="${Y(current)}" r="12" fill="#1E40AF" opacity=".18"/><circle cx="${X(current)}" cy="${Y(current)}" r="6" fill="#1E40AF" stroke="#fff" stroke-width="2.5"/>` : '';
  const kmw = (W - 2 * pad) / sc * 111.32 / k * k; // width of the box in km (approx.)
  el.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(t('map.label'))}"><rect width="${W}" height="${Hh}" fill="#EEF3FA"/>${grid}${line}${start}${sh}${cur}</svg><div class="note">${esc(t('map.offline'))} · ≈ ${NF1.format(kmw)} km</div>`;
}

/** ≤ 400 px, JPEG ~0.6, and at most 45 KB of base64. */
async function photoThumb(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = url; });
    for (const [max, q] of [[400, 0.6], [400, 0.5], [360, 0.45], [320, 0.4], [280, 0.35]]) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const b = c.toDataURL('image/jpeg', q).split(',')[1];
      if (b.length <= 45 * 1024) return b;
    }
    throw new Error('too big');
  } finally { URL.revokeObjectURL(url); }
}

function bindSwipe(el) {
  let x0 = null, y0 = null;
  // a swipe that starts on the product photo must not become a native image drag (that cancels the pointer)
  el.addEventListener('dragstart', e => e.preventDefault());
  el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener('pointerup', e => {
    if (x0 == null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { const fwd = (dx < 0) !== (S.lang === 'ar'); presentStep(fwd ? 1 : -1); }
  });
}

function priceFor(p, qty, shop) {
  const cust = shop && shop.customer_id ? S.customers.find(c => c.id == shop.customer_id) : null;
  const hasW = int(p.wholesale_price) > 0, wmin = num(p.wholesale_min_qty);

  'day-start': () => dayStart(),

  'visit-shop': el => { resetCheckin(el.dataset.id); go('visit', true); },
  'ci-locate': () => { CI.fix = null; locate(); },
  'ci-pick': el => { CI.shop_id = el.dataset.id; CI.isNew = false; CI.re = null; RENDER.visit(); },
  'ci-unpick': () => { CI.shop_id = ''; CI.isNew = false; CI.re = null; RENDER.visit(); },

  'ci-recat-cancel': () => { CI.re = null; RENDER.visit(); },

  'tp-groups': () => { const st = tpState(); if (!st) return; st.group = ''; st.q = ''; drawTP(); },
  'tp-type': el => tpPick(el.dataset.t),
  'tp-change': () => { const st = tpState(); if (!st) return; st.orig = st.orig || st.type; st.type = ''; st.q = ''; drawTP(); },
  'tp-chain': el => { const st = tpState(); if (!st) return; st.chain = st.chain === el.dataset.c ? '' : el.dataset.c; drawTP(); },

  'ci-next': el => { CI.next = el.dataset.n ? addDays(today(), +el.dataset.n) : ''; $('#ci-next').value = CI.next; },
  'ci-photo-del': () => { CI.photo = ''; CI.photoKB = 0; RENDER.visit(); },
  'ci-save': () => saveCheckin(),

  'present-close': () => closePresent(),
  'present-prev': () => presentStep(S.lang === 'ar' ? 1 : -1),
  'present-next': () => presentStep(S.lang === 'ar' ? -1 : 1),
  'present-add': () => { const p = CAT.list[CAT.idx]; orderLineQtyAdd(p, 1); toast(t('cat.added', { name: p.name }), 'ok', 1600); },
  'po-shop': () => pickShop(s => { if (!s) return; S.cart.shop_id = s.shop_id; S.cart.visit_id = ''; saveOrderCart(); RENDER.order(); }),
  'po-add': el => { orderLineQtyAdd(prodById(el.dataset.id), 1); RENDER.order(); },
  'po-inc': el => { S.cart.lines[+el.dataset.i].qty = roundQty(Math.floor(S.cart.lines[+el.dataset.i].qty) + 1); saveOrderCart(); RENDER.order(); },
  'po-dec': el => { const l = S.cart.lines[+el.dataset.i]; const nq = Math.ceil(l.qty) - 1; if (nq <= 0) S.cart.lines.splice(+el.dataset.i, 1); else l.qty = nq; saveOrderCart(); RENDER.order(); },
  'po-save': () => saveOrder(),
  'sh-map': () => { SH.map = !SH.map; RENDER.shops(); },
  'sh-group': el => { SH.group = el.dataset.g || ''; RENDER.shops(); },
  'sh-mode': el => { SH.mode = el.dataset.m === 'target' ? 'target' : 'mine'; RENDER.shops(); $('#v-shops').scrollTop = 0; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(errMsg(err), 'err'); });
});
document.addEventListener('keydown', e => {
  if (!$('#login').hidden && (L.step === 'pin' || L.step === 'newpin') && !modalStack.length) {
    if (/^\d$/.test(e.key)) { if (L.pin.length < 6 && !$('#pinpad[data-locked]')) { L.pin += e.key; L.err = ''; renderLogin(); } e.preventDefault(); return; }
    if (e.key === 'Backspace') { L.pin = L.pin.slice(0, -1); renderLogin(); e.preventDefault(); return; }
    if (e.key === 'Enter') { submitPin(); e.preventDefault(); return; }
  }
  if ($('#present')) { if (e.key === 'ArrowRight') presentStep(S.lang === 'ar' ? -1 : 1); else if (e.key === 'ArrowLeft') presentStep(S.lang === 'ar' ? 1 : -1); else if (e.key === 'Escape') closePresent(); return; }
  if (e.key === 'Escape' && modalStack.length) { e.preventDefault(); closeModal(); }
});

async function demoStillOpen() {
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return true;
  try {
    const r = await fetch('../demo.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) return false;
    if (!r.ok) return true;
    const j = await r.json();
    try { localStorage.setItem('kdemo.until', j.until ? String(j.until) : ''); } catch (e) { }
    const now = Date.parse(r.headers.get('date') || '') || Date.now();
    return j.open === true && !(j.until && now > Date.parse(j.until));
  } catch (e) { // offline: only the last known expiry can be checked
    let u = ''; try { u = localStorage.getItem('kdemo.until') || ''; } catch (e2) { }
    return !(u && Date.now() > Date.parse(u));
  }
}
function showDemoClosed() {

async function init() {
  applyLangAttrs();
  if (MOCK && !(await demoStillOpen())) { showDemoClosed(); return; }
  if ('serviceWorker' in navigator && /^https:|^http:\/\/(localhost|127\.0\.0\.1)/.test(location.href) && !/[?&]nosw\b/.test(location.search)) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
  }
  if (MOCK) { try { await MockServer.ensure(); } catch (e) { console.error(e); } }
  try { await migrateSecrets(); } catch (e) { console.error(e); }
  const sess = FS.get('session'), live = SESS.get();
  if (DEMO) {
    if (!S.key) { S.key = 'demo'; store.set('key', 'demo'); }
    const want = new URLSearchParams(location.search).get('u');
    if (want && !(sess && sess.user && sess.user.toLowerCase() === want.toLowerCase())) { demoLogin(want); return; }
  }
  if (S.key && sess && sess.user && live && live.pin_hash && live.user === sess.user) {
    S.user = sess.user; S.role = sess.role; S.pin_hash = live.pin_hash;
    const cd = FS.get(uk('day')); if (cd && cd.day_date === today()) S.day = cd;
    enterApp(false); return;
  }
  const last = (sess && sess.user) || FS.get('last_user', '');
  if (S.key) { if (last) { L.sel = last; showLogin('pin'); } else showLogin('users'); return; }
  showLogin('key');
}
