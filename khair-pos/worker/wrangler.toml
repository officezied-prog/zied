# Cloudflare Worker config for Khair Mart Jumla (الخير مارت جملة) — the code backend that
# replaces n8n. The old n8n workflows are kept as a reference and are not touched.
# STORE_KEY, GOOGLE_PLACES_KEY (and optional ANTHROPIC_API_KEY) are secrets, NOT set here:
#   wrangler secret put STORE_KEY   (or Cloudflare dashboard → Settings → Variables and Secrets → type Secret)
# database_id is filled in at cut-over: `wrangler d1 create khair_mart_jumla` prints it.
name = "khair-mart-jumla"
main = "src/index.js"
compatibility_date = "2025-06-01"
# Keep variables the owner adds in the Cloudflare dashboard (e.g. a key added as a plain "Variable" instead of a
# "Secret") when this Worker is deployed again — otherwise `wrangler deploy` would silently remove them.
keep_vars = true
# v36: photos are kept in the R2 bucket "khair-mart-photos" (binding PHOTOS). The binding is NOT written here on purpose:
# a deploy that binds a bucket which does not exist fails. .github/workflows/worker-deploy.yml creates the bucket when
# needed and appends the [[r2_buckets]] block only when it exists. For a manual deploy with photos, append:
#   [[r2_buckets]]
#   binding = "PHOTOS"
#   bucket_name = "khair-mart-photos"

[[d1_databases]]
binding = "DB"
database_name = "khair_mart_jumla"
database_id = "9330a847-d474-45bd-9400-ebad5bf01a27"

# v63 (Khair Order Brad, stage 3 — the Lalamove car booked automatically): every 2 minutes the Worker reads the open Lalamove
# trips again (src/index.js scheduled → src/brad.js handleLalaCron). Without the secrets LALAMOVE_KEY / LALAMOVE_SECRET it does
# nothing; with them and no open trip it is one small D1 read. LALAMOVE_ENV ('production' to go live) is a plain variable set in
# the dashboard, NOT here: a [vars] value in this file would be put back on every deploy.
[triggers]
crons = ["*/2 * * * *"]
