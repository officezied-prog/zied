async function api(action, data) {
  const body = { action, key: S.key, user: S.user, pin_hash: S.pin_hash, data: data || {} };
  let r;
  try {
    if (MOCK) r = await KColdMock.api(body);
    else r = await (await fetch(CONFIG.COLD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body), cache: 'no-store' })).json();
  } catch (e) { r = { ok: false, error: 'NETWORK', message: t('err_net') }; }
  if (!r || r.ok !== true) {
    const e = r || { ok: false, error: 'SERVER', message: 'Server error' };
    if (action !== 'login' && ['BAD_PIN', 'BAD_KEY', 'LOCKED', 'PIN_CHANGE_REQUIRED'].includes(e.error)) { logout(); }
    throw e;
  }
  return r;
}

}

    h('div', { class: 'card' }, list.length ? table([t('name'), [t('phone'), 'hp']].concat(can() ? [''] : []), rows, { id: 'cu-tbl' }) : h('p', { class: 'muted', text: t('none') })));
}
function custForm(c) {
  const name = h('input', { id: 'cu-name', value: c ? c.name : '' }), phone = h('input', { id: 'cu-phone', inputmode: 'tel', value: c ? c.phone : '' }), addr = h('input', { id: 'cu-addr', value: c ? c.address : '' });
  modal(c ? t('edit') + ' ' + c.name : t('cu_add'), h('div', null, field(t('name'), name), field(t('phone'), phone), field(t('address'), addr)),
    [h('button', { class: 'btn pri', type: 'button', id: 'cu-save', onclick: async () => { if (await act('customer_save', { id: c ? c.id : undefined, name: name.value, phone: phone.value, address: addr.value })) closeModal(); } }, t('save'))]);
}

/* ---------- start ---------- */
$('#lang').addEventListener('click', () => { S.lang = S.lang === 'ar' ? 'id' : 'ar'; LS.set('kcold.lang', S.lang); try { if (window.KChatUI) KChatUI.setLang(S.lang); } catch (e) { } if (S.D) render(); else { render(); renderLogin(); } });
$('#logout').addEventListener('click', logout);
// back to the owner app (same tab, so its login is kept); only shown when this page is opened on its own
$('#home').addEventListener('click', () => { location.href = '../' + location.search; });
// inside the owner app: follow its language / light-dark choice live
if (EMBED) window.addEventListener('storage', e => {
  if (e.key === KP + 'lang') { S.lang = LS.get(KP + 'lang', 'id') === 'ar' ? 'ar' : 'id'; render(); if (!S.D) renderLogin(); }
  else if (e.key === KP + 'theme') { const th = LS.get(KP + 'theme', 'auto'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
(async function start() {
  render();
  S.key = LS.get('kcold.key', '') || LS.get(KP + 'key', '') || (MOCK ? 'demo' : '');
  // this tab's session: our own, or the owner app's (same site, same tab) — the PIN hash is never kept in localStorage
  // inside the owner app its login always wins (whoever is logged in there is who uses this page)
  const own = EMBED ? null : SS.get('kcold.session'), pos = SS.get(KP + 'session');
  const sess = own && own.pin_hash ? own : pos && pos.pin_hash && ['owner', 'manager', 'akuntan'].includes(pos.role) ? pos : null;
  if (S.key && sess) {
    S.user = sess.user; S.pin_hash = sess.pin_hash;
    try { const r = await api('login', {}); S.user = r.me.name; S.role = r.me.role; if (!EMBED) SS.set('kcold.session', { user: S.user, pin_hash: S.pin_hash, role: S.role }); await load(); chatStart(); return; }
    catch (e) { S.pin_hash = ''; }
  }
  renderLogin();
})();
</script>
</body>
